// CI-only test-worker experiment; NEVER change normal Gradle or release builds.
// Scope the fork limit to the JVM Debug unit test task. Android connected tests,
// R8 smoke, Gradle build tasks and signed release are untouched.
// Native libtorrent4j signal chaining and per-process Robolectric isolation remain
// configured in app/build.gradle.kts; parallel JVMs must retain exact test counts.
import org.gradle.api.tasks.testing.Test

gradle.beforeProject { project ->
    if (project.path == ":app") {
        project.tasks.withType(Test).configureEach { task ->
            if (task.name == "testDebugUnitTest") {
                task.maxParallelForks = 2
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.RepeatedAndroidIntakeTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.ConnectionDraftRestorationTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.ExternalSourceReplacementTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.RemoteSecondAddArtworkChoiceTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.RemoteAddViewModelLifetimeTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.create.SharedCreateDocumentTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.create.CreateTorrentScreenTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.LocalEngineStartupSettingsTest")
                task.filter.includeTestsMatching("io.github.gamesbyian.chunks.LocalRateLimitPreferenceTransactionTest")
                task.testLogging.exceptionFormat = "full"
            }
        }
    }
}
