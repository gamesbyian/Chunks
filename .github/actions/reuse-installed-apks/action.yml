name: Verify and stage exact installed Universal Add APKs
description: Reuse a successful same-commit manual disposable Universal Add build
inputs:
  run-id:
    description: Exact successful manual Universal Add producer run ID
    required: true
  github-token:
    description: Read-only Actions token for this repository
    required: true
runs:
  using: composite
  steps:
    - name: Verify producer run identity
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APK_RUN_ID: ${{ inputs.run-id }}
      run: bash tools/reuse_installed_apks.sh verify-run
    - uses: actions/download-artifact@v4
      with:
        name: chunks-protocol-apks
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ runner.temp }}/shared-installed-apks
    - name: Verify and stage exact APK pair
      shell: bash
      env:
        APK_RUN_ID: ${{ inputs.run-id }}
      run: bash tools/reuse_installed_apks.sh stage
