name: P0 protected native two-argument magnet peer-byte control

# EXACTLY ONE authenticated Add using Transdroid's native 2-argument load.start
# and exact-source cleanup on owner-authorized development Seedhost. No APK
# acceptance, no retry, no user torrent changes and no PR secrets.
on:
  pull_request:
    paths:
      - "tools/seedhost_magnet_twoarg_control_once.py"
      - ".github/workflows/seedhost-magnet-twoarg-control-once.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/seedhost-magnet-twoarg-control-once.yml"
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        required: true
        default: false
        description: "Authorize single known-public-source magnet native Add and exact-hash session-only cleanup"

permissions:
  contents: read

concurrency:
  group: chunks-android-seedhost-scope-mutation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/seedhost_magnet_readonly_forensics.py tools/seedhost_magnet_twoarg_control_once.py

  live-reference:
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
          ((github.event_name == 'workflow_dispatch' && inputs.apply) ||
           (github.event_name == 'push' &&
            contains(github.event.head_commit.message, 'one-time Seedhost twoarg magnet control (#1010)'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
      CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile scoped script before authenticated operations
        run: python3 -m py_compile tools/seedhost_magnet_readonly_forensics.py tools/seedhost_magnet_twoarg_control_once.py
      - name: Single native two-argument Add using known-good live peer source
        run: python3 tools/seedhost_magnet_twoarg_control_once.py
