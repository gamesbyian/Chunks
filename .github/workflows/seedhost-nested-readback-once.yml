name: Seedhost spent nested folder exact readback (read-only one-shot)
on:
  push:
    branches:
      - diagnostics/seedhost-nested-readback-20261114
    paths:
      - .github/workflows/seedhost-nested-readback-once.yml
permissions:
  contents: read
concurrency:
  group: chunks-seedhost-nested-readback-one-shot
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ github.repository == 'gamesbyian/Chunks' && github.run_attempt == 1 && github.ref == 'refs/heads/diagnostics/seedhost-nested-readback-20261114' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Read-only scan of previously spent exact nested run ID
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          CHUNKS_NESTED_RECONCILE_ONLY: authorized
          CHUNKS_NESTED_RECONCILE_RUN: "43643911533"
        run: |
          set -euo pipefail
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          private_log=$(mktemp)
          trap 'rm -f "$private_log"' EXIT
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostNestedCreateReconcileReadOnlyTest > "$private_log" 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import pathlib,sys,xml.etree.ElementTree as ET
          p=pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostNestedCreateReconcileReadOnlyTest.xml')
          if not p.is_file():
              print('CHUNKS_NESTED_RECONCILE: result-missing writes=zero')
              raise SystemExit(1)
          root=ET.parse(p).getroot()
          lines=(root.findtext('system-out') or '').splitlines()
          for line in lines:
              if line.startswith('CHUNKS_NESTED_RECONCILE: '): print(line[:240])
          good=(sys.argv[1]=='0' and int(root.get('tests','0'))==1
                and all(root.get(k)=='0' for k in ('failures','errors','skipped'))
                and any('completed=read-only writes=zero' in l for l in lines))
          print('CHUNKS_NESTED_RECONCILE: proof=' + ('passed' if good else 'failed') + ' writes=zero')
          raise SystemExit(0 if good else 1)
          PY
