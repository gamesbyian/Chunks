name: Build experimental Chunks reference-panel display font
on:
  push:
    paths:
      - 'tools/build_reference_panel_candidate.py'
      - 'tools/render_reference_panel_comparison.py'
      - 'tests/test_reference_panel_font.py'
      - 'assets/fonts/source/reference-alphabet/**'
      - 'assets/fonts/chunks/Chunks-ExtraBold.otf'
      - 'assets/fonts/experimental/**'
      - '.github/workflows/chunks-reference-panel-font.yml'
  pull_request:
    paths:
      - 'tools/build_reference_panel_candidate.py'
      - 'tools/render_reference_panel_comparison.py'
      - 'tests/test_reference_panel_font.py'
      - 'assets/fonts/source/reference-alphabet/**'
      - 'assets/fonts/chunks/Chunks-ExtraBold.otf'
      - 'assets/fonts/experimental/**'
      - '.github/workflows/chunks-reference-panel-font.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-experimental-font:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Convert 62 SVG masters to CFF cubic outlines
        run: python tools/build_reference_panel_candidate.py
      - name: Run nonshipping font construction and shaping parity tests
        run: python -m unittest discover -s tests -p test_reference_panel_font.py -v
      - name: Render side-by-side specimen from actual compiled OTFs
        run: python tools/render_reference_panel_comparison.py
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-reference-panel-otf-candidate
          path: |
            assets/fonts/experimental/ChunksReferencePanel-ExtraBold.otf
            chunks-reference-panel-otf-comparison.png
          retention-days: 30
      - name: Commit deterministic experimental OTF on source branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/experimental/ChunksReferencePanel-ExtraBold.otf
          if ! git diff --cached --quiet; then
            git commit -m 'build(fonts): compile 62-reference-glyph experimental CFF OTF'
            git push
          fi
      - name: Guard binary reproducibility on main
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- assets/fonts/experimental/ChunksReferencePanel-ExtraBold.otf