name: One-time protected Seedhost active-Start acceptance

# Owner-authorized development Seedhost mutations run only through deliberate
# trusted-main workflow_dispatch with apply_mutation=true. The special one-time
# push trigger was retired after accepted real-host run 41349305222.
on:
  workflow_dispatch:
    inputs:
      apply_mutation:
        description: "Authorize three synthetic transfers: native-start file and magnet, then file Add/priority/Start/Stop; session-erase each on development Seedhost"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: chunks-android-seedhost-scope-mutation
  cancel-in-progress: false

jobs:
  # Explicit manual dispatch may first gather read-only destination evidence
  # even when apply_mutation=false; never start a protected run on a push.
  existing-destination-preflight:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
      CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
      CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
      CHUNKS_LIVE_MUTATION: "readonly"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Read-only destination evidence, no Add or Start
        run: |
          set -euo pipefail
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          status=0
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.readOnlyExistingDestinationPreflight' || status=$?
          # Never print raw exception messages, host paths or private logs.
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          path = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.xml')
          if not path.exists():
              print('CHUNKS_DESTINATION_PREFLIGHT: no test report (compile or infrastructure failure)')
          else:
              root = ET.parse(path).getroot()
              for line in (root.findtext('system-out') or '').splitlines():
                  if line.startswith('CHUNKS_LIVE: preflight'):
                      print(line[:250])
              print('CHUNKS_DESTINATION_PREFLIGHT: tests=' + root.attrib.get('tests', '?') +
                    ' failures=' + root.attrib.get('failures', '?') +
                    ' errors=' + root.attrib.get('errors', '?') +
                    ' skipped=' + root.attrib.get('skipped', '?'))
          PY
          test "$status" -eq 0

  exact-hash-start:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.apply_mutation }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
      CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
      CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
      CHUNKS_LIVE_MUTATION: "apply"
      CHUNKS_LIVE_DIAGNOSE_ADD: "false"
    steps:
      - name: Refuse replay of a mutation dispatch
        if: ${{ github.run_attempt != 1 }}
        run: |
          echo '::error::A rerun cannot repeat protected mutations; inspect the prior run and dispatch a new explicitly scoped operation if appropriate.'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Owner-approved native started Add for .torrent and magnet
        env:
          # Distinct positive gate: routine unit/PR builds cannot activate it.
          CHUNKS_LIVE_NATIVE_STARTED_ADD: "apply"
        run: |
          set -euo pipefail
          test "${CHUNKS_LIVE_MUTATION:-}" = apply
          test "$CHUNKS_LIVE_NATIVE_STARTED_ADD" = apply
          gradle --no-daemon --console=plain :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.ownerAuthorizedNativeStartedAddFileAndMagnet'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.xml')
          r = ET.parse(p).getroot()
          assert int(r.attrib['tests']) == 1, 'Expected exactly one native fixture test'
          assert int(r.attrib['skipped']) == 0, 'Native test must actually execute'
          assert int(r.attrib['failures']) == 0 and int(r.attrib['errors']) == 0
          lines = (r.findtext('system-out') or '').splitlines()
          assert any('CHUNKS_LIVE: native result=two-started-active inventory-restored' in line for line in lines)
          print('CHUNKS_SEEDHOST_NATIVE_STARTED_ADD: two actual exact-hash active loads, cleanup verified')
          PY
      - name: Run exact-target owner-approved synthetic mutation and always erase
        run: |
          set -euo pipefail
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.ownerAuthorizedExactTargetMutationRoundTrip'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.xml'
          r = ET.parse(p).getroot()
          assert int(r.attrib['tests']) == 1, 'Expected exactly one guarded fixture acceptance'
          assert int(r.attrib['skipped']) == 0, 'Seedhost acceptance must actually execute'
          assert int(r.attrib['failures']) == 0 and int(r.attrib['errors']) == 0
          print('CHUNKS_SEEDHOST_ACTIVE_START: guarded synthetic Add, active Start, Stop and erase passed')
          PY
