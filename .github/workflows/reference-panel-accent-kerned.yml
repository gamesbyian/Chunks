name: Build complete Chunks Reference Panel accent kerning family
on:
  push:
    # Feature branches are validated by pull_request; only merged changes trigger push builds.
    branches: [main]
    paths:
      - 'tools/build_reference_accent_kerned.py'
      - 'tools/render_reference_accent_kerned.py'
      - 'tests/test_reference_accent_kerned.py'
      - 'assets/fonts/experimental/accent-studies/**'
      - 'assets/fonts/experimental/accent-kerned/**'
  pull_request:
    paths:
      - 'tools/build_reference_accent_kerned.py'
      - 'tools/render_reference_accent_kerned.py'
      - 'tests/test_reference_accent_kerned.py'
      - 'assets/fonts/experimental/accent-studies/**'
      - 'assets/fonts/experimental/accent-kerned/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-panel-kerned-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  generate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenType and real HarfBuzz rendering requirements
        run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Build all five CFF fonts in separate processes to bound memory use
        run: |
          for weight in 400 500 600 700 800; do
            python tools/build_reference_accent_kerned.py --weights "$weight"
          done
      - name: Verify 1,216 accents and all source shaping in compiled OTFs
        run: python -m unittest discover -s tests -p test_reference_accent_kerned.py -v
      - name: Render before/after specimens using actual generated OTFs
        run: python tools/render_reference_accent_kerned.py
      - name: Upload all five non-shipping family fonts and evidence
        uses: actions/upload-artifact@v4
        with:
          name: chunks-reference-panel-five-kerned-accent-fonts
          path: |
            assets/fonts/experimental/accent-kerned/*
            reference-accent-kerned-comparison.png
            assets/fonts/source/OFL.txt
          retention-days: 30