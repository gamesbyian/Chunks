name: Installed Combined two real rTorrent servers

# D1/C1 acceptance on two DISPOSABLE local rTorrent daemons only. No secrets,
# no protected host. Fixtures and exact app mutations stay on the runner's
# own stopped registrations.
on:
  pull_request:
    branches: [main]
    # Draft iterations must not launch disposable daemons, Gradle or emulators.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/CombinedTransfersScreen.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/model/UnifiedTransferCatalog.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/model/TransferSortOrdering.kt"
      # Navigation and remote header changes can break these real journeys.
      - "app/src/main/java/io/github/gamesbyian/chunks/MainActivity.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/CompactRemoteInventoryHeader.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/RememberedRemoteProfileRoster.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/RemoteStartupReconnectPolicy.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RemoteConnectIdentity.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/CombinedTwoRealServersInstrumentedTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/snapshots/RemoteSnapshotRestoreInstalledTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/snapshots/RemoteSnapshotSelectedPlaceInstalledTest.kt"
      - "tools/preload_combined_two_servers.py"
      - "tools/installed_combined_two_servers.sh"
      - "tools/combined_fault_controller.py"
      - "tools/interop/disposable_snapshot_folder_listing.py"
      - ".github/workflows/installed-combined-two-servers.yml"
      - ".github/actions/reuse-installed-apks/action.yml"
      - "tools/reuse_installed_apks.sh"
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Optional successful Installed Universal Add run at this exact commit'
        type: string
        required: false

  workflow_call:
    inputs:
      same_run_apks:
        type: boolean
        required: true
      artifact_name:
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: chunks-installed-combined-${{ inputs.same_run_apks && format('pilot-{0}', github.run_id) || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  two-server-combined:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the exact installed Universal Add APK pair
        if: inputs.same_run_apks || (github.event_name == 'workflow_dispatch' && inputs.apk_run_id != '')
        uses: ./.github/actions/reuse-installed-apks
        with:
          run-id: ${{ inputs.same_run_apks && github.run_id || inputs.apk_run_id }}
          same-run: ${{ inputs.same_run_apks && 'true' || 'false' }}
          artifact-name: ${{ inputs.artifact_name }}
          github-token: ${{ github.token }}
      - name: Record Combined APK reuse
        if: github.event_name == 'workflow_dispatch' && inputs.apk_run_id != ''
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          echo "CHUNKS_COMBINED_APK_REUSE: producer_run=$APK_RUN_ID source=$GITHUB_SHA build_skipped=true"
      - name: Start two disposable real rTorrent daemons behind SCGI proxies
        run: |
          bash tools/apt_install_retry.sh rtorrent nginx
          root="$RUNNER_TEMP/chunks-combined"
          for s in a b; do
            mkdir -p "$root/$s/data" "$root/$s/session"
          done
          # Only this tested child is selectable by the disposable server's
          # authenticated read-only ruTorrent folder browser.
          mkdir -p "$root/a/data/reviewed"
          nohup python3 -I tools/interop/disposable_snapshot_folder_listing.py "$root/a/data" \
            > "$root/folders.log" 2>&1 < /dev/null &
          start() {
            name=$1 scgi=$2 peer=$3
            cat > "$root/$name/rtorrent.rc" <<EOF
          directory.default.set = $root/$name/data
          session.path.set = $root/$name/session
          network.scgi.open_port = 127.0.0.1:$scgi
          network.port_range.set = $peer-$peer
          network.port_random.set = no
          protocol.pex.set = no
          dht.mode.set = disable
          system.daemon.set = true
          EOF
            nohup rtorrent -n -o "import=$root/$name/rtorrent.rc" > "$root/$name/rtorrent.log" 2>&1 < /dev/null &
            echo $! > "$root/$name/rtorrent.pid"
          }
          start a 5000 6890
          start b 5001 6891
          cat > "$root/nginx.conf" <<EOF
          worker_processes 1;
          pid $root/nginx.pid;
          error_log $root/nginx.error notice;
          events { worker_connections 64; }
          http {
            server {
              listen 127.0.0.1:18080;
              location /RPC2 {
                auth_basic "chunks-a";
                auth_basic_user_file /tmp/chunks-combined-a.htpasswd;
                include /etc/nginx/scgi_params; scgi_pass 127.0.0.1:5000;
              }
              # Same exact Basic-auth principal as /RPC2, not an anonymous
              # filesystem oracle or a connection to the other rTorrent host.
              location = /rutorrent/plugins/httprpc/action.php {
                auth_basic "chunks-a";
                auth_basic_user_file /tmp/chunks-combined-a.htpasswd;
                include /etc/nginx/scgi_params; scgi_pass 127.0.0.1:5000;
              }
              location = /rutorrent/plugins/_getdir/listdir.php {
                auth_basic "chunks-a";
                auth_basic_user_file /tmp/chunks-combined-a.htpasswd;
                proxy_pass http://127.0.0.1:18084;
              }
            }
            server { listen 127.0.0.1:18082; location /RPC2 { include /etc/nginx/scgi_params; scgi_pass 127.0.0.1:5001; } }
          }
          EOF
          # Disposable basic-auth login for server A only (C2 sign-in rejection).
          printf 'chunks:%s\n' "$(openssl passwd -apr1 chunks-one)" > /tmp/chunks-combined-a.htpasswd && chmod 644 /tmp/chunks-combined-a.htpasswd
          sudo nginx -c "$root/nginx.conf"
          # Fail early if nginx's SAME Basic-authenticated tenant mount does
          # not return the current root and only the precreated read-only child.
          # Never print the response body (which contains runner filesystem paths).
          folder_ok=0
          for attempt in $(seq 1 15); do
            if curl --silent --fail --max-time 3 -u chunks:chunks-one \
                'http://127.0.0.1:18080/rutorrent/plugins/_getdir/listdir.php?dir=' \
                -o "$root/folder-preflight.json" &&
               python3 -I -c 'import json,sys; j=json.load(open(sys.argv[1])); assert j=={"path":sys.argv[2],"directories":["reviewed"]}' \
                "$root/folder-preflight.json" "$root/a/data" 2>/dev/null; then
              folder_ok=1
              break
            fi
            sleep 0.4
          done
          test "$folder_ok" -eq 1 || { echo "::error::Exact-tenant read-only folder fixture preflight failed"; exit 1; }
          # The Android picker ALWAYS re-reads the resolved root by its exact
          # path, then opens the child. Guard both: an empty-request-only
          # fixture previously hid every folder even though its first GET passed.
          for suffix in "$root/a/data" "$root/a/data/reviewed"; do
            encoded="$(python3 -I -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$suffix")"
            curl --silent --fail --max-time 5 -u chunks:chunks-one \
              "http://127.0.0.1:18080/rutorrent/plugins/_getdir/listdir.php?dir=$encoded" \
              -o "$root/folder-exact-preflight.json" ||
                { echo "::error::Exact-tenant folder reread was refused"; exit 1; }
            python3 -I -c 'import json,sys; j=json.load(open(sys.argv[1])); expected=["reviewed"] if sys.argv[2] == sys.argv[3] else []; assert j == {"path":sys.argv[2],"directories":expected}' \
              "$root/folder-exact-preflight.json" "$suffix" "$root/a/data" 2>/dev/null ||
                { echo "::error::Exact-tenant folder reread was inconsistent"; exit 1; }
          done
          for port in 18080 18082; do
            for i in $(seq 1 40); do
              curl -fsS -u chunks:chunks-one -H 'Content-Type: text/xml' --data '<?xml version="1.0"?><methodCall><methodName>system.client_version</methodName></methodCall>' \
                "http://127.0.0.1:$port/RPC2" >/dev/null && break
              sleep 0.5
            done
          done
      - name: Preload same-hash and distinct stopped fixtures on both servers
        run: |
          python3 tools/preload_combined_two_servers.py \
            --a http://127.0.0.1:18080/RPC2 --a-user chunks --a-pass chunks-one --b http://127.0.0.1:18082/RPC2 \
            --dir-a "$RUNNER_TEMP/chunks-combined/a/data" --dir-b "$RUNNER_TEMP/chunks-combined/b/data" \
            --run "$GITHUB_RUN_ID" --receipt "$RUNNER_TEMP/chunks-combined/receipt.json"
      - name: Start disposable-only fault switch for server A
        run: |
          nohup python3 tools/combined_fault_controller.py "$RUNNER_TEMP/chunks-combined" \
            > "$RUNNER_TEMP/chunks-combined/fault.log" 2>&1 < /dev/null &
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !inputs.same_run_apks && (github.event_name != 'workflow_dispatch' || inputs.apk_run_id == '') }}
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        if: ${{ !inputs.same_run_apks && (github.event_name != 'workflow_dispatch' || inputs.apk_run_id == '') }}
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build app and instrumentation APKs
        if: ${{ !inputs.same_run_apks && (github.event_name != 'workflow_dispatch' || inputs.apk_run_id == '') }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Installed app Combined union, distinct origins and remembered reconnect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/installed_combined_two_servers.sh
      - name: Stop disposable daemons
        if: always()
        run: |
          for s in a b; do
            f="$RUNNER_TEMP/chunks-combined/$s/rtorrent.pid"
            [ -f "$f" ] && kill -TERM "$(cat "$f")" 2>/dev/null || true
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-installed-combined-two-servers
          path: |
            ${{ runner.temp }}/chunks-combined/receipt.json
            ${{ runner.temp }}/chunks-combined/evidence/
            ${{ runner.temp }}/chunks-combined/fault.log
          retention-days: 14
          if-no-files-found: warn
