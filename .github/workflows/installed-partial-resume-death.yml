name: Installed local resume after process death

# Installed Android libtorrent + SQLite resume store: a real loopback download
# killed mid-transfer restores its engine-owned checkpoint in a fresh process.
# Disposable app-private fixture only; no remote, tracker, DHT or user Place.
on:
  pull_request:
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalTorrentEngine.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalResumeDatabase.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalResumeStore.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/engine/LocalPartialResumeProcessDeathInstrumentedTest.kt"
      - "tools/installed_partial_resume_death.sh"
      - ".github/workflows/installed-partial-resume-death.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-installed-resume-death-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  installed-resume-death:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a synthetic PR merge with an unreviewed source tree
        if: github.event_name == 'pull_request'
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$EXACT_HEAD"
          git diff --quiet FETCH_HEAD HEAD || {
            echo "::error::PR synthetic merge differs from exact reviewed head; reconcile before accepting evidence"
            exit 1
          }
          echo "CHUNKS_RESUME_DEATH_SOURCE_TREE: exact head and installed checkout match"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build the source-matched app and Android instrumentation
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Installed kill mid-download, restore in a fresh process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/installed_partial_resume_death.sh ${{ matrix.api }}
      - name: Upload installed resume-death evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-resume-death-api${{ matrix.api }}
          path: ${{ runner.temp }}/chunks-resume-death-api${{ matrix.api }}/
          retention-days: 14
          if-no-files-found: warn
