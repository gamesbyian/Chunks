name: UnRAR decoder qualification (host only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/unrar-decoder-witness.yml"
      - "tools/rar_unrar_witness.*"
      - "app/src/androidTest/assets/rar-volume-review/**"
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unrar-decoder-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  decode:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pmachapman/unrar
          ref: cacdcb8cbe1813b6151e3f92f2ccec7afe4d6a41
          path: upstream-unrar
          persist-credentials: false
      - name: Build pinned UnRAR library (host experiment only)
        run: |
          set -euo pipefail
          test "$(git -C upstream-unrar rev-parse HEAD)" = cacdcb8cbe1813b6151e3f92f2ccec7afe4d6a41
          make -C upstream-unrar -j2 lib
          c++ -std=c++11 -D_UNIX -I upstream-unrar tools/rar_unrar_witness.cpp \
            upstream-unrar/libunrar.a -pthread -o "$RUNNER_TEMP/unrar-witness"
      - name: Actual test-mode callback bytes and refusal proof
        run: |
          set -euo pipefail
          printf 'CHUNKS_UNRAR_SOURCE: %s\n' "$(git -C upstream-unrar rev-parse HEAD)" | tee unrar-receipt.txt
          sha256sum "$RUNNER_TEMP/unrar-witness" | tee -a unrar-receipt.txt
          timeout 90s python3 tools/rar_unrar_witness.py app/src/androidTest/assets/rar-volume-review "$RUNNER_TEMP/unrar-witness" 2>&1 | tee -a unrar-receipt.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unrar-host-receipt-${{ github.run_attempt }}
          path: unrar-receipt.txt
          retention-days: 14
          if-no-files-found: warn
