name: Installed Chunks real rTorrent magnet lifecycle

on:
  # No automatic protected host mutations from a commit message or PR.
  # The real Seedhost test requires a manual dispatch with explicit Apply on main.
  pull_request:
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/TorrentLinkImport.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalEngineScreen.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/VerifiedAddScreen.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RTorrentRemote.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RemoteAddProgress.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/SeedhostAndroidAddUiInstrumentedTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/MainActivityRealMagnetJourney.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/HttpsPhoneAddJourneyInstrumentedTest.kt"
      - "tools/real_magnet_peer.py"
      - "tools/preload_disposable_magnet.py"
      - "tests/test_preload_disposable_magnet.py"
      - "tests/test_finish_installed_magnet_evidence.py"
      - "tools/installed_rtorrent_magnets.sh"
      - "tools/finish_installed_magnet_evidence.py"
      - "tools/parse_installed_magnet_add_receipt.py"
      - ".github/workflows/installed-rtorrent-magnets.yml"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      real_media:
        description: "Opt in to installed TVmaze/MusicBrainz/Open Library HTTPS and offline restart acceptance"
        type: boolean
        default: false
        required: true
      source:
        description: "Production source entry path (HTTPS reuses the same real peers and also qualifies phone Place)"
        type: choice
        options: [https, magnet]
        default: https
        required: true
      environment:
        description: "Real disposable rTorrent, or approved development Seedhost"
        type: choice
        options: [disposable, live]
        default: disposable
        required: true
      discovery:
        description: "Known real metadata peer, or ordinary public tracker/DHT discovery"
        type: choice
        options: [controlled, public]
        default: controlled
        required: true
      apply:
        description: "Authorize exact-hash live public magnet Add/Stop/Start/session Remove and peerless negative"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.environment == 'live') && 'chunks-android-seedhost-scope-mutation' || format('chunks-installed-magnets-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ inputs.environment != 'live' }}

jobs:
  installed-magnet-lifecycle:
    if: >-
      ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.environment == 'disposable' ||
            (github.ref == 'refs/heads/main' && inputs.apply && github.run_attempt == 1))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CHUNKS_CONTROLLED_PEER: "1"
      CHUNKS_REAL_MEDIA: ${{ github.event_name == 'workflow_dispatch' && inputs.real_media && '1' || '0' }}
      CHUNKS_HTTPS_ADD: ${{ inputs.source == 'magnet' && '0' || '1' }}
      CHUNKS_PUBLIC_DISCOVERY: ${{ inputs.discovery == 'public' && '1' || '0' }}
      CHUNKS_DISPOSABLE: ${{ (inputs.environment == 'live') && '0' || '1' }}
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
      CHUNKS_SIDE_BY_SIDE: "1"
      CHUNKS_LIVE_RUTORRENT_URL: ${{ (inputs.environment == 'live') && 'https://ianseeds.wood.seedhost.eu/rutorrent/' || 'http://127.0.0.1:18080/RPC2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Give this verified candidate a separate application identity
        run: printf 'CHUNKS_PREVIEW_SUFFIX=magnet%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Cheap receipt and controller checks before native build
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_installed_magnet_add_receipt.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_preload_disposable_magnet.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_finish_installed_magnet_evidence.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_installed_real_media.py
          python3 -m py_compile tools/real_magnet_peer.py tools/finish_installed_magnet_evidence.py
          bash -n tools/installed_rtorrent_magnets.sh
      - name: Start genuine public-magnet metadata and payload peer
        run: |
          sudo timeout 180s apt-get update -qq
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-libtorrent
          /usr/bin/python3 -m unittest discover -s tests -p test_real_peer_prefix.py
          peer_host=127.0.0.1
          if [ "$CHUNKS_DISPOSABLE" = 0 ]; then peer_host=5.79.112.219; fi
          nohup /usr/bin/python3 -u tools/real_magnet_peer.py \
            --root "$RUNNER_TEMP/chunks-real-peer" --peer-host "$peer_host" \
            > "$RUNNER_TEMP/chunks-peer-private.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/chunks-real-peer.pid"
      - name: Start disposable real rTorrent and SCGI proxy
        if: env.CHUNKS_DISPOSABLE == '1'
        run: |
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rtorrent nginx
          mkdir -p "$RUNNER_TEMP/chunks-disposable/data" "$RUNNER_TEMP/chunks-disposable/session"
          cat > "$RUNNER_TEMP/chunks-disposable/rtorrent.rc" <<EOF
          directory.default.set = $RUNNER_TEMP/chunks-disposable/data
          session.path.set = $RUNNER_TEMP/chunks-disposable/session
          network.scgi.open_port = 127.0.0.1:5000
          network.port_range.set = 6890-6890
          network.port_random.set = no
          protocol.pex.set = no
          dht.mode.set = disable
          throttle.global_down.max_rate.set = 128
          system.daemon.set = true
          EOF
          nohup rtorrent -n -o "import=$RUNNER_TEMP/chunks-disposable/rtorrent.rc" \
            > "$RUNNER_TEMP/chunks-disposable/rtorrent.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/chunks-disposable/rtorrent.pid"
          cat > "$RUNNER_TEMP/chunks-disposable/nginx.conf" <<EOF
          worker_processes 1;
          pid $RUNNER_TEMP/chunks-disposable/nginx.pid;
          error_log $RUNNER_TEMP/chunks-disposable/nginx.error notice;
          events { worker_connections 64; }
          http { access_log $RUNNER_TEMP/chunks-disposable/nginx.access;
            server { listen 127.0.0.1:18080;
            location /RPC2 { include /etc/nginx/scgi_params; scgi_pass 127.0.0.1:5000; }
          } }
          EOF
          sudo nginx -c "$RUNNER_TEMP/chunks-disposable/nginx.conf"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile the exact separately installable candidate and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Require independently verified available original pieces before Add
        run: |
          for probe in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:18081/ready \
                -o "$RUNNER_TEMP/chunks-peer-ready.json"; then exit 0; fi
            if [ -f "$RUNNER_TEMP/chunks-real-peer/PREPARATION-FAILURE.json" ]; then
              echo '::error::Public source preparation or independent native piece recheck failed; no Add'
              exit 1
            fi
            sleep 1
          done
          echo '::error::Known real metadata-serving peer unavailable; no Add'
          exit 1
      - name: Preload one genuine fixture on the disposable server only
        if: env.CHUNKS_DISPOSABLE == '1' && env.CHUNKS_PUBLIC_DISCOVERY != '1'
        run: python3 tools/preload_disposable_magnet.py
      - name: Prepare hardware-accelerated API35 emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Installed production phone and rTorrent source journeys with real peer pieces
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHUNKS_LIVE_RTORRENT_USER: ${{ (inputs.environment == 'live') && secrets.rtorrent_user || '' }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ (inputs.environment == 'live') && secrets.rtorrent_pass || '' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/installed_rtorrent_magnets.sh
      - name: Extract the disposable journey's exception stack (URLs redacted)
        if: failure() && env.CHUNKS_DISPOSABLE == '1'
        run: |
          raw="$RUNNER_TEMP/chunks-installed-magnets.raw"
          out="$RUNNER_TEMP/chunks-disposable/instrumentation-stack.txt"
          if [ -f "$raw" ]; then
            grep -A40 'INSTRUMENTATION_STATUS: stack=' "$raw" | head -80 \
              | sed -E 's#[a-zA-Z][a-zA-Z0-9+.-]*://[^ "]*#<url>#g' > "$out" || true
          fi
          # Name a disposable SERVER crash (upstream rakshasa libtorrent internal_error) so it is
          # never triaged as a Chunks or tunnel fault. The disposable environment holds no secrets.
          log="$RUNNER_TEMP/chunks-disposable/rtorrent.log"
          if [ -f "$log" ] && grep -q 'Caught internal_error' "$log"; then
            echo "::error title=Disposable rTorrent crashed::$(grep -m1 'Caught internal_error' "$log" | cut -c1-160)"
          fi
      - name: Verify disposable precompleted bytes were preserved
        if: env.CHUNKS_DISPOSABLE == '1' && env.CHUNKS_PUBLIC_DISCOVERY != '1'
        run: |
          cmp "$RUNNER_TEMP/chunks-real-peer/magnet0/chunks-precompleted-control.bin" \
              "$RUNNER_TEMP/chunks-disposable/data/chunks-precompleted-control.bin"
      - name: Retain independent peer counters and stop owned runner processes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/chunks-real-peer.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/chunks-real-peer.pid")" 2>/dev/null || true
            for probe in $(seq 1 20); do
              kill -0 "$(cat "$RUNNER_TEMP/chunks-real-peer.pid")" 2>/dev/null || break
              sleep 0.2
            done
          fi
          if [ -f "$RUNNER_TEMP/chunks-disposable/rtorrent.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/chunks-disposable/rtorrent.pid")" 2>/dev/null || true
          fi
      - name: Always create exact-source receipts and actual runner-derived JUnit
        if: always()
        run: |
          python3 tools/finish_installed_magnet_evidence.py --runner-temp "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/chunks-installed-magnet-evidence"
      - name: Upload complete acceptance or actionable failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-installed-magnets-${{ inputs.environment || 'disposable' }}-evidence
          path: ${{ runner.temp }}/chunks-installed-magnet-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Retain bounded peer and UI timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-controlled-peer-timing
          path: |
            ${{ runner.temp }}/chunks-real-peer/PEER-TIMELINE.json
            ${{ runner.temp }}/chunks-peer-ui-witness.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Retain opt-in real-provider installed acceptance
        if: always() && env.CHUNKS_REAL_MEDIA == '1'
        uses: actions/upload-artifact@v4
        with:
          name: chunks-installed-real-media
          path: ${{ runner.temp }}/chunks-real-media/
          retention-days: 14
          if-no-files-found: error
      - name: Retain phone HTTPS evidence even if remote acceptance fails
        if: always() && env.CHUNKS_HTTPS_ADD == '1'
        uses: actions/upload-artifact@v4
        with:
          name: chunks-https-phone-evidence
          path: |
            ${{ runner.temp }}/chunks-https-phone.raw
            ${{ runner.temp }}/chunks-https-phone.xml
            ${{ runner.temp }}/chunks-https-phone-digest.json
            ${{ runner.temp }}/chunks-https-phone-witness.txt
            ${{ runner.temp }}/chunks-https-phone-crash.txt
          if-no-files-found: warn
          retention-days: 14
      # Disposable only (no credentials, no protected host): the proxy/rTorrent side of an
      # RPC non-2xx during the installed journey (nginx status + upstream error, rTorrent output).
      - name: Retain disposable rTorrent proxy logs on failure
        if: failure() && env.CHUNKS_DISPOSABLE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: chunks-disposable-rtorrent-proxy-logs
          path: |
            ${{ runner.temp }}/chunks-disposable/nginx.error
            ${{ runner.temp }}/chunks-disposable/nginx.access
            ${{ runner.temp }}/chunks-disposable/rtorrent.log
            ${{ runner.temp }}/chunks-disposable/instrumentation-stack.txt
          if-no-files-found: warn
          retention-days: 7
