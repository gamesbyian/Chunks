name: Installed Chunks real rTorrent magnet lifecycle

on:
  pull_request:
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/VerifiedAddScreen.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RTorrentRemote.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RemoteAddProgress.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/SeedhostAndroidAddUiInstrumentedTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/MainActivityRealMagnetJourney.kt"
      - "tools/real_magnet_peer.py"
      - "tools/installed_rtorrent_magnets.sh"
      - "tools/finish_installed_magnet_evidence.py"
      - "tools/parse_installed_magnet_add_receipt.py"
      - ".github/workflows/installed-rtorrent-magnets.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Real disposable rTorrent, or approved development Seedhost"
        type: choice
        options: [disposable, live]
        default: disposable
        required: true
      apply:
        description: "Authorize exact-hash live public magnet Add/Stop/Start/session Remove and peerless negative"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.environment == 'live' && 'chunks-android-seedhost-scope-mutation' || format('chunks-installed-magnets-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ inputs.environment != 'live' }}

jobs:
  installed-magnet-lifecycle:
    if: >-
      ${{ github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.environment == 'disposable' ||
            (github.ref == 'refs/heads/main' && inputs.apply && github.run_attempt == 1))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CHUNKS_CONTROLLED_PEER: "1"
      CHUNKS_DISPOSABLE: ${{ inputs.environment == 'live' && '0' || '1' }}
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
      CHUNKS_SIDE_BY_SIDE: "1"
      CHUNKS_LIVE_RUTORRENT_URL: ${{ inputs.environment == 'live' && 'https://ianseeds.wood.seedhost.eu/rutorrent/' || 'http://127.0.0.1:18080/RPC2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cheap receipt and controller checks before native build
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_installed_magnet_add_receipt.py
          python3 -m py_compile tools/real_magnet_peer.py tools/finish_installed_magnet_evidence.py
          bash -n tools/installed_rtorrent_magnets.sh
      - name: Start genuine public-magnet metadata and payload peer
        run: |
          sudo timeout 180s apt-get update -qq
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-libtorrent
          peer_host=127.0.0.1
          if [ "$CHUNKS_DISPOSABLE" = 0 ]; then peer_host=5.79.112.219; fi
          nohup /usr/bin/python3 -u tools/real_magnet_peer.py \
            --root "$RUNNER_TEMP/chunks-real-peer" --peer-host "$peer_host" \
            > "$RUNNER_TEMP/chunks-peer-private.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/chunks-real-peer.pid"
      - name: Start disposable real rTorrent and SCGI proxy
        if: env.CHUNKS_DISPOSABLE == '1'
        run: |
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rtorrent nginx
          mkdir -p "$RUNNER_TEMP/chunks-disposable/data" "$RUNNER_TEMP/chunks-disposable/session"
          cat > "$RUNNER_TEMP/chunks-disposable/rtorrent.rc" <<EOF
          directory.default.set = $RUNNER_TEMP/chunks-disposable/data
          session.path.set = $RUNNER_TEMP/chunks-disposable/session
          network.scgi.open_port = 127.0.0.1:5000
          network.port_range.set = 6890-6890
          network.port_random.set = no
          protocol.pex.set = no
          dht.mode.set = disable
          system.daemon.set = true
          EOF
          nohup rtorrent -n -o "import=$RUNNER_TEMP/chunks-disposable/rtorrent.rc" \
            > "$RUNNER_TEMP/chunks-disposable/rtorrent.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/chunks-disposable/rtorrent.pid"
          cat > "$RUNNER_TEMP/chunks-disposable/nginx.conf" <<EOF
          worker_processes 1;
          pid $RUNNER_TEMP/chunks-disposable/nginx.pid;
          error_log $RUNNER_TEMP/chunks-disposable/nginx.error notice;
          events { worker_connections 64; }
          http { server { listen 127.0.0.1:18080;
            location /RPC2 { include /etc/nginx/scgi_params; scgi_pass 127.0.0.1:5000; }
          } }
          EOF
          sudo nginx -c "$RUNNER_TEMP/chunks-disposable/nginx.conf"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile the exact separately installable candidate and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Require independently verified available original pieces before Add
        run: |
          for probe in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:18081/ready \
                -o "$RUNNER_TEMP/chunks-peer-ready.json"; then exit 0; fi
            if [ -f "$RUNNER_TEMP/chunks-real-peer/PREPARATION-FAILURE.json" ]; then
              echo '::error::Public source preparation or independent native piece recheck failed; no Add'
              exit 1
            fi
            sleep 1
          done
          echo '::error::Known real metadata-serving peer unavailable; no Add'
          exit 1
      - name: Prepare hardware-accelerated API35 emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Installed production UI adds two magnets and exercises real lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHUNKS_LIVE_RTORRENT_USER: ${{ inputs.environment == 'live' && secrets.rtorrent_user || '' }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ inputs.environment == 'live' && secrets.rtorrent_pass || '' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/installed_rtorrent_magnets.sh
      - name: Retain independent peer counters and stop owned runner processes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/chunks-real-peer.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/chunks-real-peer.pid")" 2>/dev/null || true
            for probe in $(seq 1 20); do
              kill -0 "$(cat "$RUNNER_TEMP/chunks-real-peer.pid")" 2>/dev/null || break
              sleep 0.2
            done
          fi
          if [ -f "$RUNNER_TEMP/chunks-disposable/rtorrent.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/chunks-disposable/rtorrent.pid")" 2>/dev/null || true
          fi
      - name: Always create exact-source receipts and actual runner-derived JUnit
        if: always()
        run: |
          python3 tools/finish_installed_magnet_evidence.py --runner-temp "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/chunks-installed-magnet-evidence"
      - name: Upload complete acceptance or actionable failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-installed-magnets-${{ inputs.environment || 'disposable' }}-evidence
          path: ${{ runner.temp }}/chunks-installed-magnet-evidence/
          retention-days: 14
          if-no-files-found: error
