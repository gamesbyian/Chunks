name: Collect public magnet candidates

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Real source-verified magnet target"
        required: true
        default: "100"
      pages:
        description: "Search pages per category (bounded)"
        required: true
        default: "12"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest licensed original .torrent metainfo (no payloads)
        shell: bash
        env:
          COUNT: ${{ inputs.count }}
          PAGES: ${{ inputs.pages }}
        run: |
          python3 tools/collect_public_magnet_catalog.py \
            --count "$COUNT" --pages "$PAGES" --max-bytes 555000000
      - name: Publish generated catalog for review (including partial result on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-public-magnet-catalog
          path: |
            test-resources/public-magnets/catalog.json
            test-resources/public-magnets/magnets.txt
          if-no-files-found: warn
          retention-days: 14
