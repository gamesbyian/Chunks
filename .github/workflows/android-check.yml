name: Chunks Android foundation

on:
  pull_request:
    paths:
      - "app/**"
      # API35 native Add workflow runs all instrumented classes and assembles
      # the test APK; test-only edits do not need a duplicate JVM/APK build.
      - "!app/src/androidTest/**"
      - "docs/design/approved/chunks-app-icon-master.svg"
      - "tools/generate_launcher_vector.cjs"
      - "tools/generate_icon_vectors.cjs"
      - "docs/design/svg/icons/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/ci_jvm_two_forks.init.gradle"
      - "tools/prefetch_robolectric_sdk.py"
  workflow_dispatch:

permissions:
  contents: read

# Reflect the exact commit checked out by actions/checkout. For PRs this is
# GitHub's tested merge ref, not automatically the pull request head.
env:
  CHUNKS_SOURCE_SHA: ${{ github.sha }}

concurrency:
  group: chunks-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Exercise physical APK provenance preflight with mock adb (no device)
        run: bash tools/test_physical_android_preflight.sh
      - name: Verify Android CI trigger coverage (offline)
        run: python3 -m unittest discover -s tests -p test_ci_trigger_contract.py
      - name: Check Local Device terminology contract
        run: python3 tools/check_local_terminology.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify SVG-derived launcher vector is up to date
        run: |
          node tools/generate_launcher_vector.cjs --check
          test ! -e app/src/main/res/drawable-nodpi/chunks_launcher_artwork.png
      - name: Verify SVG-derived in-app icon vectors are up to date
        run: node tools/generate_icon_vectors.cjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      # Robolectric 4.17 otherwise fetches this 191 MB API35 runtime JAR
      # during the test suite, after compilation. Verify both Maven SHA-512
      # sidecars, install the JAR in its existing ~/.m2 cache, and fail early
      # on reproducibly corrupt/failed downloads. No tests are filtered.
      - name: Prefetch and verify Robolectric Android 15 runtime SDK
        run: timeout 240s python3 tools/prefetch_robolectric_sdk.py --sdk 35
      - name: Compile Android and run JVM tests
        run: |
          if ! gradle --no-daemon --init-script tools/ci_jvm_two_forks.init.gradle :app:testDebugUnitTest :app:assembleDebug; then
            # Native (JNI) crashes leave only a JVM fatal-error report; surface its summary.
            for report in $(find . -name 'hs_err_pid*.log' -not -path './.git/*' 2>/dev/null); do
              echo "JVM fatal error report: $report"
              grep -m1 -A3 "^# Problematic frame" "$report" || true
              sed -n '/^Stack:/,/^$/p' "$report" | head -40
            done
            # Which test classes completed before the process died.
            grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | sort | tail -60 || true
            exit 1
          fi
      - name: Emit agent-readable CI evidence (without test output or secrets)
        if: always()
        env:
          CHUNKS_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/ci_failure_digest.py --suite "android-jvm" --status "$CHUNKS_JOB_STATUS" --require-executed \
            --glob 'app/build/test-results/testDebugUnitTest/*.xml' --output "$RUNNER_TEMP/chunks-ci-digest.json"
      - name: Retain structured failure digest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-ci-failure-digest-android-jvm
          path: ${{ runner.temp }}/chunks-ci-digest.json
          retention-days: 14
          if-no-files-found: warn
      # A chained native handler that re-raises shows only "SIGSEGV (sent by
      # kill)"; the full report's thread list is needed to find the real fault.
      # This workflow holds no secrets, so the report's environment is safe.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jvm-fatal-error-reports
          path: |
            app/hs_err_pid*.log
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify embedded revision and save APK checksum
        run: |
          apk="app/build/outputs/apk/debug/chunks-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          receipt="app/build/outputs/apk/debug/CHUNKS-BUILD-SHA256.txt"
          test -s "$apk"
          short="${CHUNKS_SOURCE_SHA:0:12}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "versionName='0.1.0-dev+$short'"
          # Artifact ZIP entries are flattened under the common debug/ folder.
          # Emit a relative filename so a tester can verify extracted bytes.
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")") > "$receipt"
          printf '# built_commit=%s\n# workflow_run=%s\n' "$CHUNKS_SOURCE_SHA" "$GITHUB_RUN_ID" >> "$receipt"
      # The APK is compiled, source-verified and checksumed, but ordinary CI
      # does not upload disposable binaries. Owner test builds are published
      # only by the manually dispatched publish-debug-apk.yml workflow.
      - name: Summarize exact-source APK verification
        run: |
          cat app/build/outputs/apk/debug/CHUNKS-BUILD-SHA256.txt
          echo "Android debug APK compiled and verified from $CHUNKS_SOURCE_SHA; binary intentionally not uploaded." >> "$GITHUB_STEP_SUMMARY"
