name: Chunks Android foundation

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile Android and run JVM tests
        run: |
          if ! gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug; then
            # Native (JNI) crashes leave only a JVM fatal-error report; surface its summary.
            for report in $(find . -name 'hs_err_pid*.log' -not -path './.git/*' 2>/dev/null); do
              echo "JVM fatal error report: $report"
              grep -m1 -A3 "^# Problematic frame" "$report" || true
              sed -n '/^Stack:/,/^$/p' "$report" | head -40
            done
            # Which test classes completed before the process died.
            grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | sort | tail -60 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chunks-debug-prealpha
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
