name: Research owned MediaStore document publication

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalSingleLibraryMediaStoreCopy.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalMultiLibraryMediaStoreCopy.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalLibraryCopy.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalSingleLibraryMediaStoreCopyInstrumentedTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalMultiZipMediaStoreExport.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/storage/OwnedMediaStoreZipBatchJournal.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalMultiZipMediaStoreExportInstrumentedTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalZipBatchColdRestoreInstrumentedTest.kt"
      - "tools/batch_cold_restore_probe.sh"
      - "tools/test_batch_cold_restore_probe_mock.sh"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalSingleZipMediaStoreExport.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalZipExtractionPanel.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalSingleZipMediaStoreExportInstrumentedTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/storage/OwnedMediaStoreDocumentPublication.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/storage/OwnedMediaStorePublicationJournal.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/storage/OwnedMediaStorePublicationJournalTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/storage/OwnedMediaStoreDocumentPublicationInstrumentedTest.kt"
      - "tools/check_owned_mediastore_case_contract.py"
      - "tools/owned_mediastore_document_probe.sh"
      - "tools/test_owned_mediastore_document_probe_mock.sh"
      - ".github/workflows/storage-owned-mediastore-documents.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-owned-documents-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-owned-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Refuse false or unsafe cold ZIP batch receipts (offline)
        run: bash tools/test_batch_cold_restore_probe_mock.sh
      - name: Reject stale source case counts and names before allocating an emulator (offline)
        run: python3 tools/check_owned_mediastore_case_contract.py
      - name: Reject ambiguous device targets and counterfeit provider test receipts (offline)
        run: bash tools/test_owned_mediastore_document_probe_mock.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Freeze exact APK pair for both Android versions
        run: |
          mkdir -p "$RUNNER_TEMP/owned-documents-apks"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/owned-documents-apks/app.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/owned-documents-apks/test.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/owned-documents-apks/source-sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/owned-documents-apks/source-tree"
          (cd "$RUNNER_TEMP/owned-documents-apks" && sha256sum app.apk test.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-owned-documents-apks
          path: ${{ runner.temp }}/owned-documents-apks/
          retention-days: 14
          if-no-files-found: error

  owned-documents:
    needs: build-owned-documents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chunks-owned-documents-apks
          path: ${{ runner.temp }}/owned-documents-apks
      - name: Reject stale source or changed APK pair
        run: |
          test "$(cat "$RUNNER_TEMP/owned-documents-apks/source-sha")" = "$(git rev-parse HEAD)"
          test "$(cat "$RUNNER_TEMP/owned-documents-apks/source-sha")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/owned-documents-apks/source-tree")" = "$(git rev-parse HEAD^{tree})"
          (cd "$RUNNER_TEMP/owned-documents-apks" && sha256sum -c SHA256SUMS)
          mkdir -p app/build/outputs/apk/{debug,androidTest/debug}
          cp "$RUNNER_TEMP/owned-documents-apks/app.apk" app/build/outputs/apk/debug/app-debug.apk
          cp "$RUNNER_TEMP/owned-documents-apks/test.apk" app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Require real emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Prove new platform-owned Downloads publication
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/owned_mediastore_document_probe.sh ${{ matrix.api }} && bash tools/batch_cold_restore_probe.sh ${{ matrix.api }}
