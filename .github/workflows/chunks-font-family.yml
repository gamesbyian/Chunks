name: Build and validate Chunks OpenType family
on:
  push:
    # Run once for merged changes, not again for each PR branch push.
    # Pull requests remain protected by their existing font-specific path filters.
    branches: [main]
    paths:
      - 'tools/build_chunks_fonts.py'
      - 'tools/brand_glyphs.py'
      - 'tools/spacing_optimizer.py'
      - 'tools/latin_class_kerning.py'
      - 'tools/audit_chunks_fonts.py'
      - 'tools/requirements-chunks-font.txt'
      - 'tests/test_font_pipeline.py'
      - 'assets/fonts/**'
      - 'app/src/main/res/font/**'
      - 'docs/design/CHUNKS-FONT-ITERATION-2.md'
      - '.github/workflows/chunks-font-family.yml'
  pull_request:
    paths:
      - 'tools/build_chunks_fonts.py'
      - 'tools/brand_glyphs.py'
      - 'tools/spacing_optimizer.py'
      - 'tools/latin_class_kerning.py'
      - 'tools/audit_chunks_fonts.py'
      - 'tests/test_font_pipeline.py'
      - 'tools/requirements-chunks-font.txt'
      - 'assets/fonts/**'
      - '.github/workflows/chunks-font-family.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Build true CFF fonts with custom Chunks outlines and optical kerning
        run: python tools/build_chunks_fonts.py --source 'assets/fonts/source/Baloo2[wght].ttf' --out assets/fonts/chunks
      - name: Sync Android display font directly from the freshly built OTF
        run: |
          mkdir -p app/src/main/res/font
          cp assets/fonts/chunks/Chunks-ExtraBold.otf app/src/main/res/font/chunks_extrabold.otf
      - name: Test editable stroke masters, deterministic outlines and font outputs
        run: python -m unittest discover -s tests -p 'test_font_pipeline.py' -v
      - name: Audit glyph coverage, shaping, vertical metrics and render specimens
        run: |
          python tools/audit_chunks_fonts.py \
            --fonts assets/fonts/chunks \
            --preview chunks-font-specimen.png \
            --atlas chunks-characters-grid.png \
            --report chunks-font-audit.json
      - name: Upload OTFs, spacing audit and rendered specimens
        uses: actions/upload-artifact@v4
        with:
          name: chunks-otf-family
          path: |
            assets/fonts/chunks/*
            chunks-font-specimen.png
            chunks-characters-grid.png
            chunks-font-audit.json
      - name: Commit deterministic font builds on source branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/chunks app/src/main/res/font/chunks_extrabold.otf
          if ! git diff --cached --quiet; then
            git commit -m 'build(fonts): regenerate vector-derived OTFs and measured typography presets'
            git push
          fi