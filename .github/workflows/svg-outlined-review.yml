name: Verify Chunks outlined SVG variants
# Workflow-only routing changes are checked by Documentation validation.
# Changes to executable commands require explicit workflow_dispatch on the candidate.
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/design/svg/**'
      - 'tools/build_svg_outlined_alternatives.py'
      - 'tools/audit_svg_inventory.py'
  workflow_dispatch:
# Superseded PR revisions should not keep spending runner minutes.
# Manual and main-push executions use their unique run ID and are never cancelled.
concurrency:
  group: chunks-svg-outlined-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'fonttools>=4.55,<5'
      - name: Confirm every preserved original and outlined alternative
        run: |
          python3 tools/build_svg_outlined_alternatives.py
          python3 tools/audit_svg_inventory.py
          python3 tools/validate_svg_library.py
          python3 tools/check_svg_approved_derivatives.py
