name: Publish Chunks installable Android debug APK

# Deliberately one-time on initial installation of this workflow; further
# builds are explicit, not a new public release for every source commit.
# 2026-10-27 republish only after merged Add-default, verified-recent Place,
# remembered-credential policy and documentation pass their exact-head gates.
# This is an installable DEBUG pre-alpha, never physical handset acceptance.
# 2026-10-27 user-report recovery build: publish only AFTER the verified
# remote Start/Stop return after fresh readback, explicit inactive Resume,
# and bounded post-Add read-only reconciliation pass exact-head JVM/native CI.
# Keep the debug/preview apps separately installable without deleting user data.
# This DEBUG pre-alpha still has NO real peer payload or physical phone proof.
# 2026-10-27 owner-approved icon adoption: publish source-stamped regular
# and side-by-side APKs only after PR #293's provenance/native gates pass.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chunks-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify test helper before producing debug APK
        run: bash tools/test_physical_android_preflight.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify SVG-derived launcher vector is up to date
        run: |
          node tools/generate_launcher_vector.cjs --check
          test ! -e app/src/main/res/drawable-nodpi/chunks_launcher_artwork.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test and build exact main checkout
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Build side-by-side separately installed Chunks Preview
        env:
          CHUNKS_SIDE_BY_SIDE: "1"
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/chunks-original.apk"
          gradle --no-daemon :app:assembleDebug --rerun-tasks
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/chunks-preview.apk
          cp "$RUNNER_TEMP/chunks-original.apk" app/build/outputs/apk/debug/app-debug.apk
      - name: Verify embedded revision and compute APK SHA-256
        run: |
          apk="app/build/outputs/apk/debug/chunks-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          receipt="app/build/outputs/apk/debug/CHUNKS-BUILD-SHA256.txt"
          test -s "$apk"
          test -s app/build/outputs/apk/debug/chunks-preview.apk
          short="${CHUNKS_SOURCE_SHA:0:12}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='io.github.gamesbyian.chunks'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -F "versionName='0.1.0-dev+$short'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/chunks-preview.apk |
            grep -F "package: name='io.github.gamesbyian.chunks.preview'"
          # Both APK identities must package the SVG-derived native VectorDrawable.
          # The original PNG is preserved only under docs/design/approved.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$apk" |
            grep -F 'chunks_launcher_artwork'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources app/build/outputs/apk/debug/chunks-preview.apk |
            grep -F 'chunks_launcher_artwork'
          (cd "$(dirname "$apk")" && sha256sum chunks-debug.apk chunks-preview.apk) > "$receipt"
          printf '# built_commit=%s\n# workflow_run=%s\n' "$CHUNKS_SOURCE_SHA" "$GITHUB_RUN_ID" >> "$receipt"
          (cd "$(dirname "$apk")" && sha256sum -c CHUNKS-BUILD-SHA256.txt)
      - name: Publish immutable pre-release assets inside this repository
        run: |
          set -euo pipefail
          short="${CHUNKS_SOURCE_SHA:0:12}"
          tag="android-debug-$short"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace APK bytes"
            exit 1
          fi
          gh release create "$tag" \
            "app/build/outputs/apk/debug/chunks-debug.apk#chunks-debug.apk" \
            "app/build/outputs/apk/debug/chunks-preview.apk#chunks-preview.apk" \
            "app/build/outputs/apk/debug/CHUNKS-BUILD-SHA256.txt#CHUNKS-BUILD-SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$CHUNKS_SOURCE_SHA" \
            --title "Chunks Android debug build $short" --prerelease \
            --notes "Installable Android pre-alpha debug APK built and JVM-tested from exact main commit $CHUNKS_SOURCE_SHA. Download BOTH assets and verify SHA-256 using sha256sum -c CHUNKS-BUILD-SHA256.txt. Prefer chunks-preview.apk for side-by-side install alongside a prior Chunks debug build. Never uninstall the original merely to resolve a debug-signature conflict: doing so can delete app-owned downloads and resume files. Debug signing only: no publisher identity, production security guarantee, physical-device validation, Seedhost end-to-end acceptance, or guaranteed Android background seeding. See docs/BUILD.md and docs/QUALITY-LEDGER.md. Both normal and Preview APKs package the SVG-derived Android vector; the original PNG is preserved in documentation only. Never publish private server credentials."
      - name: Keep conventional short-lived CI artifact as an alternative
        uses: actions/upload-artifact@v4
        with:
          name: chunks-debug-prealpha
          path: |
            app/build/outputs/apk/debug/chunks-debug.apk
            app/build/outputs/apk/debug/chunks-preview.apk
            app/build/outputs/apk/debug/CHUNKS-BUILD-SHA256.txt
          retention-days: 7
