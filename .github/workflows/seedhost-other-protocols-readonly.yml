name: Protected other-protocol Seedhost read-only acceptance

# Owner-only trusted-main dispatch; never PR, never mutates torrents or logs
# credentials, torrent hashes, paths, tracker URLs, cookies or request bodies.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Dedicated development-only remote client (read-only)"
        type: choice
        required: true
        options:
          - TRANSMISSION
          - QBITTORRENT
          - DELUGE
      credential_source:
        description: "client = per-client secrets; account = the shared Seedhost account login (rtorrent_user/rtorrent_pass)"
        type: choice
        required: false
        default: client
        options:
          - client
          - account
      endpoint:
        description: "Optional credential-free HTTPS endpoint override (blank = owner's development default)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: chunks-protocol-live-readonly-${{ inputs.backend }}
  cancel-in-progress: false

jobs:
  exact-client-readonly:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 compile SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify one selected client without writing torrent state
        env:
          CHUNKS_PROTOCOL_LIVE_BACKEND: ${{ inputs.backend }}
          SECRET_URL: ${{ inputs.backend == 'TRANSMISSION' && (secrets.transmission_url || secrets.TRANSMISSION_URL || secrets.CHUNKS_TRANSMISSION_URL) || inputs.backend == 'QBITTORRENT' && (secrets.qbittorrent_url || secrets.QBITTORRENT_URL || secrets.CHUNKS_QBITTORRENT_URL) || (secrets.deluge_url || secrets.DELUGE_URL || secrets.CHUNKS_DELUGE_URL) }}
          INPUT_URL: ${{ inputs.endpoint }}
          # Seedhost apps share the account login unless a per-client user is set.
          CHUNKS_PROTOCOL_LIVE_USER: ${{ inputs.credential_source == 'account' && secrets.rtorrent_user || (inputs.backend == 'TRANSMISSION' && (secrets.transmission_user || secrets.TRANSMISSION_USER || secrets.rtorrent_user) || inputs.backend == 'QBITTORRENT' && (secrets.qbittorrent_user || secrets.QBITTORRENT_USER || secrets.rtorrent_user) || (secrets.deluge_user || secrets.DELUGE_USER || secrets.rtorrent_user)) }}
          CHUNKS_PROTOCOL_LIVE_PASS: ${{ inputs.credential_source == 'account' && secrets.rtorrent_pass || (inputs.backend == 'TRANSMISSION' && (secrets.transmission_pass || secrets.TRANSMISSION_PASS || secrets.transmission_password) || inputs.backend == 'QBITTORRENT' && (secrets.qbittorrent_pass || secrets.QBITTORRENT_PASS || secrets.qbittorrent_password) || (secrets.deluge_pass || secrets.DELUGE_PASS || secrets.deluge_password)) }}
          CHUNKS_PROTOCOL_LIVE_DAEMON_ID: ${{ inputs.backend == 'DELUGE' && (secrets.deluge_daemon_id || secrets.DELUGE_DAEMON_ID || vars.DELUGE_DAEMON_ID) || '' }}
        run: |
          # Owner's development endpoints (credential-free; observed 401/login
          # challenges on 2026-11-18). A secret or explicit input overrides.
          case "$CHUNKS_PROTOCOL_LIVE_BACKEND" in
            TRANSMISSION) default_url="https://wood.seedhost.eu/ianseeds/transmission/rpc" ;;
            QBITTORRENT) default_url="https://wood.seedhost.eu/ianseeds/qbittorrent/" ;;
            DELUGE) default_url="https://wood.seedhost.eu/ianseeds/deluge/json" ;;
          esac
          CHUNKS_PROTOCOL_LIVE_URL="${INPUT_URL:-${SECRET_URL:-$default_url}}"
          export CHUNKS_PROTOCOL_LIVE_URL
          if [ -z "$CHUNKS_PROTOCOL_LIVE_URL" ] || [ -z "$CHUNKS_PROTOCOL_LIVE_PASS" ]; then
            echo "::error::Development-client URL/password secret names need mapping; no request was sent."
            exit 1
          fi
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.model.DedicatedProtocolLiveReadOnlyTest
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path("app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.model.DedicatedProtocolLiveReadOnlyTest.xml")
          if not path.is_file():
              print("CHUNKS_PROTOCOL_LIVE: no executed receipt")
              sys.exit(1)
          root = ET.parse(path).getroot()
          tests = int(root.get("tests", "0"))
          skipped = int(root.get("skipped", "0"))
          failed = int(root.get("failures", "0")) + int(root.get("errors", "0"))
          executed = tests - skipped
          print(f"CHUNKS_PROTOCOL_LIVE: tests={tests} executed={executed} failed={failed} skipped={skipped}")
          for case in root.iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  # Adapter messages are fixed, credential-free strings.
                  kind = (bad.get("type") or "").rsplit(".", 1)[-1]
                  msg = (bad.get("message") or "").splitlines()[0][:160] if bad.get("message") else ""
                  if "://" in msg or "@" in msg:
                      msg = "<withheld>"
                  print(f"CHUNKS_PROTOCOL_LIVE: failure type={kind} message={msg}")
          for line in (root.findtext("system-out") or "").splitlines():
              if line.startswith("CHUNKS_PROTOCOL_LIVE:"):
                  print(line[:180])
          sys.exit(0 if int(sys.argv[1]) == 0 and executed == 1 and failed == 0 else 1)
          PY
