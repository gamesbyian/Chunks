name: Build signed Chunks release APK (manual)

# Manual main-only persistent-key owner-update release. A stable signing key and
# certificate pin are mandatory; no unpublished / unsigned fallback.
on:
  workflow_dispatch:

permissions:
  contents: write

# Actions are pinned to reviewed immutable git SHAs to prevent mutable tag drift.
# Keep manual, trusted main-only signing and exact-artifact verification.

concurrency:
  group: chunks-signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
      CHUNKS_VERSION_NAME: 0.1.0-alpha.${{ github.run_number }}
      CHUNKS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate signing secrets and certificate pin
        env:
          KEYSTORE_B64: ${{ secrets.CHUNKS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CHUNKS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHUNKS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHUNKS_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.CHUNKS_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$CHUNKS_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid version_name"; exit 1; }
          [[ "$CHUNKS_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "Invalid version_code"; exit 1; }
          (( CHUNKS_VERSION_CODE <= 2100000000 )) || { echo "versionCode too large"; exit 1; }
          [[ "$EXPECTED_CERT" =~ ^([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}$ ]] || {
            echo "::error::Set CHUNKS_SIGNING_CERT_SHA256 repository variable to the SHA-256 signing certificate fingerprint."
            exit 1
          }
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing signing secret for $name; refusing to build an unsigned release."
              exit 1
            fi
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify SVG-derived launcher vector is up to date
        run: node tools/generate_launcher_vector.cjs --check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: JVM tests, then signed release build
        env:
          KEYSTORE_B64: ${{ secrets.CHUNKS_RELEASE_KEYSTORE_BASE64 }}
          CHUNKS_RELEASE_STORE_PASSWORD: ${{ secrets.CHUNKS_RELEASE_STORE_PASSWORD }}
          CHUNKS_RELEASE_KEY_ALIAS: ${{ secrets.CHUNKS_RELEASE_KEY_ALIAS }}
          CHUNKS_RELEASE_KEY_PASSWORD: ${{ secrets.CHUNKS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export CHUNKS_RELEASE_KEYSTORE="$RUNNER_TEMP/chunks-release.jks"
          trap 'rm -f "$CHUNKS_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$CHUNKS_RELEASE_KEYSTORE"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signature, rename and write receipt
        env:
          EXPECTED_CERT: ${{ vars.CHUNKS_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/release
          test ! -e "$out/app-release-unsigned.apk"
          test -s "$out/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$out/app-release.apk" > "$RUNNER_TEMP/signature.txt"
          # minSdk 29: a v3 (or v2) APK Signature Scheme block is required.
          grep -Eq "Verified using v[23] scheme \(APK Signature Scheme v[23]\): true" "$RUNNER_TEMP/signature.txt"
          actual_cert="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          [ -n "$actual_cert" ] && [ "$actual_cert" = "$expected_cert" ] || {
            echo "::error::Signing certificate changed; refusing incompatible Chunks update."
            exit 1
          }
          # A valid signature does not establish the manifest identity that
          # will be printed in the release receipt. Check packaged bytes.
          python3 tools/verify_release_apk_identity.py \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apk "$out/app-release.apk" \
            --version-name "$CHUNKS_VERSION_NAME" --version-code "$CHUNKS_VERSION_CODE"
          apk="$out/chunks-release-$CHUNKS_VERSION_NAME.apk"
          cp "$out/app-release.apk" "$apk"
          {
            echo "Chunks signed release $CHUNKS_VERSION_NAME (versionCode $CHUNKS_VERSION_CODE)"
            echo "Source commit: $CHUNKS_SOURCE_SHA"
            sha256sum "$apk" | sed "s#$out/##"
            grep "certificate SHA-256 digest" "$RUNNER_TEMP/signature.txt"
            echo "Publisher authenticity only; not physical-device or release acceptance."
          } > "$out/CHUNKS-RELEASE-SHA256.txt"
          cat "$out/CHUNKS-RELEASE-SHA256.txt"
      - name: Publish immutable signed owner-update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-update-v$CHUNKS_VERSION_CODE"
          apk="app/build/outputs/apk/release/chunks-release-$CHUNKS_VERSION_NAME.apk"
          receipt="app/build/outputs/apk/release/CHUNKS-RELEASE-SHA256.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Signed APK release tag already exists; refusing to overwrite update bytes."
            exit 1
          fi
          gh release create "$tag" "$apk#chunks.apk" "$receipt#CHUNKS-RELEASE-SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$CHUNKS_SOURCE_SHA" \
            --title "Chunks owner update $CHUNKS_VERSION_NAME" --prerelease \
            --notes "Persistent-key signed Chunks update. Keep the app installed for future updates. Verify the matching SHA-256 receipt. This is not physical-device acceptance."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chunks-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/chunks-release-*.apk
            app/build/outputs/apk/release/CHUNKS-RELEASE-SHA256.txt
          if-no-files-found: error
          retention-days: 30
