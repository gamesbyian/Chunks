name: Chunks real Android Compose system 200 percent font-scale acceptance
on:
  pull_request:
    paths:
      - 'app/src/androidTest/java/io/github/gamesbyian/chunks/SystemFontScaleComposeInstrumentedTest.kt'
      - 'tools/run_compose_system_font_200pct.sh'
      - 'tests/test_compose_system_font_controller.py'
      - '.github/workflows/compose-system-font-200pct.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chunks-compose-real-font-200pct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-system-font-200pct-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Refuse wrong targets and false controller receipts offline
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_compose_system_font_controller.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install pinned Android 37 compile platform
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Reclaim unrelated toolchains before allocating emulator userdata
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
      - name: Assert real Android x86_64 hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Installed MainActivity at real 320x700 and 412x892, system font 200%
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/run_compose_system_font_200pct.sh
      - name: Retain 14 device captures, viewport-separated SHA receipts and instrumentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-real-compose-system-font-scale-200pct
          path: |
            ${{ runner.temp }}/chunks-compose-system-font-200pct/
            app/build/outputs/androidTest-results/connected/
          retention-days: 30
          if-no-files-found: warn
