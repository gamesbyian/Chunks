name: Installed Universal Add (Local and four real remote clients)

# Disposable loopback daemons on the runner only.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/RemoteProtocolConnect.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/ProtocolClientOperationsPanel.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/ProtocolAddScreen.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalAddAttemptOwner.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/RemoteProtocolCombinedProfiles.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/CombinedReadOnlyProtocolSources.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/**"
      - "app/src/main/java/io/github/gamesbyian/chunks/UniversalAddDestinationPicker.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/ProtocolClientInstalledJourneyTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/RTorrentInstalledAddResponseFaultTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalInstalledAddProcessDeathTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/InstalledAddResponseFault.kt"
      - "tools/installed_protocol_client.sh"
      - "tools/verify_installed_protocol_lanes.py"
      - "tests/test_installed_protocol_lanes.py"
      # The installed script runs this foreign-UID task test before clients.
      # Standalone changes to either the host script or provider fixture MUST
      # select the same Android gate, without requiring an unrelated app diff.
      - "tools/installed_external_document_process_loss.sh"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/external/ExternalSourceSenderActivity.java"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/external/ExternalTorrentTestProvider.java"
      - "tools/verify_installed_apk_bytes.sh"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/InstalledUniversalAddJourney.kt"
      # The installed Add/Connect journey calls this shared semantics helper.
      # A detached-node or one-shot action change must execute the real
      # disposable five-client witness, not only Robolectric or native shards.
      - "app/src/sharedTest/java/io/github/gamesbyian/chunks/LazyComposeActions.kt"
      - "tools/interop/**"
      # The narrow read-only snapshot folder fixture has its own two-server owner.
      - "!tools/interop/disposable_snapshot_folder_listing.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHUNKS_SOURCE_SHA: ${{ github.sha }}

concurrency:
  group: chunks-installed-protocol-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-protocol-apks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate installed harness syntax before heavy setup
        run: |
          bash -n tools/installed_protocol_client.sh
          bash -n tools/installed_external_document_process_loss.sh
          bash -n tools/interop/start_local_clients.sh
          python3 -m unittest discover -s tests -p test_installed_protocol_lanes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build app and instrumentation APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Freeze source and APK pair
        run: |
          mkdir -p "$RUNNER_TEMP/protocol-apks"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/protocol-apks/app.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/protocol-apks/test.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/protocol-apks/source-sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/protocol-apks/source-tree"
          (cd "$RUNNER_TEMP/protocol-apks" && sha256sum app.apk test.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-protocol-apks
          path: ${{ runner.temp }}/protocol-apks/
          retention-days: 14
          if-no-files-found: error

  protocol-lane:
    needs: build-protocol-apks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [transmission-rtorrent, qbittorrent-deluge, local-document]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chunks-protocol-apks
          path: ${{ runner.temp }}/protocol-apks
      - name: Verify source and immutable APK pair
        run: |
          test "$(cat "$RUNNER_TEMP/protocol-apks/source-sha")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/protocol-apks/source-tree")" = "$(git rev-parse HEAD^{tree})"
          (cd "$RUNNER_TEMP/protocol-apks" && sha256sum -c SHA256SUMS)
          mkdir -p app/build/outputs/apk/{debug,androidTest/debug}
          cp "$RUNNER_TEMP/protocol-apks/app.apk" app/build/outputs/apk/debug/app-debug.apk
          cp "$RUNNER_TEMP/protocol-apks/test.apk" app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Start disposable Transmission, qBittorrent, Deluge and rTorrent
        if: matrix.lane != 'local-document'
        run: |
          bash tools/apt_install_retry.sh transmission-daemon qbittorrent-nox deluged deluge-web rtorrent nginx
          sudo systemctl stop transmission-daemon deluged deluge-web qbittorrent-nox 2>/dev/null || true
          sudo pkill -x transmission-da 2>/dev/null || true
          sudo pkill -f /usr/bin/deluged 2>/dev/null || true
          if [ -f /etc/apparmor.d/transmission ]; then
            sudo apparmor_parser -R /etc/apparmor.d/transmission 2>/dev/null || true
          fi
          SUDO=sudo tools/interop/start_local_clients.sh "$RUNNER_TEMP/interop"
      - name: Prepare emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Installed journeys and post-write Add response faults
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/installed_protocol_client.sh ${{ matrix.lane }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-protocol-lane-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interop/evidence/
          retention-days: 14
          if-no-files-found: warn

  installed-protocol-client:
    needs: protocol-lane
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunks-protocol-lane-*
          path: ${{ runner.temp }}/protocol-lanes
      - name: Require every exact-source lane including newest failed attempts
        env:
          LANES_RESULT: ${{ needs.protocol-lane.result }}
        run: python3 tools/verify_installed_protocol_lanes.py "$RUNNER_TEMP/protocol-lanes" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$LANES_RESULT"
