name: Android 10 shared Downloads instrumentation

# API 29 is the one Android version where shared Downloads needs legacy
# storage plus a runtime grant; the regular suite runs on API 35 only.
on:
  # Automatic route ownership is in native-add-instrumentation.yml.
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: chunks-android10-downloads-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  api29-downloads:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject misleading API29 install and test evidence (offline)
        run: bash tools/test_android10_downloads_instrumentation_mock.sh
      - name: Reject unsafe ADB grant-revocation targets and forged test receipts (offline)
        run: bash tools/test_android10_downloads_revocation_mock.sh
      - name: Reject forged Share/magnet intake, skipped tests and non-emulator cleanup (offline)
        run: bash tools/test_local_intake_journey.sh
      - name: Reuse exact shared debug APK pair
        if: inputs.artifact_name != ''
        uses: ./.github/actions/reuse-installed-apks
        with:
          run-id: ${{ github.run_id }}
          same-run: 'true'
          artifact-name: ${{ inputs.artifact_name }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        if: inputs.artifact_name == ''
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.artifact_name == ''
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        if: inputs.artifact_name == ''
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented tests
        if: inputs.artifact_name == ''
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: API 29 shared Downloads write, resume and seed
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-boot-timeout: 600
          disable-animations: true
          script: >-
            bash tools/android10_downloads_instrumentation.sh &&
            timeout 180s adb shell am instrument -w -r
            -e class io.github.gamesbyian.chunks.InstalledOpenWithHandoffInstrumentedTest#openWithDataOnlyUsesAndroidResolvedMimeAndRetainsTheExactReview,io.github.gamesbyian.chunks.InstalledOpenWithHandoffInstrumentedTest#conflictingOpenWithClipDataCannotReplaceTheRetainedReview
            io.github.gamesbyian.chunks.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/api29-openwith.raw" &&
            python3 tools/parse_instrumentation_stream.py --raw "$RUNNER_TEMP/api29-openwith.raw" --junit "$RUNNER_TEMP/api29-openwith.xml" &&
            grep -Fx 'OK (2 tests)' "$RUNNER_TEMP/api29-openwith.raw" &&
            bash tools/local_intake_journey.sh &&
            bash tools/android10_downloads_revocation.sh
