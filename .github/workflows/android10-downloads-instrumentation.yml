name: Android 10 shared Downloads instrumentation

# API 29 is the one Android version where shared Downloads needs legacy
# storage plus a runtime grant; the regular suite runs on API 35 only.
on:
  pull_request:
    paths:
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalDownloadPlace*.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalPlaceWriteProbe.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalPublicDownloadsPlaceInstrumentedTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalDownloadPlacePickerInstrumentedTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/Android10StoragePermissionDialogInstrumentedTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalEngineScreen.kt"
      - "tools/android10_downloads_instrumentation.sh"
      - "tools/test_android10_downloads_instrumentation_mock.sh"
      # Native resume reader changes must exercise the API29 real backing,
      # restart, and fresh-peer seeding journey, not only host JVM tests.
      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalResumeFileReader.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/engine/LocalResumeFileReaderTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalEngineService.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalService*.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalEngineServiceInstrumentedTest.kt"
      - ".github/workflows/android10-downloads-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-android10-downloads-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  api29-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reject misleading API29 install and test evidence (offline)
        run: bash tools/test_android10_downloads_instrumentation_mock.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: API 29 shared Downloads write, resume and seed
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/android10_downloads_instrumentation.sh
