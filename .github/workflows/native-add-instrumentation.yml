name: Chunks native Add review instrumentation

on:
  pull_request:
    paths:
      # Production sources too: instrumented fakes and UI tests assert exact
      # RPC calls and labels, so main-only changes (#460, #463) broke them
      # without this suite ever running on those PRs.
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      # Changes to the test command must re-run this suite.
      - "tools/native_add_review.sh"
      - ".github/workflows/native-add-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-add-instrument-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  add-review-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check required native atlas captures before SDK and emulator allocation
        run: |
          python3 tools/check_native_atlas_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_atlas_contract.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented native UI tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; cannot run hardware-accelerated x86 Android instrumented tests"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run actual native Compose Add review tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Explicitly cap userdata: default Pixel 6 data partition exceeded
          # free runner space (run 41125095089, emulator FATAL 7372.80 MB needed).
          # Keep enough space for debug/instrumentation APKs and shared-storage fixtures.
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/native_add_review.sh
      - name: Upload native Compose review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-review-states
          path: ${{ runner.temp }}/chunks-add-native-review
          retention-days: 14
          if-no-files-found: warn
