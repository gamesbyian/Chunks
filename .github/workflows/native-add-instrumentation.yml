name: Chunks native Add review instrumentation

on:
  pull_request:
    paths:
      # Production sources too: instrumented fakes and UI tests assert exact
      # RPC calls and labels, so main-only changes (#460, #463) broke them
      # without this suite ever running on those PRs.
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      # Changes to the test command must re-run this suite.
      - "tools/native_add_review.sh"
      - "tools/verify_native_add_shards.py"
      - ".github/workflows/native-add-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-add-instrument-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  add-review-device-test:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CHUNKS_NATIVE_ADD_SHARD_COUNT: "2"
      CHUNKS_NATIVE_ADD_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required native atlas captures before SDK and emulator allocation
        run: |
          python3 tools/check_native_atlas_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_atlas_contract.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented native UI tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Free unrelated runner toolchains before emulator startup
        run: |
          # November 1 runner: API35 Pixel 6 required 7373 MB with only 7098 MB free.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h "$RUNNER_TEMP"
      - name: Enable Android emulator KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; cannot run hardware-accelerated x86 Android instrumented tests"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run actual native Compose Add review tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Cap userdata + recover unrelated host disk: even 4096M exceeded
          # free runner space (run 41355079713, FATAL 7372.80 MB needed).
          # Keep enough space for debug/instrumentation APKs and shared-storage fixtures.
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/native_add_review.sh
      - name: Emit agent-readable CI evidence (without test output or secrets)
        if: always()
        env:
          CHUNKS_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/ci_failure_digest.py --suite "api35-native-add-shard-${CHUNKS_NATIVE_ADD_SHARD_INDEX}" --status "$CHUNKS_JOB_STATUS" --require-executed \
            --glob 'app/build/outputs/androidTest-results/connected/**/TEST-*.xml' --output "$RUNNER_TEMP/chunks-native-add-receipt/digest.json"
      - name: Upload mandatory per-shard test receipt (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-receipt-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/chunks-native-add-receipt/digest.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload every real screenshot captured by this emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-atlas-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/chunks-add-native-review/*.png
          retention-days: 14
          if-no-files-found: warn

  verify-complete-native-add:
    needs: add-review-device-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all independently executed JUnit receipts and PNGs
        uses: actions/download-artifact@v4
        with:
          pattern: chunks-native-add-*
          path: ${{ runner.temp }}/chunks-native-add-shards
      - name: Require all shards and every mandatory actual Compose screenshot
        run: |
          python3 tools/verify_native_add_shards.py \
            --artifacts "$RUNNER_TEMP/chunks-native-add-shards" \
            --shards 2 --sha "$GITHUB_SHA"
      - name: Attach combined exact-head acceptance receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-sharded-acceptance
          path: ${{ runner.temp }}/chunks-native-add-shards/native-add-acceptance.json
          retention-days: 14
          if-no-files-found: error
