name: Chunks native Add review instrumentation

on:
  pull_request:
    paths:
      # Production sources too: instrumented fakes and UI tests assert exact
      # RPC calls and labels, so main-only changes (#460, #463) broke them
      # without this suite ever running on those PRs.
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      # Changes to the test command must re-run this suite.
      - "tools/native_add_review.sh"
      # Shared immutable APK pair + source-bound AndroidJUnitRunner evidence.
      - "tools/native_add_prebuilt.sh"
      - "tools/parse_instrumentation_stream.py"
      - "tests/test_instrumentation_stream.py"
      - "tools/verify_native_add_shards.py"
      - ".github/workflows/native-add-instrumentation.yml"
    # Drafts are implementation batches; run this costly acceptance only when
    # marked ready, then on every subsequent change. Converting back to draft
    # cancels obsolete in-flight work through the PR concurrency group.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-add-instrument-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


jobs:
  build-once:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check required native atlas captures and parser before SDK allocation
        run: |
          python3 tools/check_native_atlas_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_atlas_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_instrumentation_stream.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile immutable native Add app/test APK pair once
        env:
          CHUNKS_SOURCE_SHA: ${{ github.sha }}
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p "$RUNNER_TEMP/chunks-prebuilt"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/chunks-prebuilt/chunks-app.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/chunks-prebuilt/chunks-test.apk"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/chunks-prebuilt/source-sha"
          (cd "$RUNNER_TEMP/chunks-prebuilt" && sha256sum *.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-prebuilt-native-add-apk-pair
          path: ${{ runner.temp }}/chunks-prebuilt/
          if-no-files-found: error
          retention-days: 1

  add-review-device-test:
    needs: build-once
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CHUNKS_NATIVE_ADD_SHARD_COUNT: "2"
      CHUNKS_NATIVE_ADD_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chunks-prebuilt-native-add-apk-pair
          path: ${{ runner.temp }}/chunks-prebuilt
      - name: Reject stale SHA or changed app/test APK bytes
        run: |
          test "$(cat "$RUNNER_TEMP/chunks-prebuilt/source-sha")" = "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/chunks-prebuilt" && sha256sum -c SHA256SUMS)
      - name: Reclaim unrelated toolchains before emulator allocation
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run full native Add review suite from exact-source installed APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/native_add_prebuilt.sh
      - name: Emit agent-readable source-bound JUnit evidence even on failure
        if: always()
        env:
          CHUNKS_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/ci_failure_digest.py --suite "api35-native-add-shard-$CHUNKS_NATIVE_ADD_SHARD_INDEX" --status "$CHUNKS_JOB_STATUS" --require-executed \
            --glob 'app/build/outputs/androidTest-results/connected/**/TEST-*.xml' \
            --output "$RUNNER_TEMP/chunks-native-add-receipt/digest.json"
      - name: Show bounded safe failing Android testcase identities
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path("app/build/outputs/androidTest-results/connected")
          count = 0
          for report in sorted(root.glob("**/TEST-*.xml")):
              try:
                  cases = ET.parse(report).getroot().iter("testcase")
                  for case in cases:
                      if case.find("failure") is None and case.find("error") is None:
                          continue
                      cls = case.get("classname", "")
                      method = case.get("name", "")
                      if (re.fullmatch(r"[A-Za-z_][A-Za-z0-9_.$]{0,159}", cls) and
                              re.fullmatch(r"[A-Za-z_][A-Za-z0-9_$]{0,99}", method)):
                          print(f"::error title=Native Add installed Android test failure::{cls}.{method}")
                      else:
                          print("CHUNKS_NATIVE_DIAGNOSTIC: failed_case_identity_redacted")
                      count += 1
                      if count >= 8:
                          break
              except (OSError, ET.ParseError):
                  print("CHUNKS_NATIVE_DIAGNOSTIC: invalid_JUnit_report")
              if count >= 8:
                  break
          if count == 0:
              print("CHUNKS_NATIVE_DIAGNOSTIC: no_safe_failed_test_identity; inspect earliest failed step")
          PY
      - name: Upload mandatory per-shard test receipts, including failed Android jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-receipt-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/chunks-native-add-receipt/digest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload real emulator screenshots when captured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-atlas-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/chunks-add-native-review/*.png
          if-no-files-found: warn
          retention-days: 14

  verify-complete-native-add:
    needs: add-review-device-test
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunks-native-add-*
          path: ${{ runner.temp }}/chunks-native-add-shards
      - name: Require accepted JUnit coverage and 24 real Android screenshots
        run: |
          python3 tools/verify_native_add_shards.py --artifacts "$RUNNER_TEMP/chunks-native-add-shards" \
            --shards 2 --sha "$GITHUB_SHA"
      - name: Attach original exact-source native Add acceptance receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-sharded-acceptance
          path: ${{ runner.temp }}/chunks-native-add-shards/native-add-acceptance.json
          retention-days: 14
          if-no-files-found: error
