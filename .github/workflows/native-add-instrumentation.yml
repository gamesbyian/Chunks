      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalResumeDatabase.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalRestoreDiscovery.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/engine/LocalResumeEventStoreInstrumentedTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalResumeFileReader.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/engine/LocalResumeFileReaderTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalEngineService.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalService*.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/LocalEngineServiceInstrumentedTest.kt"
      - ".github/workflows/android10-downloads-instrumentation.yml"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/engine/LocalPartialResumeProcessDeathInstrumentedTest.kt"
      - "tools/installed_partial_resume_death.sh"
      - ".github/workflows/installed-partial-resume-death.yml"
      - "tools/ci_shared_debug_routes.json"
      - "tools/ci_shared_debug_routes.py"
    # Drafts are implementation batches; run this costly acceptance only when
    # marked ready, then on every subsequent change. Converting back to draft
    # cancels obsolete in-flight work through the PR concurrency group.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      scope:
        description: Select installed debug journeys
        type: choice
        options: [native, protocol, both, combined, remove, api29, resume, all]
        default: native

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  CHUNKS_SOURCE_SHA: ${{ github.sha }}

concurrency:
  group: chunks-add-instrument-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


jobs:
  select:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.routes.outputs.native }}
      protocol: ${{ steps.routes.outputs.protocol }}
      combined: ${{ steps.routes.outputs.combined }}
      remove: ${{ steps.routes.outputs.remove }}
      api29: ${{ steps.routes.outputs.api29 }}
      resume: ${{ steps.routes.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve complete PR file selection or conservatively select all
        id: routes
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNKS_SCOPE: ${{ inputs.scope || 'native' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_trigger_contract.py
          python3 tools/ci_shared_debug_routes.py

  build-once:
    needs: select
    if: needs.select.outputs.native == 'true' || needs.select.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      artifact-name: ${{ steps.freeze.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required native atlas captures and parser before SDK allocation
        if: needs.select.outputs.native == 'true'
        run: |
          python3 tools/check_native_atlas_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_atlas_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_instrumentation_stream.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_add_attempts.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_android35_image_retry.py
      - name: Validate installed harness syntax before heavy setup
        if: needs.select.outputs.protocol == 'true'
        run: |
          bash -n tools/installed_protocol_client.sh
          bash -n tools/installed_external_document_process_loss.sh
          bash -n tools/interop/start_local_clients.sh
          python3 -m unittest discover -s tests -p test_installed_protocol_lanes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile immutable installed debug app/test APK pair once
        id: freeze
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p "$RUNNER_TEMP/shared-debug-apks"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/shared-debug-apks/app.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/shared-debug-apks/test.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/shared-debug-apks/source-sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/shared-debug-apks/source-tree"
          (cd "$RUNNER_TEMP/shared-debug-apks" && sha256sum app.apk test.apk > SHA256SUMS && sha256sum --strict --check SHA256SUMS)
          echo "artifact-name=chunks-shared-debug-apks-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.freeze.outputs.artifact-name }}
          path: ${{ runner.temp }}/shared-debug-apks/
          if-no-files-found: error
          retention-days: 14

  add-review-device-test:
    needs: [select, build-once]
    if: needs.select.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CHUNKS_NATIVE_ADD_SHARD_COUNT: "2"
      CHUNKS_NATIVE_ADD_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-once.outputs.artifact-name }}
          path: ${{ runner.temp }}/chunks-prebuilt
      - name: Reject stale SHA or changed app/test APK bytes
        run: |
          test "$(cat "$RUNNER_TEMP/chunks-prebuilt/source-sha")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/chunks-prebuilt/source-tree")" = "$(git rev-parse HEAD^{tree})"
          test "$(awk '{print $2}' "$RUNNER_TEMP/chunks-prebuilt/SHA256SUMS")" = $'app.apk\ntest.apk'
          (cd "$RUNNER_TEMP/chunks-prebuilt" && sha256sum --strict --check SHA256SUMS)
          ln "$RUNNER_TEMP/chunks-prebuilt/app.apk" "$RUNNER_TEMP/chunks-prebuilt/chunks-app.apk"
          ln "$RUNNER_TEMP/chunks-prebuilt/test.apk" "$RUNNER_TEMP/chunks-prebuilt/chunks-test.apk"
      - name: Reclaim unrelated toolchains before emulator allocation
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Retry pinned API35 Google APIs system-image installation before emulator boot
        run: bash tools/install_android35_image_retry.sh
      - name: Run full native Add review suite from exact-source installed APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/native_add_prebuilt.sh
      - name: Emit agent-readable source-bound JUnit evidence even on failure
        if: always()
        env:
          CHUNKS_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/ci_failure_digest.py --suite "api35-native-add-shard-$CHUNKS_NATIVE_ADD_SHARD_INDEX" --status "$CHUNKS_JOB_STATUS" --require-executed \
            --glob 'app/build/outputs/androidTest-results/connected/**/TEST-*.xml' \
            --output "$RUNNER_TEMP/chunks-native-add-receipt/digest.json"
      - name: Show bounded safe failing Android testcase identities
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path("app/build/outputs/androidTest-results/connected")
          count = 0
          for report in sorted(root.glob("**/TEST-*.xml")):
              try:
                  cases = ET.parse(report).getroot().iter("testcase")
                  for case in cases:
                      if case.find("failure") is None and case.find("error") is None:
                          continue
                      cls = case.get("classname", "")
                      method = case.get("name", "")
                      if (re.fullmatch(r"[A-Za-z_][A-Za-z0-9_.$]{0,159}", cls) and
                              re.fullmatch(r"[A-Za-z_][A-Za-z0-9_$]{0,99}", method)):
                          print(f"::error title=Native Add installed Android test failure::{cls}.{method}")
                      else:
                          print("CHUNKS_NATIVE_DIAGNOSTIC: failed_case_identity_redacted")
                      count += 1
                      if count >= 8:
                          break
              except (OSError, ET.ParseError):
                  print("CHUNKS_NATIVE_DIAGNOSTIC: invalid_JUnit_report")
              if count >= 8:
                  break
          if count == 0:
              print("CHUNKS_NATIVE_DIAGNOSTIC: no_safe_failed_test_identity; inspect earliest failed step")
          PY
      - name: Upload mandatory per-shard test receipts, including failed Android jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-receipt-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chunks-native-add-receipt/digest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload real emulator screenshots when captured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-atlas-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chunks-add-native-review/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload controlled provider counters and installed-byte evidence
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: chunks-installed-second-add-media-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chunks-second-add-media/
          if-no-files-found: warn
          retention-days: 14

  verify-complete-native-add:
    needs: [select, add-review-device-test]
    if: always() && needs.select.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunks-native-add-*
          path: ${{ runner.temp }}/chunks-native-add-shards
      - name: Resolve newest attempt per shard, preserving every original receipt
        env:
          CHUNKS_SHARDS_RESULT: ${{ needs.add-review-device-test.result }}
        run: |
          python3 tools/select_native_add_attempts.py --artifacts "$RUNNER_TEMP/chunks-native-add-shards" \
            --shards 2 --sha "$GITHUB_SHA" --shards-result "$CHUNKS_SHARDS_RESULT"
      - name: Require accepted JUnit coverage and 24 real Android screenshots
        run: |
          python3 tools/verify_native_add_shards.py --artifacts "$RUNNER_TEMP/chunks-native-add-shards" \
            --shards 2 --sha "$GITHUB_SHA"
      - name: Attach original exact-source native Add acceptance receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-sharded-acceptance
          path: ${{ runner.temp }}/chunks-native-add-shards/native-add-acceptance.json
          retention-days: 14
          if-no-files-found: error

  protocol:
    needs: [select, build-once]
    if: needs.select.outputs.protocol == 'true'
    uses: ./.github/workflows/installed-protocol-client.yml
    with:
      artifact_name: ${{ needs.build-once.outputs.artifact-name }}

  combined:
    needs: [select, build-once]
    # Do not create a new producer solely for these relatively short journeys.
    # If an Add build was selected, a failed build must never fall back silently.
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.combined == 'true' && (needs.build-once.result == 'success' || (needs.build-once.result == 'skipped' && needs.select.outputs.native != 'true' && needs.select.outputs.protocol != 'true')) }}
    uses: ./.github/workflows/installed-combined-two-servers.yml
    with:
      same_run_apks: ${{ needs.build-once.result == 'success' }}
      artifact_name: ${{ needs.build-once.outputs.artifact-name || '' }}

  remove:
    needs: [select, build-once]
    # Do not create a new producer solely for these relatively short journeys.
    # If an Add build was selected, a failed build must never fall back silently.
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.remove == 'true' && (needs.build-once.result == 'success' || (needs.build-once.result == 'skipped' && needs.select.outputs.native != 'true' && needs.select.outputs.protocol != 'true')) }}
    uses: ./.github/workflows/installed-remote-delete-data.yml
    with:
      same_run_apks: ${{ needs.build-once.result == 'success' }}
      artifact_name: ${{ needs.build-once.outputs.artifact-name || '' }}

  api29:
    needs: [select, build-once]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.api29 == 'true' && (needs.build-once.result == 'success' || (needs.build-once.result == 'skipped' && needs.select.outputs.native != 'true' && needs.select.outputs.protocol != 'true')) }}
    uses: ./.github/workflows/android10-downloads-instrumentation.yml
    with:
      artifact_name: ${{ needs.build-once.outputs.artifact-name || '' }}

  resume:
    needs: [select, build-once]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.resume == 'true' && (needs.build-once.result == 'success' || (needs.build-once.result == 'skipped' && needs.select.outputs.native != 'true' && needs.select.outputs.protocol != 'true')) }}
    uses: ./.github/workflows/installed-partial-resume-death.yml
    with:
      artifact_name: ${{ needs.build-once.outputs.artifact-name || '' }}
