name: Chunks native Add review instrumentation

on:
  pull_request:
    paths:
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/native-add-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-add-instrument-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  add-review-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented native UI tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; cannot run hardware-accelerated x86 Android instrumented tests"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run actual native Compose Add review tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put system font_scale 1.0
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p "$RUNNER_TEMP/chunks-add-native-review"
            adb pull /sdcard/Android/data/io.github.gamesbyian.chunks/files/chunks-atlas/. "$RUNNER_TEMP/chunks-add-native-review"
            python3 - <<'PY'
            from pathlib import Path
            import struct, os
            root=Path(os.environ["RUNNER_TEMP"])/"chunks-add-native-review"
            for name in ("add-confirmation-real-compose.png","add-invalid-path-real-compose.png"):
                raw=(root/name).read_bytes()
                assert raw[:8]==b"\x89PNG\r\n\x1a\n", "Not a real PNG screenshot"
                assert raw[12:16]==b"IHDR"
                w,h=struct.unpack(">II",raw[16:24])
                assert w>=300 and h>=500
                print("CHUNKS_ADD_NATIVE_ATLAS validated",name,w,h)
            PY
      - name: Upload native Compose review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-add-review-states
          path: ${{ runner.temp }}/chunks-add-native-review
          retention-days: 14
          if-no-files-found: warn
