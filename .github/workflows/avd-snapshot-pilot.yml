name: Chunks clean AVD cold baseline (manual only)

# Snapshot restore failed twice in #2090, even without network transfer.
# Keep the useful cold baseline, retire all persistent AVD cache writes.
# A clean boot does not qualify any Chunks APK or installed journey.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-avd-snapshot-pilot
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require hardware acceleration before allocating Android
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Mark start of measured emulator-runner invocation
        run: echo "CHUNKS_AVD_PROBE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Boot and verify a clean cold emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_avd_pilot_probe.sh measure
      - name: Record successful cold baseline and exact SDK revisions
        shell: bash
        run: |
          set -euo pipefail
          emulator_meta="$ANDROID_HOME/emulator/source.properties"
          image_meta="$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties"
          test -s "$emulator_meta" && test -s "$image_meta"
          em="$(sed -n 's/^Pkg.Revision=//p' "$emulator_meta" | head -1)"
          img="$(sed -n 's/^Pkg.Revision=//p' "$image_meta" | head -1)"
          [[ "$em" =~ ^[0-9]+([.][0-9]+)*$ ]]
          [[ "$img" =~ ^[0-9]+([.][0-9]+)*$ ]]
          [[ "$CHUNKS_AVD_PROBE_START_MS" =~ ^[0-9]+$ ]]
          elapsed=$(( $(date +%s%3N) - CHUNKS_AVD_PROBE_START_MS ))
          {
            echo '### Isolated cold AVD baseline (no app tests)'
            echo "- System image: API35 google_apis x86_64 revision $img"
            echo "- Emulator revision: $em"
            echo "- Source checkout: $GITHUB_SHA"
            echo "- Measured emulator-runner step and probe (milliseconds): $elapsed"
            echo '- No persistent cache or snapshot; no installed Chunks acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete only the disposable local AVD
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$HOME/.android/avd/test.avd"
          rm -f -- "$HOME/.android/avd/test.ini"
          test ! -e "$HOME/.android/avd/test.avd"
          test ! -e "$HOME/.android/avd/test.ini"
          echo "CHUNKS_AVD_LOCAL_CLEANUP: removed disposable test AVD"
