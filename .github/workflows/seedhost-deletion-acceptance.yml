name: Protected Seedhost deletion acceptance
on:
  pull_request:
    paths:
      - tools/seedhost_deletion_acceptance.py
      - .github/workflows/seedhost-deletion-acceptance.yml
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional exact reviewed same-repository candidate commit (40 lowercase hex); empty tests main"
        type: string
        default: ""
      delete_disposable:
        description: "Authorize one unique synthetic peer transfer, session-only removal/re-add and permanent data deletion; no APK publication"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: chunks-android-seedhost-scope-mutation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/seedhost_deletion_acceptance.py
  protected:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read-only getter and plugin diagnosis
        env:
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
        run: python3 tools/seedhost_deletion_acceptance.py

  real-deletion:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.delete_disposable }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate exact reviewed source selection
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [ -n "$CANDIDATE_SHA" ]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Record exact test source
        run: git log -1 --format='CHUNKS_HOST_DELETE_SOURCE %H %T'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify actual Kotlin deletion and independent filesystem outcomes
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          CHUNKS_HOST_PEER_PROOF: authorized
          CHUNKS_HOST_PEER_PROOF_NATIVE_START: authorized
          CHUNKS_HOST_DELETE_PROOF: authorized
        run: |
          private_log=$(mktemp)
          trap 'rm -f "$private_log"' EXIT
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.interop.SeedhostExactPeerBytesOnceTest > "$private_log" 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.interop.SeedhostExactPeerBytesOnceTest.xml')
          if not path.exists():
              print('CHUNKS_HOST_DELETE: missing-test-receipt; raw log withheld')
              sys.exit(1)
          root = ET.parse(path).getroot()
          lines = (root.findtext('system-out') or '').splitlines()
          for line in lines:
              if line.startswith(('CHUNKS_HOST_DELETE: ', 'CHUNKS_HOST_BYTES_STAGE: ')):
                  print(line[:200])
          print('CHUNKS_HOST_DELETE: tests=' + root.get('tests') + ' failed=' + root.get('failures') + ' skipped=' + root.get('skipped'))
          witnessed = 'CHUNKS_HOST_DELETE: verified-session-absent-payload-absent-unrelated-entries-preserved' in lines
          ok = witnessed and int(root.get('tests', '0')) > 0 and sys.argv[1] == '0' and root.get('failures') == '0' and root.get('errors') == '0' and root.get('skipped') == '0'
          sys.exit(0 if ok else 1)
          PY
