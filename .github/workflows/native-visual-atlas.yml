name: Native Android visual baseline atlas

on:
  pull_request:
    paths:
      - ".github/workflows/native-visual-atlas.yml"
      - "tools/native_visual_atlas.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-native-atlas-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  android-native-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install compile Android SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build testable native debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable Android emulator KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; cannot run hardware-accelerated x86 Android instrumented tests"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Native AVD screenshot + accessibility hierarchy capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p "$RUNNER_TEMP/chunks-native-atlas"
            for scenario in small standard larger_text wide; do
              case "$scenario" in
                small) pixels="1080x2400"; density=480; font=1.0 ;;
                standard) pixels="1080x2400"; density=420; font=1.0 ;;
                larger_text) pixels="1080x2400"; density=420; font=1.4 ;;
                wide) pixels="1080x2250"; density=360; font=1.0 ;;
              esac
              adb shell wm size "$pixels"
              adb shell wm density "$density"
              adb shell settings put system font_scale "$font"
              adb shell am force-stop io.github.gamesbyian.chunks || true
              adb shell am start -W -n io.github.gamesbyian.chunks/.MainActivity
              sleep 3
              adb exec-out screencap -p > "$RUNNER_TEMP/chunks-native-atlas/${scenario}.png"
              adb shell uiautomator dump --compressed /sdcard/chunks-ui.xml || true
              adb pull /sdcard/chunks-ui.xml "$RUNNER_TEMP/chunks-native-atlas/${scenario}.xml" || true
            done
            python3 tools/native_visual_atlas.py "$RUNNER_TEMP/chunks-native-atlas"
      - name: Upload exact emulator screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-compose-baseline-atlas
          path: ${{ runner.temp }}/chunks-native-atlas
          retention-days: 14
          if-no-files-found: warn
