name: Native Android visual baseline atlas

on:
  pull_request:
    paths:
      - ".github/workflows/native-visual-atlas.yml"
      - "tools/native_visual_atlas.py"
      - "tools/native_atlas_capture.sh"
      - "app/src/main/java/io/github/gamesbyian/chunks/MainActivity.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/ChunksBrandHeader.kt"
      - "app/src/main/res/font/chunks_extrabold.otf"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/ChunksBrandHeaderInstrumentedTest.kt"
      - "docs/design/approved/chunks-app-icon-master.svg"
      - "app/src/main/res/drawable/chunks_launcher_artwork.xml"
      - "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/ChunksLauncherIconInstrumentedTest.kt"
      - "tools/generate_launcher_vector.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-native-atlas-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  android-native-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify SVG-derived launcher vector is up to date
        run: |
          node tools/generate_launcher_vector.cjs --check
          test ! -e app/src/main/res/drawable-nodpi/chunks_launcher_artwork.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install compile Android SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build testable native debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Reclaim unrelated toolchains before emulator allocation
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
      - name: Enable Android emulator KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; cannot run hardware-accelerated x86 Android instrumented tests"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Native AVD screenshot + accessibility hierarchy capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash tools/native_atlas_capture.sh
            # The two independent test classes can run in one AndroidJUnitRunner
            # session; avoid a second Gradle/UTP install/configuration cycle.
            gradle --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=io.github.gamesbyian.chunks.ChunksLauncherIconInstrumentedTest,io.github.gamesbyian.chunks.ChunksBrandHeaderInstrumentedTest
      - name: Require actual executed Android test evidence
        if: always()
        env:
          CHUNKS_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/ci_failure_digest.py --suite api35-native-visual-atlas --status "$CHUNKS_JOB_STATUS" --require-executed \
            --glob 'app/build/outputs/androidTest-results/connected/**/TEST-*.xml' \
            --output "$RUNNER_TEMP/chunks-native-atlas/digest.json"
          # The single AndroidJUnitRunner invocation must still exercise all
          # three test methods previously run across the two Gradle invocations.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/outputs/androidTest-results/connected")
          expected = {
              ("io.github.gamesbyian.chunks.ChunksLauncherIconInstrumentedTest",
               "installedApplicationExposesNativeAdaptiveVectorIcon"),
              ("io.github.gamesbyian.chunks.ChunksBrandHeaderInstrumentedTest",
               "largeAccessibilityTypeStillExposesTheWholeHeader"),
              ("io.github.gamesbyian.chunks.ChunksBrandHeaderInstrumentedTest",
               "brandAndTaglineAreOneAccessibleHeading"),
          }
          found = []
          for report in root.glob("**/TEST-*.xml"):
              for case in ET.parse(report).getroot().iter("testcase"):
                  identity = (case.get("classname"), case.get("name"))
                  if identity in expected:
                      if any(case.find(tag) is not None for tag in ("skipped", "failure", "error")):
                          raise SystemExit("Required native atlas Android test did not pass")
                      found.append(identity)
          if len(found) != len(expected) or set(found) != expected:
              raise SystemExit("Missing or duplicated native atlas Android test method")
          print("CHUNKS_NATIVE_ATLAS: all 3 required installed Android tests passed")
          PY
      - name: Upload exact emulator screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-compose-baseline-atlas
          path: |
            ${{ runner.temp }}/chunks-native-atlas
            app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
