name: One-shot Chunks public media HTTP proof

on:
  push:
    branches:
      - "probe/public-media-http-20261110"
    paths:
      - ".github/workflows/chunks-public-media-http-once.yml"

permissions:
  contents: read

concurrency:
  group: chunks-one-shot-public-media-20261110
  cancel-in-progress: true

jobs:
  public-tvmaze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source
        run: |
          echo "CHUNKS_REAL_MEDIA_SOURCE=$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "probe/public-media-http-20261110"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Prefetch verified Robolectric Android 15 runtime
        run: timeout 240s python3 tools/prefetch_robolectric_sdk.py --sdk 35
      - name: Opted-in REAL TVmaze metadata and poster CDN journey, with offline restore
        env:
          CHUNKS_LIVE_MEDIA: "1"
        run: |
          gradle --no-daemon --console plain :app:testDebugUnitTest --tests "io.github.gamesbyian.chunks.media.MediaLiveProviderTest.tvEpisodeEndToEnd"
      - name: Record exact one-test JVM receipt (no secrets)
        if: always()
        env:
          CHUNKS_TEST_OUTCOME: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          matching=[]
          for path in files:
              root=ET.parse(path).getroot()
              if root.attrib.get("name", "").endswith("MediaLiveProviderTest"):
                  matching.append(root)
          for r in matching:
              print("REAL_PUBLIC_MEDIA_JUNIT", "name="+r.attrib.get("name",""),
                    "tests="+r.attrib.get("tests",""), "skipped="+r.attrib.get("skipped",""),
                    "failures="+r.attrib.get("failures",""), "errors="+r.attrib.get("errors",""))
          if not matching:
              print("REAL_PUBLIC_MEDIA_JUNIT missing: test did not execute")
          PY
          echo "REAL_PUBLIC_MEDIA_SOURCE=$GITHUB_SHA; outcome=$CHUNKS_TEST_OUTCOME"
