name: Temporary coroutine cancellation inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/check_coroutine_cancellation.py'
      - 'tests/test_coroutine_cancellation_inventory.py'
      - '.github/workflows/coroutine-cancellation-inventory-temporary.yml'
permissions:
  contents: read
concurrency:
  group: chunks-cancel-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test lexical controls
        run: python3 -m unittest discover -s tests -p test_coroutine_cancellation_inventory.py
      - name: Review current source candidates
        if: always()
        run: python3 tools/check_coroutine_cancellation.py
