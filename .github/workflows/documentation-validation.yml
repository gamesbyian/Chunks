name: Documentation validation

on:
  push:
    branches:
      - docs/reconcile-specs-main-20261029
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'assets/fonts/README.md'
      - 'tools/check_docs.py'
      - 'tests/test_docs_check.py'
      - 'tools/verify_release_apk_identity.py'
      - 'tests/test_verify_release_apk_identity.py'
      - 'tools/check_pr_exact_head.py'
      - 'tests/test_check_pr_exact_head.py'
      - 'tools/require_post_stop_nonclobber.py'
      - 'tests/test_require_post_stop_nonclobber.py'
      - 'tools/require_restore_nonclobber.py'
      - 'tests/test_require_restore_nonclobber.py'
      - 'tools/require_add_magnet_nonclobber.py'
      - 'tests/test_require_add_magnet_nonclobber.py'
      - 'tools/check_gradle_toolchain_pins.py'
      - 'tests/test_check_gradle_toolchain_pins.py'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-check.yml'
      - '.github/workflows/android10-downloads-instrumentation.yml'
      - '.github/workflows/native-add-instrumentation.yml'
      - '.github/workflows/native-post-add-collision-witness.yml'
      - '.github/workflows/minified-smoke.yml'
      - '.github/workflows/native-visual-atlas.yml'
      - '.github/workflows/android-fgs-timeout-repro.yml'
      - '.github/workflows/android-public-swarm.yml'
      - '.github/workflows/disposable-rtorrent-probe.yml'
      - '.github/workflows/release-apk.yml'
      - '.github/workflows/publish-debug-apk.yml'
      - '.github/workflows/release-apk.yml'
      - '.github/workflows/documentation-validation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'assets/fonts/README.md'
      - 'tools/check_docs.py'
      - 'tests/test_docs_check.py'
      - 'tools/verify_release_apk_identity.py'
      - 'tests/test_verify_release_apk_identity.py'
      - 'tools/check_pr_exact_head.py'
      - 'tests/test_check_pr_exact_head.py'
      - 'tools/require_post_stop_nonclobber.py'
      - 'tests/test_require_post_stop_nonclobber.py'
      - 'tools/require_restore_nonclobber.py'
      - 'tests/test_require_restore_nonclobber.py'
      - 'tools/require_add_magnet_nonclobber.py'
      - 'tests/test_require_add_magnet_nonclobber.py'
      - 'tools/check_gradle_toolchain_pins.py'
      - 'tests/test_check_gradle_toolchain_pins.py'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-check.yml'
      - '.github/workflows/android10-downloads-instrumentation.yml'
      - '.github/workflows/native-add-instrumentation.yml'
      - '.github/workflows/native-post-add-collision-witness.yml'
      - '.github/workflows/minified-smoke.yml'
      - '.github/workflows/native-visual-atlas.yml'
      - '.github/workflows/android-fgs-timeout-repro.yml'
      - '.github/workflows/android-public-swarm.yml'
      - '.github/workflows/disposable-rtorrent-probe.yml'
      - '.github/workflows/release-apk.yml'
      - '.github/workflows/publish-debug-apk.yml'
      - '.github/workflows/release-apk.yml'
      - '.github/workflows/documentation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository-wide local documentation links
        run: python3 tools/check_docs.py
      - name: Test documentation validator
        run: python3 -m unittest discover -s tests -p 'test_docs_check.py'
      - name: Verify release APK identity negative controls (offline)
        run: python3 -m unittest discover -s tests -p 'test_verify_release_apk_identity.py'
      - name: Refuse stale, cancelled and mismatched PR CI receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_check_pr_exact_head.py'
      - name: Refuse overwritten synthetic bytes in post-Stop native safety receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_require_post_stop_nonclobber.py'
      - name: Refuse destructive checked-torrent restoration receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_require_restore_nonclobber.py'
      - name: Refuse raw Add and deferred magnet native overwrite receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_require_add_magnet_nonclobber.py'
      - name: Reject Gradle, JDK and native dependency pin drift (offline)
        run: |
          python3 tools/check_gradle_toolchain_pins.py
          python3 -m unittest discover -s tests -p 'test_check_gradle_toolchain_pins.py'
