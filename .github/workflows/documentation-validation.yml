permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate physical APK preflight and trigger selection (offline)
        run: |
          bash tools/test_physical_android_preflight.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_trigger_contract.py
      - name: Verify CI JVM fork experiment remains scoped and covered
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_jvm_parallelism.py
      - name: Audit all workflow definitions and their dispatch metadata
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_workflow_inventory.py
          python3 tools/ci_workflow_inventory.py --output "$RUNNER_TEMP/chunks-workflow-inventory.json" --summary
      - name: Retain machine-readable all-workflow inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-workflow-inventory
          path: ${{ runner.temp }}/chunks-workflow-inventory.json
          retention-days: 7
          if-no-files-found: warn
      - name: Refuse writable tokens in font verification and unreachable publish steps
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_font_permissions.py
      - name: Verify explicit main-only debug publication and immutable actions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_debug_publish_gate.py
      - name: Verify native superseded-run cancellation cannot cross PRs or manual runs
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_native_concurrency.py
      - name: Verify phone intake harness negatives and existing Android dispatch (offline)
        run: |
          bash tools/test_phone_intake_journey.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_phone_intake.py
      - name: Validate installed real-source magnet reporting without secrets or emulator
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_installed_magnet_add_receipt.py
      - name: Test complete native Add sharding and CI evidence contracts offline
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_failure_digest.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_add_shards.py
      - name: Validate protected magnet test evidence receipts without credentials
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_real_magnet_peer_receipt.py
      - name: Validate native atlas names offline (no Android)
        run: |
          python3 tools/check_native_atlas_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_atlas_contract.py
      - name: Validate repository-wide local documentation links
        run: python3 tools/check_docs.py
      - name: Test documentation validator
        run: python3 -m unittest discover -s tests -p 'test_docs_check.py'
      - name: Verify release APK identity negative controls (offline)
        run: python3 -m unittest discover -s tests -p 'test_verify_release_apk_identity.py'
      - name: Refuse stale, cancelled and mismatched PR CI receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_check_pr_exact_head.py'
      - name: Refuse overwritten synthetic bytes in post-Stop native safety receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_require_post_stop_nonclobber.py'
      - name: Refuse destructive checked-torrent restoration receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_require_restore_nonclobber.py'
      - name: Refuse raw Add and deferred magnet native overwrite receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_require_add_magnet_nonclobber.py'
      - name: Reject Gradle, JDK and native dependency pin drift (offline)
        run: |
          python3 tools/check_gradle_toolchain_pins.py
          python3 -m unittest discover -s tests -p 'test_check_gradle_toolchain_pins.py'
      - name: Test CI orchestration and agent failure digest (offline)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_failure_digest.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_ci_orchestration.py
