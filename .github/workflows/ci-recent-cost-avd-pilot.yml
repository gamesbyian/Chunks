name: Chunks temporary CI cost and AVD measurement

# One-off, read-only PR qualification. Do not merge this trigger into main.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/ci-recent-cost-avd-pilot.yml"
      - "tools/ci_recent_pr_cost_pilot.py"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: chunks-recent-cost-avd-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recent-pr-cost:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Measure recent merged PRs with all job attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.ci_recent_pr_cost_pilot
      - name: Preserve numeric cost sample and missing-data disclosures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-recent-ci-cost
          path: ${{ runner.temp }}/recent-ci-cost/
          retention-days: 14
          if-no-files-found: warn

  clean-avd-local-comparison:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Start timing cold-1
        run: echo "CHUNKS_AVD_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Boot cold-1 and verify clean Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_avd_pilot_probe.sh measure
      - name: Record cold-1 complete invocation time
        run: |
          elapsed=$(( $(date +%s%3N) - CHUNKS_AVD_START_MS ))
          echo "CHUNKS_AVD_LOCAL_SAMPLE: mode=cold-1 invocation_ms=$elapsed"
          echo "- cold-1: ${elapsed} ms (whole action invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start timing cold-2
        run: echo "CHUNKS_AVD_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Boot cold-2 and verify clean Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_avd_pilot_probe.sh measure
      - name: Record cold-2 complete invocation time
        run: |
          elapsed=$(( $(date +%s%3N) - CHUNKS_AVD_START_MS ))
          echo "CHUNKS_AVD_LOCAL_SAMPLE: mode=cold-2 invocation_ms=$elapsed"
          echo "- cold-2: ${elapsed} ms (whole action invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start timing generate
        run: echo "CHUNKS_AVD_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Boot generate and verify clean Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_avd_pilot_probe.sh pristine
      - name: Record generate complete invocation time
        run: |
          elapsed=$(( $(date +%s%3N) - CHUNKS_AVD_START_MS ))
          echo "CHUNKS_AVD_LOCAL_SAMPLE: mode=generate invocation_ms=$elapsed"
          echo "- generate: ${elapsed} ms (whole action invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Require the generated clean Quick Boot files and record size
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/avd/test.ini"
          snapshot="$HOME/.android/avd/test.avd/snapshots/default_boot"
          test -s "$snapshot/snapshot.pb"
          test -s "$snapshot/ram.bin" || test -s "$snapshot/ram.img"
          echo "CHUNKS_AVD_LOCAL_MIB=$(du -sm "$HOME/.android/avd/test.avd" | awk '{print $1}')"
          for file in "$ANDROID_HOME/emulator/source.properties" "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties"; do
            sed -n 's/^Pkg.Revision=/CHUNKS_AVD_REVISION=/p' "$file"
          done
      - name: Start timing warm-1
        run: echo "CHUNKS_AVD_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Boot warm-1 and verify clean Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          avd-name: test
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -verbose -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_avd_pilot_probe.sh measure
      - name: Record warm-1 complete invocation time
        run: |
          elapsed=$(( $(date +%s%3N) - CHUNKS_AVD_START_MS ))
          echo "CHUNKS_AVD_LOCAL_SAMPLE: mode=warm-1 invocation_ms=$elapsed"
          echo "- warm-1: ${elapsed} ms (whole action invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start timing warm-2
        run: echo "CHUNKS_AVD_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Boot warm-2 and verify clean Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          avd-name: test
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -verbose -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_avd_pilot_probe.sh measure
      - name: Record warm-2 complete invocation time
        run: |
          elapsed=$(( $(date +%s%3N) - CHUNKS_AVD_START_MS ))
          echo "CHUNKS_AVD_LOCAL_SAMPLE: mode=warm-2 invocation_ms=$elapsed"
          echo "- warm-2: ${elapsed} ms (whole action invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete only this disposable local AVD after measurement
        if: always()
        run: |
          rm -rf -- "$HOME/.android/avd/test.avd"
          rm -f -- "$HOME/.android/avd/test.ini"
          echo "No repository cache or AVD artifact was created."
