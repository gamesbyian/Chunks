name: Chunks reference SVG palette contrast audit
# Workflow-only routing changes are checked by Documentation validation.
# Changes to executable commands require explicit workflow_dispatch on the candidate.
on:
  pull_request:
    paths:
      - 'docs/design/svg/palettes/**'
      - 'tools/audit_svg_palette_contrast.py'
  workflow_dispatch:
# Superseded PR revisions should not keep spending runner minutes.
# Manual and main-push executions use their unique run ID and are never cancelled.
concurrency:
  group: chunks-svg-palette-contrast-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  palette-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable contrast audit without changing palette variants
        run: python3 tools/audit_svg_palette_contrast.py --check
