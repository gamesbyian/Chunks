name: Research POSIX Downloads MediaStore identity (disposable Android)

on:
  pull_request:
    paths:
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/NativeDownloadsMediaStoreIdentityInstrumentedTest.kt"
      - "tools/p0_mediastore_posix_probe.sh"
      - "tools/parse_instrumentation_stream.py"
      - ".github/workflows/p0-mediastore-posix-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-p0-mediastore-probe-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  targeted-android-posix-mediastore:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build one exact-source app/test APK pair
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Reclaim unrelated runner toolchains and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Execute one explicitly authorized disposable MediaStore probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/p0_mediastore_posix_probe.sh
      - name: Retain exact-source Android JUnit result even if red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-p0-mediastore-posix-junit
          path: |
            ${{ runner.temp }}/chunks-mediastore-posix/TEST-mediastore-posix.xml
            ${{ runner.temp }}/chunks-mediastore-posix/raw.txt
          retention-days: 7
          if-no-files-found: warn
