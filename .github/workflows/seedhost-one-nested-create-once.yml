name: Seedhost small-parent mkdir acceptance (one-shot only)

# Isolated disposable, explicit owner-approved create. NOT merged into main.
# A future push/rerun cannot replay the mutation.
on:
  push:
    branches:
      - diagnostics/seedhost-one-nested-create-20261114
    paths:
      - .github/workflows/seedhost-one-nested-create-once.yml

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-nested-create-one-shot
  cancel-in-progress: false

jobs:
  create:
    if: ${{ github.repository == 'gamesbyian/Chunks' && github.ref == 'refs/heads/diagnostics/seedhost-one-nested-create-20261114' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Exact-account, fully corroborated nested parent, one new empty child
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          CHUNKS_SEEDHOST_NESTED_CREATE_ONCE: authorized
          CHUNKS_NESTED_CREATE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          private_log=$(mktemp)
          trap 'rm -f "$private_log"' EXIT
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostNestedOneShotCreateAcceptanceTest > "$private_log" 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          p = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostNestedOneShotCreateAcceptanceTest.xml')
          if not p.exists():
              print('CHUNKS_NESTED_CREATE_ONCE: test-result-missing; never replay')
              raise SystemExit(1)
          root = ET.parse(p).getroot()
          lines = (root.findtext('system-out') or '').splitlines()
          for line in lines:
              if line.startswith('CHUNKS_NESTED_CREATE_ONCE: '):
                  print(line[:200])
          ok = (sys.argv[1] == '0' and int(root.get('tests', '0')) == 1
                and all(root.get(f) == '0' for f in ('failures', 'errors', 'skipped'))
                and any('one-empty-child-created-receipt-and-two-provider-readback=verified' in l for l in lines))
          print('CHUNKS_NESTED_CREATE_ONCE: verified=' + ('true' if ok else 'false') + '; never replay this run')
          raise SystemExit(0 if ok else 1)
          PY
