name: Reconcile exact development Seedhost test fixture (read-only)

# Runs on first merge to main. Manual future reruns remain strictly read-only.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seedhost-reconcile-readonly-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-reconcile-readonly
  cancel-in-progress: false

jobs:
  synthetic-readonly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CHUNKS_RECONCILE_RUN_ID: "40463480840"
      CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
      CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
      CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Inspect exact synthetic fixture without writes
        run: |
          set -euo pipefail
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostReadOnlyReconcileTest
          gradle_status=$?
          set -e
          python3 - "$gradle_status" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path("app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostReadOnlyReconcileTest.xml")
          if not path.exists():
              print("CHUNKS_RECONCILE: test-results-missing no_mutations=true")
              sys.exit(1)
          root = ET.parse(path).getroot()
          for line in (root.findtext("system-out") or "").splitlines():
              if line.startswith("CHUNKS_RECONCILE:"):
                  print(line[:500])
          assert int(sys.argv[1]) == 0, "Read-only reconciliation did not pass"
          assert root.attrib["tests"] == "1" and root.attrib["failures"] == "0" and root.attrib["errors"] == "0" and root.attrib["skipped"] == "0"
          print("CHUNKS_RECONCILE: exact fixture inspection passed; no mutation methods used")
          PY
