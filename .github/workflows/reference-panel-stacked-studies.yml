name: Build safe nonshipping stacked Latin accent CFFs
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_reference_stacked_accents.py'
      - 'tools/render_reference_stacked_accents.py'
      - 'tools/render_reference_stacked_grid.py'
      - 'tests/test_reference_stacked_grid.py'
      - 'tools/audit_reference_latin_coverage.py'
      - 'tests/test_reference_stacked_accents.py'
      - 'assets/fonts/chunks/**'
      - 'assets/fonts/experimental/consolidated/**'
      - 'assets/fonts/experimental/stacked-studies/**'
      - '.github/workflows/reference-panel-stacked-studies.yml'
      - 'docs/design/CHUNKS-REFERENCE-STACKED-ACCENTS.md'
  pull_request:
    paths:
      - 'tools/build_reference_stacked_accents.py'
      - 'tools/render_reference_stacked_accents.py'
      - 'tools/render_reference_stacked_grid.py'
      - 'tests/test_reference_stacked_grid.py'
      - 'tools/audit_reference_latin_coverage.py'
      - 'tests/test_reference_stacked_accents.py'
      - 'assets/fonts/chunks/**'
      - 'assets/fonts/experimental/consolidated/**'
      - 'assets/fonts/experimental/stacked-studies/**'
      - '.github/workflows/reference-panel-stacked-studies.yml'
      - 'docs/design/CHUNKS-REFERENCE-STACKED-ACCENTS.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chunks-font-stacked-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build-five-stacked-prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native CFF and HarfBuzz libraries
        run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Build conservative five-weight stacked-mark CFF alternatives
        run: python tools/build_reference_stacked_accents.py
      - name: Prove complete Unicode cmap and original glyph/complex script preservation
        run: python -m unittest discover -s tests -p test_reference_stacked_accents.py -v
      - name: Generate real-font report of safe composed and retained source accents
        run: python tools/render_reference_stacked_accents.py
      - name: Verify native CFF coverage and four-size stacked review sheets
        run: |
          python -m unittest discover -s tests -p test_reference_stacked_grid.py -v
          python tools/render_reference_stacked_grid.py
      - name: Upload five nonshipping fonts and source license
        uses: actions/upload-artifact@v4
        with:
          name: chunks-five-reference-stacked-study-otfs
          path: |
            assets/fonts/experimental/stacked-studies/*
            reference-stacked-five-weights.png
            reference-stacked-grid-*.png
            reference-stacked-grid-metrics.json
            assets/fonts/source/OFL.txt
          retention-days: 30
      - name: Commit deterministic prototypes only to the source branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/experimental/stacked-studies
          if ! git diff --cached --quiet; then
            git commit -m 'build(font): retain reversible five stacked accent studies'
            branch="${GITHUB_REF#refs/heads/}"
            for attempt in 1 2 3; do
              git fetch origin "$branch"
              git rebase "origin/$branch"
              if git push origin "HEAD:$branch"; then exit 0; fi
            done
            echo 'Failed to rebase and push reproducible stacked font artifacts' >&2
            exit 1
          fi
