name: Android 10 anonymous ZIP staging proof

on:
  pull_request:
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/storage/AnonymousZipReviewStage.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/LocalZipArchiveReview.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/storage/AnonymousZipReviewStageInstrumentedTest.kt"
      - "tools/anonymous_zip_stage_api29.sh"
      - ".github/workflows/anonymous-zip-stage-api29.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-anon-zip-api29-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  api29-anonymous-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Require hardware-accelerated emulator
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Run only anonymous ZIP staging acceptance on actual API29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/anonymous_zip_stage_api29.sh
