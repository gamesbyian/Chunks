name: Research native delete-files boundary (isolated Linux)

on:
  pull_request:
    paths:
      - "app/src/test/java/io/github/gamesbyian/chunks/engine/NativeDeleteFlagsLinuxProbeTest.kt"
      - ".github/workflows/native-delete-boundary-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-native-delete-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run one disposable native libtorrent4j Linux case
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.engine.NativeDeleteFlagsLinuxProbeTest
      - name: Retain original exact-source diagnostic JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-delete-linux-diagnostic
          path: app/build/test-results/testDebugUnitTest/*NativeDeleteFlagsLinuxProbeTest*.xml
          if-no-files-found: warn
          retention-days: 7
