name: Research native delete-files boundary (isolated Linux)

on:
  pull_request:
    paths:
      - "app/src/test/java/io/github/gamesbyian/chunks/engine/NativeDeleteFlagsLinuxProbeTest.kt"
      - ".github/workflows/native-delete-boundary-research.yml"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/NativeDeleteFilesBoundaryInstrumentedTest.kt"
      - "tools/native_delete_android_probe.sh"
      - "tools/parse_instrumentation_stream.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-native-delete-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run one disposable native libtorrent4j Linux case
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.engine.NativeDeleteFlagsLinuxProbeTest
      - name: Retain original exact-source diagnostic JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-delete-linux-diagnostic
          path: app/build/test-results/testDebugUnitTest/*NativeDeleteFlagsLinuxProbeTest*.xml
          if-no-files-found: warn
          retention-days: 7

  targeted-android-jni-probe:
    # One disposable JNI test only, not the full native Add acceptance campaign.
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile isolated Android app and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Reclaim unrelated runner toolchains and authorize KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Run only disposable native delete test on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/native_delete_android_probe.sh
      - name: Retain exact-source Android JUnit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-native-delete-android-diagnostic
          path: ${{ runner.temp }}/chunks-native-delete-android/TEST-native-delete.xml
          if-no-files-found: warn
          retention-days: 7
