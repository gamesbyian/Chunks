name: Build nonshipping mixed above/below Latin CFF experiments
on:
  push:
    # Validate changes to feature branches via pull_request; build merged changes on main only.
    branches: [main]
    paths:
      - 'tools/build_reference_mixed_marks.py'
      - 'tools/render_reference_mixed_marks.py'
      - 'tests/test_reference_mixed_marks.py'
      - 'assets/fonts/experimental/mixed-mark-studies/**'
      - 'docs/design/CHUNKS-REFERENCE-MIXED-MARKS.md'
  pull_request:
    paths:
      - 'tools/build_reference_mixed_marks.py'
      - 'tools/render_reference_mixed_marks.py'
      - 'tests/test_reference_mixed_marks.py'
      - 'assets/fonts/experimental/mixed-mark-studies/**'
      - 'docs/design/CHUNKS-REFERENCE-MIXED-MARKS.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chunks-font-mixed-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  five-native-mixed-mark-faces:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned fonts, geometry and HarfBuzz
        run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Construct only explicitly detached canonical above and below marks
        run: python tools/build_reference_mixed_marks.py
      - name: Protect 856 Unicode glyphs, unchanged CFF geometry and Hindi shaping
        run: python -m unittest discover -s tests -p test_reference_mixed_marks.py -v
      - name: Render genuine nonshipping native-font editorial matrices
        run: python tools/render_reference_mixed_marks.py
      - name: Save all optional mixed-mark source and font evidence
        uses: actions/upload-artifact@v4
        with:
          name: chunks-experimental-mixed-direction-cff-otfs
          path: |
            assets/fonts/experimental/mixed-mark-studies/*
            reference-mixed-marks-*.png
            assets/fonts/source/OFL.txt
          retention-days: 30