name: Check Chunks SVG quality dossier

# Workflow-only routing changes are checked by Documentation validation.
# Changes to executable commands require explicit workflow_dispatch on the candidate.
on:
  pull_request:
    paths:
      - 'docs/design/svg/**'
      - 'docs/design/approved/chunks-app-icon-master.svg'
      - 'tools/audit_svg_inventory.py'
  workflow_dispatch:

# Superseded PR revisions should not keep spending runner minutes.
# Manual and main-push executions use their unique run ID and are never cancelled.
concurrency:
  group: chunks-svg-inventory-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inventory-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every SVG, alias and canonical icon extraction
        run: |
          python3 tools/validate_svg_library.py
          python3 tools/check_svg_approved_derivatives.py
      - name: Require current full-inventory QA and provenance report
        run: python3 tools/audit_svg_inventory.py
