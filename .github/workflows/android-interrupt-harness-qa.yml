name: Chunks interruption harness safety

# Offline fake-adb checks. Real public-peer interruption remains manually
# dispatched with bounded public torrents, never triggered by PR pushes.
on:
  pull_request:
    paths:
      - "tools/android_public_swarm_interrupt.sh"
      - "tools/test_android_public_swarm_interrupt_mock.sh"
      - ".github/workflows/android-interrupt-harness-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-interrupt-harness-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-interrupt-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify interrupted-transfer harness receipts with fake adb
        run: bash tools/test_android_public_swarm_interrupt_mock.sh
