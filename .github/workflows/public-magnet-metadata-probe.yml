name: Real public magnet discovery comparison

on:
  pull_request:
    paths:
      - "tools/public_magnet_metadata_probe.py"
      - ".github/workflows/public-magnet-metadata-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-magnet-metadata-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  public-metadata:
    strategy:
      fail-fast: false
      matrix:
        engine: [legacy, modern]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare real disposable rTorrent and libtorrent
        run: |
          sudo timeout 120s apt-get update -qq
          sudo timeout 120s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rtorrent nginx python3-libtorrent
          mkdir -p "$RUNNER_TEMP/probe-data" "$RUNNER_TEMP/probe-session"
          daemon_mode=true
          if [ "${{ matrix.engine }}" = modern ]; then daemon_mode=false; fi
          cat > "$RUNNER_TEMP/probe.rc" <<EOF
          directory.default.set = $RUNNER_TEMP/probe-data
          session.path.set = $RUNNER_TEMP/probe-session
          network.scgi.open_port = 127.0.0.1:5000
          throttle.global_down.max_rate.set_kb = 256
          dht.mode.set = auto
          protocol.pex.set = yes
          system.daemon.set = $daemon_mode
          EOF
          if [ "${{ matrix.engine }}" = legacy ]; then
            nohup rtorrent -n -o "import=$RUNNER_TEMP/probe.rc" > "$RUNNER_TEMP/probe-rtorrent.log" 2>&1 < /dev/null &
          else
            docker run -dit --name chunks-public-rtorrent --network host \
              -v "$RUNNER_TEMP/probe.rc:/chunks.rc:ro" \
              -v "$RUNNER_TEMP/probe-data:$RUNNER_TEMP/probe-data" \
              -v "$RUNNER_TEMP/probe-session:$RUNNER_TEMP/probe-session" \
              archlinux:latest sh -c 'pacman -Sy --noconfirm rtorrent >/dev/null && exec rtorrent -n -o import=/chunks.rc'
          fi
          cat > "$RUNNER_TEMP/probe-nginx.conf" <<EOF
          worker_processes 1;
          pid $RUNNER_TEMP/probe-nginx.pid;
          events { worker_connections 64; }
          http { server { listen 127.0.0.1:18080;
            location /RPC2 { include /etc/nginx/scgi_params; scgi_pass 127.0.0.1:5000; }
          } }
          EOF
          sudo nginx -c "$RUNNER_TEMP/probe-nginx.conf"
      - name: Same genuine public magnet to both real implementations, at most 90 seconds
        run: /usr/bin/python3 tools/public_magnet_metadata_probe.py
      - name: Preserve disposable setup evidence and fail-closed missing reports
        if: always()
        run: |
          evidence="$RUNNER_TEMP/chunks-public-metadata-probe"
          mkdir -p "$evidence"
          if [ "${{ matrix.engine }}" = modern ]; then
            docker inspect --format '{{json .State}}' chunks-public-rtorrent > "$evidence/rtorrent-state.json" 2>&1 || true
            docker logs chunks-public-rtorrent > "$evidence/rtorrent-setup.log" 2>&1 || true
          elif [ -f "$RUNNER_TEMP/probe-rtorrent.log" ]; then
            cp "$RUNNER_TEMP/probe-rtorrent.log" "$evidence/rtorrent-setup.log"
          fi
          # This rig contains no credentials or protected server state.
          # A setup crash must still leave a source-bound JSON and JUnit error.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "chunks-public-metadata-probe"
          if not (root / "RECEIPT.json").is_file():
              (root / "RECEIPT.json").write_text(json.dumps({
                  "source_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                  "result": "failed-or-inconclusive", "failure_category": "setup-before-probe",
                  "attempted_stages": ["runner-setup"], "completed_stages": [],
                  "cleanup": "disposable runner teardown", "protected_mutations": False}) + "\n")
          if not (root / "TEST-public-magnets.xml").is_file():
              (root / "TEST-public-magnets.xml").write_text('<testsuite name="public-discovery-setup" tests="1" errors="1"><testcase name="setup"><error type="ProbeNotExecuted"/></testcase></testsuite>')
          PY
      - name: Keep complete real outcomes and JUnit, including unavailable swarms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-public-magnet-discovery-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/chunks-public-metadata-probe/
          retention-days: 14
          if-no-files-found: error
