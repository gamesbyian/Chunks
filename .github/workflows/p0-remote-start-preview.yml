name: Chunks side-by-side remote-start field APK

# A read-only, non-publishing artifact build for the owner-authorized P0
# Android remote Add retest. No secrets, releases, deployment or host mutation.
# Its scope is limited to this workflow; normal release publishing stays manual.
on:
  pull_request:
    paths:
      - ".github/workflows/p0-remote-start-preview.yml"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RTorrentRemote.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/VerifiedAddScreen.kt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-p0-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  side-by-side-preview:
    # Keep this expensive extra build specific to the owner's pending
    # P0 server-handler comparison, not all future PRs touching RPC.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 996 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHUNKS_SIDE_BY_SIDE: "1"
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify approved vector app icon
        run: node tools/generate_launcher_vector.cjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Assemble distinct preview identity
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package, source and SHA-256 receipt
        run: |
          set -euo pipefail
          dir=app/build/outputs/apk/debug
          cp "$dir/app-debug.apk" "$dir/chunks-preview.apk"
          test -s "$dir/chunks-preview.apk"
          short="${CHUNKS_SOURCE_SHA:0:12}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$dir/chunks-preview.apk" |
            grep -F "package: name='io.github.gamesbyian.chunks.preview'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$dir/chunks-preview.apk" |
            grep -F "versionName='0.1.0-dev+$short'"
          (cd "$dir" && sha256sum chunks-preview.apk) > "$dir/CHUNKS-BUILD-SHA256.txt"
          printf '# built_commit=%s\n# workflow_run=%s\n' "$CHUNKS_SOURCE_SHA" "$GITHUB_RUN_ID" >> "$dir/CHUNKS-BUILD-SHA256.txt"
          (cd "$dir" && sha256sum -c CHUNKS-BUILD-SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-preview-side-by-side
          path: |
            app/build/outputs/apk/debug/chunks-preview.apk
            app/build/outputs/apk/debug/CHUNKS-BUILD-SHA256.txt
          retention-days: 7
