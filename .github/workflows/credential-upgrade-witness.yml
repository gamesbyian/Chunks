name: Chunks credential upgrade witness

# Seeds Keystore-sealed credentials with a BASE app APK, upgrades in place to
# the candidate APK (same debug key, higher versionCode) and verifies every
# record still opens. Runs when credential storage changes; dispatch with an
# older base_ref (for example a previous release) for release qualification.
on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/io/github/gamesbyian/chunks/KeystoreSealedBlob.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/RememberedRemoteLogin.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/RememberedRemoteProfileRoster.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/RememberedRemoteProtocolProfiles.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/media/MediaSettingsStore.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/CredentialUpgradeWitnessInstrumentedTest.kt"
      - "tools/credential_upgrade_witness.sh"
      - ".github/workflows/credential-upgrade-witness.yml"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Commit or tag whose app APK seeds the records (the 'previous release')"
        required: true

permissions:
  contents: read

concurrency:
  group: chunks-credential-upgrade-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  credential-upgrade:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build base app APK (versionCode 1) from the exact base commit
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base_sha="$(git rev-parse FETCH_HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base_sha"
          (cd "$RUNNER_TEMP/base" && CHUNKS_VERSION_CODE=1 CHUNKS_SOURCE_SHA="$base_sha" \
            gradle --no-daemon --no-configuration-cache :app:assembleDebug)
          mkdir -p "$RUNNER_TEMP/apks"
          cp "$RUNNER_TEMP/base/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/apks/chunks-base.apk"
          echo "Base: $base_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Build candidate app and test APKs (versionCode 2)
        run: |
          CHUNKS_VERSION_CODE=2 CHUNKS_SOURCE_SHA="$GITHUB_SHA" \
            gradle --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apks/chunks-candidate.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/apks/chunks-candidate-test.apk"
          (cd "$RUNNER_TEMP/apks" && sha256sum chunks-*.apk | tee SHA256SUMS)
          echo "Candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Free unrelated runner toolchains before emulator startup
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Retry pinned API35 Google APIs system-image installation before emulator boot
        run: bash tools/install_android35_image_retry.sh
      - name: Seed with base, upgrade in place, verify with candidate on a real Keystore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/credential_upgrade_witness.sh "$RUNNER_TEMP/apks/chunks-base.apk" "$RUNNER_TEMP/apks/chunks-candidate.apk" "$RUNNER_TEMP/apks/chunks-candidate-test.apk" "$RUNNER_TEMP/witness"
      - name: Upload witness receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-credential-upgrade-witness
          path: |
            ${{ runner.temp }}/witness/
            ${{ runner.temp }}/apks/SHA256SUMS
          retention-days: 14
          if-no-files-found: warn
