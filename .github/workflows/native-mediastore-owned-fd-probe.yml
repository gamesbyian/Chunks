name: Experimental MediaStore owned-FD capability (non-shipping)

# Scope limited to the additive Android instrumented probe. It is deliberately
# not a general app build gate or a claim of supported SAF/native storage.
on:
  pull_request:
    paths:
      - "app/src/androidTest/java/io/github/gamesbyian/chunks/engine/OwnedMediaStoreDescriptorInstrumentedTest.kt"
      - ".github/workflows/native-mediastore-owned-fd-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-mediastore-owned-fd-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  media-store-fd:
    name: Real Android MediaStore FD / API${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile tools
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile Android test probe and app
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify scoped Downloads descriptor on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            # Android emulator runner invokes script using /bin/sh; no Bash pipefail.
            # Every authoritative adb command has an explicit checked result.
            expected_api="${{ matrix.api }}"
            observed_api="$(adb shell getprop ro.build.version.sdk)"
            observed_api="$(printf '%s' "$observed_api" | tr -d '\r\n')"
            test "$observed_api" = "$expected_api"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            log="$(mktemp)"
            trap 'rm -f "$log"' EXIT
            set +e
            adb shell am instrument -w -r \
              -e class io.github.gamesbyian.chunks.engine.OwnedMediaStoreDescriptorInstrumentedTest \
              io.github.gamesbyian.chunks.test/androidx.test.runner.AndroidJUnitRunner >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -eq 0
            grep -q '^OK (2 tests)' "$log"
            ! grep -qE '^INSTRUMENTATION_STATUS_CODE: -(1|2|3|4)' "$log"
            echo "CHUNKS_MEDIASTORE_OWNED_FD_PROBE=PASS api=$expected_api seekable-fsync-reopen-publish"
