name: Seedhost inventory disagreement (one-shot read-only)

# Isolated forensic branch only. This workflow is NOT merged into main.
# It invokes an existing read-only test; no newDirectory, remove, execute.*,
# torrent mutation, or authenticated path/secret output.
on:
  push:
    branches:
      - diagnostics/seedhost-inventory-readonly-20261114
    paths:
      - .github/workflows/seedhost-inventory-readonly-once.yml

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-readonly-inventory-once
  cancel-in-progress: false

jobs:
  compare:
    if: ${{ github.repository == 'gamesbyian/Chunks' && github.ref == 'refs/heads/diagnostics/seedhost-inventory-readonly-20261114' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Observe historical child and both parent inventories (strictly no writes)
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          CHUNKS_FOLDER_RECONCILE_ONLY: authorized
          CHUNKS_FOLDER_RECONCILE_RUN: "43587333772"
        run: |
          set -euo pipefail
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          private_log=$(mktemp)
          trap 'rm -f "$private_log"' EXIT
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostFolderCreateReconcileReadOnlyTest > "$private_log" 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostFolderCreateReconcileReadOnlyTest.xml')
          if not path.is_file():
              print('CHUNKS_CREATE_RECONCILE: readback-result-missing writes=zero')
              raise SystemExit(1)
          root = ET.parse(path).getroot()
          lines = (root.findtext('system-out') or '').splitlines()
          for line in lines:
              if line.startswith('CHUNKS_CREATE_RECONCILE: '):
                  print(line[:180])
          valid = (sys.argv[1] == '0' and int(root.get('tests','0')) == 1
                   and all(root.get(k) == '0' for k in ('failures','errors','skipped'))
                   and any('inventory=browser-' in line for line in lines)
                   and any('checkpoint=two-providers-observed' in line for line in lines))
          print('CHUNKS_CREATE_RECONCILE: live-inventory-proof=' + ('passed' if valid else 'failed') + ' writes=zero')
          raise SystemExit(0 if valid else 1)
          PY
