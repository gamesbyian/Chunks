name: Legacy public Ubuntu magnet diagnostic (no APK qualification)

# Historical public-swarm diagnostic only. APK qualification now uses
# installed-rtorrent-magnets.yml with actual MainActivity and peerless truth.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "I authorize two distinct magnet-only public-source Add/Stop/session Remove on the development Seedhost"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: chunks-android-seedhost-scope-mutation
  cancel-in-progress: false

jobs:
  real-installed-android-add:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CHUNKS_LIVE_RUTORRENT_URL: https://ianseeds.wood.seedhost.eu/rutorrent/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Reject malformed runner before allocating emulator
        run: bash -n tools/seedhost_android_real_transfer_add_once.sh
      - name: Assemble the exact candidate binary and instrumentation package
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Reclaim unrelated runner toolchains for the emulator
        run: |
          # API35 Google-APIs Pixel 6 userdata needs several GB beyond APKs.
          # Exact runner failure 41355079713: 7098MB available, 7373MB needed.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h "$RUNNER_TEMP"
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Real installed two-source magnet peer-byte acceptance
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/seedhost_android_real_transfer_add_once.sh
      - name: Upload sanitized source-specific live magnet acceptance receipt, even on red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-installed-real-magnet-evidence
          path: ${{ runner.temp }}/chunks-real-android-add/RECEIPT.json
          retention-days: 14
          if-no-files-found: warn
