name: Protected Seedhost Kotlin adapter acceptance

on:
  workflow_dispatch:
    inputs:
      apply_mutation:
        description: "Authorize three synthetic Adds: file priority/Start/Stop, stopped magnet, stopped ruTorrent upload; session-erase each at a corroborated server parent"
        type: boolean
        required: false
        default: false
      diagnose_add:
        description: "Read-only diagnostics; mutation comparison is disabled pending exact-identity cleanup and uncertain-Add review"
        type: boolean
        required: false
        default: false
      reconcile_hash:
        description: "Optional exact hash: read-only reconciliation; with apply_mutation, also session-erase a matching chunks-acceptance fixture"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: chunks-android-seedhost-scope-mutation
  cancel-in-progress: false

jobs:
  read-only-native-adapter:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse replay of a mutation dispatch
        if: ${{ inputs.apply_mutation && github.run_attempt != 1 }}
        run: |
          echo '::error::A rerun cannot repeat protected mutations; inspect the prior run and dispatch a new explicitly scoped operation if appropriate.'
          exit 1
      - name: Refuse unsafe diagnostic mutation mode
        if: ${{ inputs.apply_mutation && inputs.diagnose_add }}
        run: |
          echo '::error::Diagnostic Add variants use unguarded erase and cannot run against the protected host. Read-only diagnostics remain available.'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run actual Kotlin RPC adapter against development Seedhost
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          CHUNKS_LIVE_MUTATION: ${{ inputs.apply_mutation && 'apply' || 'read-only' }}
          CHUNKS_LIVE_RECONCILE_HASH: ${{ inputs.reconcile_hash }}
          CHUNKS_LIVE_DIAGNOSE_ADD: ${{ inputs.diagnose_add }}
        run: |
          test -n "$CHUNKS_LIVE_RUTORRENT_URL"
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostAdapterSmokeTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostAddDiagnosticsTest
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          base = pathlib.Path("app/build/test-results/testDebugUnitTest")
          ok = int(sys.argv[1]) == 0
          for name in ("SeedhostAdapterSmokeTest", "SeedhostLiveAcceptanceTest", "SeedhostAddDiagnosticsTest"):
              path = base / f"TEST-io.github.gamesbyian.chunks.rpc.{name}.xml"
              if not path.exists():
                  print(f"CHUNKS_LIVE: {name} produced no results"); ok = False; continue
              root = ET.parse(path).getroot()
              print(f"CHUNKS_LIVE: {name} tests={root.get('tests')} failures={root.get('failures')} errors={root.get('errors')} skipped={root.get('skipped')}")
              for line in (root.findtext("system-out") or "").splitlines():
                  if line.startswith("CHUNKS_LIVE:") or line.startswith("CHUNKS_KOTLIN_SEEDHOST"):
                      print(line[:420])
              for case in root.iter("testcase"):
                  failure = case.find("failure") if case.find("failure") is not None else case.find("error")
                  if failure is not None:
                      print("CHUNKS_LIVE_FAILURE: " + case.get("name") + " " + (failure.get("message") or "")[:400])
                      ok = False
          smoke = ET.parse(base / "TEST-io.github.gamesbyian.chunks.rpc.SeedhostAdapterSmokeTest.xml").getroot()
          ok = ok and smoke.get("skipped") == "0"
          sys.exit(0 if ok else 1)
          PY
