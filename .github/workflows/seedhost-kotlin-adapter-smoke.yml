name: Protected Seedhost Kotlin adapter acceptance

on:
  workflow_dispatch:
    inputs:
      rutorrent_url:
        description: "Credential-free ruTorrent HTTPS URL for development Seedhost"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-kotlin-readonly
  cancel-in-progress: false

jobs:
  read-only-native-adapter:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run actual Kotlin RPC adapter against development Seedhost, READ ONLY
        env:
          CHUNKS_LIVE_RUTORRENT_URL: ${{ inputs.rutorrent_url }}
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
        run: |
          test -n "$CHUNKS_LIVE_RUTORRENT_URL"
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          gradle --no-daemon :app:testDebugUnitTest --tests io.github.gamesbyian.chunks.rpc.SeedhostAdapterSmokeTest --info 2>&1 |             sed -E 's/(CHUNKS_LIVE_RTORRENT_(USER|PASS)|CHUNKS_LIVE_RUTORRENT_URL)=([^ ]+)/\1=[REDACTED]/g'
