name: Seedhost read-only RPC probe
on:
  workflow_dispatch:
    inputs:
      rutorrent_url:
        description: 'Credential-free Seedhost ruTorrent HTTPS URL'
        required: false
        default: "https://ianseeds.wood.seedhost.eu/rutorrent/"
        type: string
      inspect_inventory:
        description: 'Read only: also capture nonsecret torrent metadata as a test fixture'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: chunks-seedhost-readonly
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Safely test HTTP-RPC version only
        env:
          RUTORRENT_URL: ${{ inputs.rutorrent_url }}
          RT_USER: ${{ secrets.rtorrent_user }}
          RT_PASS: ${{ secrets.rtorrent_pass }}
          INSPECT_INVENTORY: ${{ inputs.inspect_inventory }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, urllib.error, xml.etree.ElementTree as ET
          url = os.getenv("RUTORRENT_URL")
          user = os.getenv("RT_USER")
          password = os.getenv("RT_PASS")
          if not url or not user or not password:
              raise SystemExit("Missing Seedhost URL and/or rTorrent credential secrets in Chunks repository.")
          parsed = urllib.parse.urlsplit(url)
          if (parsed.scheme != "https" or not parsed.hostname or
                  not parsed.hostname.endswith(".seedhost.eu") or parsed.username or
                  parsed.password or parsed.query or parsed.fragment):
              raise SystemExit("Only credential-free Seedhost HTTPS addresses are allowed.")
          path = parsed.path.rstrip("/")
          if path.lower().endswith("/rutorrent"):
              path += "/plugins/httprpc/action.php"
          if not (path.endswith("/plugins/httprpc/action.php") or path.endswith("/RPC1") or path.endswith("/RPC2")):
              raise SystemExit("Unrecognized RPC endpoint. No request sent.")
          endpoint = urllib.parse.urlunsplit(("https", parsed.netloc, path, "", ""))
          request_body = b'<?xml version="1.0"?><methodCall><methodName>system.client_version</methodName><params/></methodCall>'
          request = urllib.request.Request(endpoint, data=request_body, headers={
              "Content-Type": "text/xml"
          }, method="POST")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          # Let the HTTPS gateway announce Basic or Digest; only then supply
          # credentials, limited to this exact endpoint. Never follow redirects.
          manager = urllib.request.HTTPPasswordMgrWithDefaultRealm()
          manager.add_password(None, endpoint, user, password)
          opener = urllib.request.build_opener(
              NoRedirect(),
              urllib.request.HTTPDigestAuthHandler(manager),
              urllib.request.HTTPBasicAuthHandler(manager)
          )
          try:
              with opener.open(request, timeout=12) as response:
                  result = response.read(131073)
                  if len(result) > 131072 or b"<!DOCTYPE" in result.upper() or b"<!ENTITY" in result.upper():
                      raise ValueError("Unsafe or excessive XML response")
                  doc = ET.fromstring(result)
                  if doc.tag != "methodResponse" or doc.find("fault") is not None:
                      raise ValueError("Unexpected XML-RPC response")
                  if doc.find("./params/param/value") is None:
                      raise ValueError("Missing RPC result")
                  print("CHUNKS_SEEDHOST_RPC: authenticated read-only response verified")
                  if os.getenv("INSPECT_INVENTORY", "false").lower() == "true":
                      methods = ["d.multicall2", "system.listMethods"]
                      # Fetch actual named-view transfer rows only; preserve fixture
                      # metadata but never persist raw announce URLs/passkeys.
                      query = ["", "main", "d.hash=", "d.name=", "d.size_bytes=",
                               "d.completed_bytes=", "d.state=", "d.directory="]
                      import json
                      from xml.sax.saxutils import escape
                      def arg(v):
                          return "<param><value><string>" + escape(v) + "</string></value></param>"
                      payload = ('<?xml version="1.0"?><methodCall><methodName>d.multicall2</methodName><params>' +
                                 ''.join(map(arg, query)) + '</params></methodCall>').encode()
                      second = urllib.request.Request(endpoint, data=payload,
                          headers={"Content-Type": "text/xml"}, method="POST")
                      with opener.open(second, timeout=20) as listing:
                          xml_data = listing.read(4194305)
                      if len(xml_data) > 4194304 or b"<!DOCTYPE" in xml_data.upper() or b"<!ENTITY" in xml_data.upper():
                          raise ValueError("Unsafe or excessive list response")
                      parsed_list = ET.fromstring(xml_data)
                      if parsed_list.tag != "methodResponse" or parsed_list.find("fault") is not None:
                          raise ValueError("Torrent list RPC method unavailable")
                      def unpack(value):
                          child = next(iter(value), None)
                          if child is None: return value.text or ""
                          if child.tag == "array":
                              return [unpack(x) for x in child.findall("./data/value")]
                          if child.tag in ("int","i4","i8"): return int(child.text or 0)
                          return child.text or ""
                      value = parsed_list.find("./params/param/value")
                      if value is None: raise ValueError("Missing torrent list")
                      rows = unpack(value)
                      if not isinstance(rows, list) or len(rows) > 12000: raise ValueError("Invalid torrent list")
                      fixture = {"source":"owner-approved-seedhost-dev","view":"main",
                                 "completeness":"view-scoped-unverified","fields":query[2:],
                                 "transfers":rows}
                      import pathlib
                      out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "chunks-seedbox-fixture.json"
                      out.write_text(json.dumps(fixture, indent=2), encoding="utf-8")
                      print("CHUNKS_SEEDHOST_RPC: read-only inventory fixture saved; count=" + str(len(rows)))
          except urllib.error.HTTPError as error:
              if error.code == 401:
                  challenge = (error.headers.get("WWW-Authenticate") or "").lower()
                  scheme = "Digest" if challenge.startswith("digest ") else (
                      "Basic" if challenge.startswith("basic ") else "unknown")
                  # Report only challenge *scheme*, not realm, nonce or endpoint.
                  print("CHUNKS_SEEDHOST_RPC: HTTP 401 after auth negotiation; scheme=" + scheme)
              else:
                  print("CHUNKS_SEEDHOST_RPC: HTTP status " + str(error.code))
              raise SystemExit(1)
          except Exception as error:
              print("CHUNKS_SEEDHOST_RPC: failed (" + type(error).__name__ + ")")
              raise SystemExit(1)
          PY
      - uses: actions/checkout@v4
        if: ${{ inputs.inspect_inventory && success() }}
      - name: Build QA coverage catalogue from captured actual rTorrent transfers
        if: ${{ inputs.inspect_inventory && success() }}
        run: |
          python3 tools/seedbox_fixture_qa.py             "$RUNNER_TEMP/chunks-seedbox-fixture.json"             --output-dir "$RUNNER_TEMP/chunks-seedbox-qa"
      - name: Upload owner-approved real-server fixture
        if: ${{ inputs.inspect_inventory && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: chunks-seedbox-readonly-fixture
          path: |
            ${{ runner.temp }}/chunks-seedbox-fixture.json
            ${{ runner.temp }}/chunks-seedbox-qa/qa-cases.json
            ${{ runner.temp }}/chunks-seedbox-qa/qa-cases.md
          retention-days: 14
          if-no-files-found: error
