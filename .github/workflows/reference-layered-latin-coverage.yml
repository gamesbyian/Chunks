name: Audit Chunks layered Latin CFF design completeness
on:
  push:
    # Validate changes to feature branches via pull_request; build merged changes on main only.
    branches: [main]
    paths:
      - 'tools/audit_reference_layered_latin_coverage.py'
      - 'tests/test_reference_layered_latin_coverage.py'
      - 'assets/fonts/experimental/mixed-mark-studies/**'
      - '.github/workflows/reference-layered-latin-coverage.yml'
      - 'docs/design/CHUNKS-REFERENCE-LAYERED-LATIN.md'
  pull_request:
    paths:
      - 'tools/audit_reference_layered_latin_coverage.py'
      - 'tests/test_reference_layered_latin_coverage.py'
      - 'assets/fonts/experimental/mixed-mark-studies/**'
      - '.github/workflows/reference-layered-latin-coverage.yml'
      - 'docs/design/CHUNKS-REFERENCE-LAYERED-LATIN.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chunks-layered-latin-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  audit-495-latin-characters:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned fontTools and shaping dependencies
        run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Reconcile all 495 Latin glyphs against real native CFFs
        run: |
          python tools/audit_reference_layered_latin_coverage.py --out assets/fonts/experimental/mixed-mark-studies/reference-layered-latin-coverage.json
          python -m unittest discover -s tests -p test_reference_layered_latin_coverage.py -v
      - name: Upload exhaustive actual-font Unicode and source-art audit
        uses: actions/upload-artifact@v4
        with:
          name: chunks-reference-layered-latin-coverage
          path: assets/fonts/experimental/mixed-mark-studies/reference-layered-latin-coverage.json
          retention-days: 30
      - name: Commit reproducible coverage ledger only to source branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/experimental/mixed-mark-studies/reference-layered-latin-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(font): retain exact layered Latin source-art coverage'
            branch="${GITHUB_REF#refs/heads/}"
            for attempt in 1 2 3; do
              git fetch origin "$branch"
              git rebase "origin/$branch"
              if git push origin "HEAD:$branch"; then exit 0; fi
            done
            echo 'Could not store reproducible layered Latin audit' >&2
            exit 1
          fi
