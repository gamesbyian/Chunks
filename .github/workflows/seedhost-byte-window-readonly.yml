name: Protected Seedhost read-only byte-window witness

# Trusted-main only. PRs never receive credentials. Source changes to this
# workflow explicitly schedule ONE read-only witness on the approved dev host.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seedhost-byte-window-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-protected-readonly-byte-window
  cancel-in-progress: false

jobs:
  read-only-byte-window:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
      CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
      CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
      CHUNKS_LIVE_MUTATION: "readonly"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Read exactly three bounded samples, never mutate
        run: |
          set -euo pipefail
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          status=0
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.readOnlyCurrentHostTrafficWindow' || status=$?
          # Sanitized whitelist only. Never print raw JUnit exception, tracker,
          # URL, path, infohash, XML fault or source server credentials.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostLiveAcceptanceTest.xml')
          if not p.exists():
              print('CHUNKS_TRAFFIC_READONLY: no test report')
              raise SystemExit(1)
          root = ET.parse(p).getroot()
          for line in (root.findtext('system-out') or '').splitlines():
              if line.startswith('CHUNKS_LIVE: traffic '):
                  print(line[:280])
          print('CHUNKS_TRAFFIC_READONLY: tests=' + root.attrib.get('tests', '?') +
                ' errors=' + root.attrib.get('errors', '?') +
                ' failures=' + root.attrib.get('failures', '?') +
                ' skipped=' + root.attrib.get('skipped', '?'))
          assert int(root.attrib.get('tests', 0)) == 1
          assert int(root.attrib.get('failures', 0)) == 0
          assert int(root.attrib.get('errors', 0)) == 0
          assert int(root.attrib.get('skipped', 0)) == 0
          PY
          test "$status" -eq 0
