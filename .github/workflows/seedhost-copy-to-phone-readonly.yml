name: Seedhost copy-to-phone read-only probe

# Owner-approved development inventory (docs/SEEDHOST-REMOTE-TESTING.md).
# Reads the inventory and lets the phone engine (JVM build) copy the smallest
# complete, active, non-private transfer with the server as its only named
# peer. Sends NO mutation to the server (it only uploads); the copy is
# discarded with the runner. Dispatch-only and main-only.
on:
  workflow_dispatch:
    inputs:
      max_mib:
        description: "Largest transfer to copy, MiB (1-1024)"
        type: number
        default: 64
        required: true
      seconds:
        description: "Time limit for the copy (30-1800)"
        type: number
        default: 300
        required: true

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-copy-probe
  cancel-in-progress: false

jobs:
  copy-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Copy one small public transfer from Seedhost with the phone engine
        env:
          CHUNKS_COPY_PROBE: authorized
          CHUNKS_LIVE_RUTORRENT_URL: https://ianseeds.wood.seedhost.eu/rutorrent/
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          MAX_MIB: ${{ inputs.max_mib }}
          SECONDS_LIMIT: ${{ inputs.seconds }}
        run: |
          [[ "$MAX_MIB" =~ ^[0-9]{1,4}$ ]] && [ "$MAX_MIB" -ge 1 ] && [ "$MAX_MIB" -le 1024 ] || { echo "::error::Invalid size cap"; exit 1; }
          [[ "$SECONDS_LIMIT" =~ ^[0-9]{2,4}$ ]] && [ "$SECONDS_LIMIT" -ge 30 ] && [ "$SECONDS_LIMIT" -le 1800 ] || { echo "::error::Invalid time limit"; exit 1; }
          export CHUNKS_COPY_PROBE_MAX_BYTES=$(( MAX_MIB * 1048576 ))
          export CHUNKS_COPY_PROBE_SECONDS="$SECONDS_LIMIT"
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.interop.SeedhostServerToPhoneCopyProbeTest >/dev/null 2>&1
          status=$?
          set -e
          report=app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.interop.SeedhostServerToPhoneCopyProbeTest.xml
          # Only the fixed marker line leaves the runner: never raw logs or stack traces.
          grep -o 'CHUNKS_SEEDHOST_COPY: [^<]*' "$report" | head -1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -q 'CHUNKS_SEEDHOST_COPY: VERIFIED' "$report" || { echo "::error::Copy probe did not verify (see marker)"; exit 1; }
          exit $status
