name: Protected Seedhost Android read-only journey

# The one-time trusted-main workflow-self push uses the previously approved
# development URL and protected secrets; all writes remain absent. Later runs
# still require explicit workflow dispatch unless this file changes again.
# Another read-only retry following LazyColumn Connect scroll fix; no writes.
# 2026-10-27: verify live Add destination/default preview and return navigation, no Add/Start/Stop.
# Diagnostic rerun: classify failed Connect using only fixed nonsecret UI labels.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seedhost-android-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-android-manual
  cancel-in-progress: false

jobs:
  actual-android-ui:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Check protected access prerequisites
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
        run: |
          test -n "$CHUNKS_LIVE_RUTORRENT_URL"
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS"
          case "$CHUNKS_LIVE_RUTORRENT_URL" in https://*) ;; *) exit 1;; esac
      - name: Install Android API 37 compile SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build unsigned installed app and instrumentation APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Permit emulator KVM access
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Installed Android app reads real protected Seedhost over HTTPS
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/seedhost_android_readonly.sh
      - name: Keep connected-screen PNGs only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-seedhost-android-readonly
          path: ${{ runner.temp }}/chunks-seedhost-android/*.png
          retention-days: 7
          if-no-files-found: error
