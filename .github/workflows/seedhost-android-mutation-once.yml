name: One-time installed Android Seedhost scoped adapter mutation
# Owner-authorized development-host-only, one unique tracker-bearing synthetic
# torrent, protected secret inputs and one exact-hash session cleanup.
# A new workflow merge with the explicit one-time acceptance marker triggers
# precisely one trusted-main run; never runs on untrusted pull requests.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seedhost-android-mutation-once.yml"
  workflow_dispatch:
    inputs:
      apply_mutation:
        description: "Permit one synthetic exact-hash Add/Start/Stop/session Erase on development Seedhost"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: chunks-android-seedhost-scope-mutation
  cancel-in-progress: false
jobs:
  emulator-exact-synthetic:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.apply_mutation) ||
          (github.event_name == 'push' &&
           contains(github.event.head_commit.message, 'one-time Android Seedhost adapter acceptance'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
      CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
      CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Compile with Android API37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Permit hardware accelerated emulator
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Exact synthetic Android-to-host mutation with guarded cleanup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/seedhost_android_mutation_once.sh
