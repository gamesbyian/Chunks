name: Disposable rTorrent protocol proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/disposable-rtorrent-probe.yml"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableMutationTest.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableAuthenticatedTest.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableDigestAuthenticatedTest.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableFullJourneyTest.kt"
      - "tools/verify_disposable_rutorrent_readd_cancel.py"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableNativeStartedAddTest.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableServerTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RTorrentRemote.kt"
      # Cross-implementation peer-wire proof (rTorrent <-> phone libtorrent4j engine).
      - "app/src/test/java/io/github/gamesbyian/chunks/interop/**"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableBatchLifecycleTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/model/RemoteBatchLifecycle.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableBatchCopyTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/model/BatchServerCopy.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableFinishInOrderTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/rpc/RemoteFinishInOrderPort.kt"
      - "app/src/test/java/io/github/gamesbyian/chunks/rpc/RTorrentDisposableBatchMoveTest.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/model/BatchMoveRemoval.kt"
      - "app/src/main/java/io/github/gamesbyian/chunks/engine/LocalTorrentEngine.kt"
permissions:
  contents: read
# GitHub concurrency allows only one running and one pending run per group.
# A global group silently cancels older pending PRs when a third arrives,
# leaving those source heads without their real-engine acceptance gate.
# Keep one current attempt per PR; distinct PRs must not evict one another.
concurrency:
  group: chunks-disposable-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  legacy-real-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Start disposable rTorrent and localhost SCGI proxy
        run: |
          sudo timeout 180s apt-get update -qq
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rtorrent nginx
          mkdir -p "$RUNNER_TEMP/chunks-home" "$RUNNER_TEMP/chunks-data" "$RUNNER_TEMP/chunks-session"
          cat > "$RUNNER_TEMP/chunks-home/.rtorrent.rc" <<EOF
          directory.default.set = $RUNNER_TEMP/chunks-data
          session.path.set = $RUNNER_TEMP/chunks-session
          network.scgi.open_port = 127.0.0.1:5000
          # Fixed peer port for the interop test; no PEX/UDP trackers, so
          # peers are found only through the test's own loopback tracker.
          network.port_range.set = 6890-6890
          network.port_random.set = no
          protocol.pex.set = no
          trackers.use_udp.set = no
          system.daemon.set = true
          EOF
          cat > "$RUNNER_TEMP/chunks-nginx.conf" <<EOF
          worker_processes 1;
          pid $RUNNER_TEMP/chunks-nginx.pid;
          error_log $RUNNER_TEMP/chunks-nginx.error notice;
          events { worker_connections 64; }
          http {
            server {
              listen 127.0.0.1:18080;
              location /RPC2 {
                include /etc/nginx/scgi_params;
                scgi_pass 127.0.0.1:5000;
              }
              location = /AUTHRPC {
                auth_basic "Chunks disposable rTorrent identity";
                auth_basic_user_file /etc/nginx/chunks-disposable-auth.htpasswd;
                include /etc/nginx/scgi_params;
                scgi_pass 127.0.0.1:5000;
              }
            }
          }
          EOF
          # -n avoids depending on the runner's account home, while explicit
          # import loads only this throwaway configuration. Run asynchronously
          # so a foreground build cannot pin the workflow step.
          nohup rtorrent -n -o "import=$RUNNER_TEMP/chunks-home/.rtorrent.rc" \
            > "$RUNNER_TEMP/chunks-rtorrent.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/chunks-rtorrent.pid"
          # Per-run synthetic Basic credentials; no user password or host
          # secrets. The second exact location is protected while /RPC2 stays
          # unchanged for existing disposable protocol and peer-wire tests.
          auth_user="chunks-disposable"
          auth_pass="$(openssl rand -hex 18)"
          printf 'CHUNKS_DISPOSABLE_AUTH_USER=%s\nCHUNKS_DISPOSABLE_AUTH_PASS=%s\n' \
            "$auth_user" "$auth_pass" >> "$GITHUB_ENV"
          printf '%s:%s\n' "$auth_user" "$(openssl passwd -apr1 "$auth_pass")" \
            | sudo tee /etc/nginx/chunks-disposable-auth.htpasswd > /dev/null
          sudo chmod 0644 /etc/nginx/chunks-disposable-auth.htpasswd
          sudo nginx -c "$RUNNER_TEMP/chunks-nginx.conf"
      - name: Assert read-only XML-RPC readiness
        run: |
          cat > "$RUNNER_TEMP/version.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <methodCall><methodName>system.client_version</methodName><params></params></methodCall>
          EOF
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 -H "Content-Type: text/xml" \
                 --data-binary @"$RUNNER_TEMP/version.xml" \
                 http://127.0.0.1:18080/RPC2 -o "$RUNNER_TEMP/response.xml" &&
               grep -q '<methodResponse>' "$RUNNER_TEMP/response.xml"; then
              echo "Ephemeral rTorrent XML-RPC ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Ephemeral rTorrent/SCGI endpoint unavailable"
          exit 1
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test read-only protocol and actual stopped Add/start/stop on throwaway rTorrent
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          # Read-only acceptance asserts a fresh empty server: run it FIRST.
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableServerTest'
          # Only after the empty-server proof, use the same ephemeral process
          # for deliberate Add/duplicate/start/stop mutation acceptance.
          if ! gradle --no-daemon :app:testDebugUnitTest \
              --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableMutationTest' \
              --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableFullJourneyTest'; then
            # Extract bounded nonsecret failed assertions from the disposable rig.
            python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          path=pathlib.Path("app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableMutationTest.xml")
          if path.exists():
              root=ET.parse(path).getroot()
              for case in root.findall(".//testcase"):
                  failure=case.find("failure")
                  if failure is not None:
                      name=case.attrib.get("name","unknown")
                      message=failure.attrib.get("message","unknown")
                      print("CHUNKS_DISPOSABLE_FAILURE: "+name+" "+message[:500])
          PY
            exit 1
          fi
      - name: Authenticated one-shot Add, Start/Stop, priority and exact session Remove
        env:
          CHUNKS_DISPOSABLE_AUTH_URL: http://127.0.0.1:18080/AUTHRPC
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableAuthenticatedTest'
          report=app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableAuthenticatedTest.xml
          grep -q 'tests="2" skipped="0" failures="0" errors="0"' "$report"
          echo "CHUNKS_AUTH_REAL: disposable nginx Basic challenge accepted on real rTorrent, exact-job mutation/reconciliation and rejected wrong credentials" >> "$GITHUB_STEP_SUMMARY"
      - name: SHA-256 Digest real engine authenticated Add and session-only Remove
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          # Unlike an XML-RPC fixture, the challenge is independently SHA-256
          # verified and ONLY approved calls reach disposable real rTorrent.
          # Both a wrong password and wrong username must be rejected.
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableDigestAuthenticatedTest'
          report=app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableDigestAuthenticatedTest.xml
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' "$report"
          echo "CHUNKS_DIGEST_REAL: independent SHA-256 challenge and one exact real rTorrent Add/Remove passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Real ruTorrent PHP erasedata collector deletes exact payload and preserves canary
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
          CHUNKS_RUTORRENT_PHP_ROOT: ${{ runner.temp }}/chunks-rutorrent-web/rutorrent1
          CHUNKS_RUTORRENT_PHP_URL: http://127.0.0.1:18082/rutorrent1/plugins/erasedata/action.php
          CHUNKS_DISPOSABLE_RUTORRENT_URL: http://127.0.0.1:18082/rutorrent1/plugins/httprpc/action.php
          CHUNKS_DISPOSABLE_PHP_TORRENT: ${{ runner.temp }}/chunks-erasedata-adapter-positive.torrent
          RU_PROFILE_PATH: ${{ runner.temp }}/chunks-rutorrent-profiles
          RU_SCGI_HOST: 127.0.0.1
          RU_SCGI_PORT: "5000"
        run: |
          set -euo pipefail
          sudo timeout 120s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-xml php-mbstring php-curl
          mkdir -p "$RUNNER_TEMP/chunks-rutorrent-web" "$RU_PROFILE_PATH"
          # Immutable upstream tree, never an unpinned master or an authorized host.
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 \
            https://github.com/Novik/ruTorrent/archive/bf9cd74b173940f2a7284e6acb45c4266f96f08b.tar.gz \
            -o "$RUNNER_TEMP/chunks-rutorrent.tar.gz"
          tar -xzf "$RUNNER_TEMP/chunks-rutorrent.tar.gz" -C "$RUNNER_TEMP/chunks-rutorrent-web"
          mv "$RUNNER_TEMP/chunks-rutorrent-web/ruTorrent-bf9cd74b173940f2a7284e6acb45c4266f96f08b" "$CHUNKS_RUTORRENT_PHP_ROOT"
          nohup php -S 127.0.0.1:18082 -t "$RUNNER_TEMP/chunks-rutorrent-web" \
            > "$RUNNER_TEMP/chunks-rutorrent-php.log" 2>&1 </dev/null &
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18082/rutorrent1/plugins/erasedata/plugin.info -o /dev/null; then break; fi
            sleep 1
          done
          python3 tools/verify_disposable_rutorrent_php_delete.py
          python3 tools/stage_disposable_rutorrent_adapter_delete.py stage
          if ! gradle --no-daemon :app:testDebugUnitTest --tests io.github.gamesbyian.chunks.rpc.RTorrentDisposableRealPhpErasedataTest; then
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path("app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableRealPhpErasedataTest.xml")
          if p.exists():
              for test in ET.parse(p).getroot().iter("testcase"):
                  for failure in test.findall("failure"):
                      print("CHUNKS_PHP_ADAPTER_FAILURE", test.get("name"), failure.get("message"), (failure.text or "")[:1000])
          PY
            exit 1
          fi
          python3 tools/stage_disposable_rutorrent_adapter_delete.py verify
          python3 tools/verify_disposable_rutorrent_readd_cancel.py
          echo "CHUNKS_ERASEDATA: real rTorrent exact-session removal + pinned upstream PHP plugin and collector + independent exact-file absence; foreign canary unchanged" >> "$GITHUB_STEP_SUMMARY"
      - name: Native start-on-load file and magnet acceptance on real rTorrent
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableNativeStartedAddTest'
          report=app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableNativeStartedAddTest.xml
          grep -q 'tests="2" skipped="0" failures="0" errors="0"' "$report"
          echo "CHUNKS_NATIVE_STARTED_ADD: both sources active on disposable real rTorrent" >> "$GITHUB_STEP_SUMMARY"
      - name: Reviewed batch Start/Stop on real rTorrent
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableBatchLifecycleTest'
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableBatchLifecycleTest.xml
      - name: Batch Copy Transfer to server on real rTorrent
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableBatchCopyTest'
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableBatchCopyTest.xml
      - name: Finish in Order on real rTorrent
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableFinishInOrderTest'
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableFinishInOrderTest.xml
      - name: Batch Move server-job removal on real rTorrent
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableBatchMoveTest'
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableBatchMoveTest.xml
      - name: Cross-implementation payload exchange (rTorrent <-> phone engine)
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_RT_PEER_PORT: "6890"
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.interop.RTorrentLibtorrentInteropTest'
          # The test skips itself outside the rig: a green step must mean both ran.
          report=app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.interop.RTorrentLibtorrentInteropTest.xml
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$report" | head -1
          grep -q 'tests="5" skipped="0" failures="0" errors="0"' "$report"
          echo "CHUNKS_INTEROP: real rTorrent <-> phone exact-byte transfers AND rTorrent magnet metadata + verified peer bytes passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticated real rTorrent receives independently verified peer bytes
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/AUTHRPC
          CHUNKS_DISPOSABLE_RT_PEER_PORT: "6890"
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          # This is the same real BitTorrent wire path as the unprotected
          # interop acceptance, but EVERY rTorrent command now passes through
          # nginx's per-run Basic-protected exact /AUTHRPC mount. It reads a
          # real authenticated inventory before Add/Start and demands
          # independently verified positive downloaded + piece bytes, SHA1
          # hash-checked complete payload and byte-for-byte source equality.
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.interop.RTorrentLibtorrentInteropTest.realRTorrentDownloadsExactPayloadSeededByPhoneEngine'
          report=app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.interop.RTorrentLibtorrentInteropTest.xml
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' "$report"
          echo "CHUNKS_AUTH_PEER_BYTES: exact challenged principal acquired independently hash-verified pieces and matched original payload bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Evidence summary
        if: always()
        run: |
          echo "### Disposable real-engine stopped Add + lifecycle test" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Real stopped Add/start/stop targets ephemeral local rTorrent only; no secrets, user media or remote machines supplied." >> "$GITHUB_STEP_SUMMARY"
  modern-real-engine:
    # Accepted modern 0.16.x tinyxml2 build, compared with legacy 0.9.8.
    # Alpine 0.15.2 resets SCGI connections (issue #151); it is NOT accepted
    # and must be fixed and retested before adding it to this green matrix.
    # Distro package in a throwaway container; SCGI on runner loopback only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arch-latest
            image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Start containerised rTorrent and localhost SCGI proxy
        run: |
          sudo timeout 180s apt-get update -qq
          sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx
          mkdir -p "$RUNNER_TEMP/chunks-data" "$RUNNER_TEMP/chunks-rc"
          chmod 777 "$RUNNER_TEMP/chunks-data"
          cat > "$RUNNER_TEMP/chunks-rc/rtorrent.rc" <<EOF
          directory.default.set = $RUNNER_TEMP/chunks-data
          session.path.set = /session
          network.scgi.open_port = 0.0.0.0:5000
          # Keep the process attached to the container rather than daemonising.
          # Keep modern rTorrent attached to its test container. The Alpine
          # SCGI failure is separately tracked in issue #151.
          system.daemon.set = false
          EOF
          # One historical official repository snapshot for both rTorrent and
          # rakshasa libtorrent. The moving Arch mirror served rtorrent 0.16.26
          # without libtorrent=0.16.26 twice (runs 42811077338, attempts 1/2).
          # Never mix this repository snapshot with the image's ordinary mirrors.
          # This is *only* the disposable modern-engine acceptance fixture.
          cat > "$RUNNER_TEMP/chunks-rc/start-rtorrent.sh" <<'EOF'
          #!/bin/sh
          set -eu
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/10/24/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm rtorrent
          mkdir -p /session
          echo "CHUNKS_ARCH_SNAPSHOT=2026-10-24"
          rtorrent -h 2>&1 | head -n 1
          exec rtorrent -n -o import=/chunks-rc/rtorrent.rc
          EOF
          docker run -dit --name chunks-rtorrent -p 127.0.0.1:5000:5000 \
            -v "$RUNNER_TEMP/chunks-data:$RUNNER_TEMP/chunks-data" \
            -v "$RUNNER_TEMP/chunks-rc:/chunks-rc:ro" \
            "${{ matrix.image }}" sh /chunks-rc/start-rtorrent.sh
          cat > "$RUNNER_TEMP/chunks-nginx.conf" <<EOF
          worker_processes 1;
          pid $RUNNER_TEMP/chunks-nginx.pid;
          error_log $RUNNER_TEMP/chunks-nginx.error notice;
          events { worker_connections 64; }
          http {
            server {
              listen 127.0.0.1:18080;
              location /RPC2 {
                include /etc/nginx/scgi_params;
                scgi_pass 127.0.0.1:5000;
              }
              location = /AUTHRPC {
                auth_basic "Chunks disposable rTorrent identity";
                auth_basic_user_file /etc/nginx/chunks-disposable-auth.htpasswd;
                include /etc/nginx/scgi_params;
                scgi_pass 127.0.0.1:5000;
              }
            }
          }
          EOF
          # Per-run synthetic Basic credentials; no user password or host
          # secrets. The second exact location is protected while /RPC2 stays
          # unchanged for existing disposable protocol and peer-wire tests.
          auth_user="chunks-disposable"
          auth_pass="$(openssl rand -hex 18)"
          printf 'CHUNKS_DISPOSABLE_AUTH_USER=%s\nCHUNKS_DISPOSABLE_AUTH_PASS=%s\n' \
            "$auth_user" "$auth_pass" >> "$GITHUB_ENV"
          printf '%s:%s\n' "$auth_user" "$(openssl passwd -apr1 "$auth_pass")" \
            | sudo tee /etc/nginx/chunks-disposable-auth.htpasswd > /dev/null
          sudo chmod 0644 /etc/nginx/chunks-disposable-auth.htpasswd
          sudo nginx -c "$RUNNER_TEMP/chunks-nginx.conf"
      - name: Assert XML-RPC readiness and record the version
        run: |
          cat > "$RUNNER_TEMP/version.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <methodCall><methodName>system.client_version</methodName><params></params></methodCall>
          EOF
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 3 -H "Content-Type: text/xml" \
                 --data-binary @"$RUNNER_TEMP/version.xml" \
                 http://127.0.0.1:18080/RPC2 -o "$RUNNER_TEMP/response.xml" &&
               grep -q '<methodResponse>' "$RUNNER_TEMP/response.xml"; then
              echo "CHUNKS_MODERN_RTORRENT ${{ matrix.label }} version: $(grep -o '<string>[^<]*</string>' "$RUNNER_TEMP/response.xml" | head -n 1)"
              exit 0
            fi
            # An unsatisfied signed package dependency is terminal. A downed
            # fixture should fail explicitly, not hammer nginx with 120 HTTP 502s.
            if [ "$(docker inspect -f '{{.State.Running}}' chunks-rtorrent)" != true ]; then
              echo "::error::Modern rTorrent fixture exited before read-only XML-RPC readiness"
              docker logs chunks-rtorrent 2>&1 | tail -n 60
              exit 1
            fi
            sleep 2
          done
          docker logs chunks-rtorrent | tail -n 40
          echo "::error::Containerised rTorrent/SCGI endpoint unavailable"
          exit 1
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Confirm modern server remains alive after SDK setup
        run: |
          docker inspect -f 'CHUNKS_MODERN_CONTAINER status={{.State.Status}} exit={{.State.ExitCode}}' chunks-rtorrent
          if [ "$(docker inspect -f '{{.State.Running}}' chunks-rtorrent)" != true ]; then
            docker logs chunks-rtorrent | tail -n 80
            exit 1
          fi
          curl -fsS --max-time 5 -H "Content-Type: text/xml" \
            --data-binary @"$RUNNER_TEMP/version.xml" \
            http://127.0.0.1:18080/RPC2 -o "$RUNNER_TEMP/response.xml"
          grep -q '<methodResponse>' "$RUNNER_TEMP/response.xml"
      - name: Same read-only and mutation acceptance on the modern engine
        env:
          CHUNKS_DISPOSABLE_RT_URL: http://127.0.0.1:18080/RPC2
          CHUNKS_DISPOSABLE_TARGET_DIR: ${{ runner.temp }}/chunks-data
        run: |
          status=0
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableServerTest' || status=1
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableMutationTest' \
            --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableFullJourneyTest' || status=1
          gradle --no-daemon :app:testDebugUnitTest --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableNativeStartedAddTest' || status=1
          CHUNKS_DISPOSABLE_AUTH_URL=http://127.0.0.1:18080/AUTHRPC \
            gradle --no-daemon :app:testDebugUnitTest \
              --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableAuthenticatedTest' || status=1
          grep -q 'tests="2" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableAuthenticatedTest.xml || status=1
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'io.github.gamesbyian.chunks.rpc.RTorrentDisposableDigestAuthenticatedTest' || status=1
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.RTorrentDisposableDigestAuthenticatedTest.xml || status=1
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for path in sorted(pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*Disposable*.xml")):
              root=ET.parse(path).getroot()
              print("CHUNKS_MODERN_RESULT", root.attrib.get("name"), "tests=" + root.attrib.get("tests","?"),
                    "failures=" + root.attrib.get("failures","?"), "errors=" + root.attrib.get("errors","?"),
                    "skipped=" + root.attrib.get("skipped","?"))
              for case in root.findall(".//testcase"):
                  failure=case.find("failure")
                  if failure is None:
                      failure=case.find("error")
                  if failure is not None:
                      print("CHUNKS_MODERN_FAILURE:", case.attrib.get("name","unknown"), (failure.attrib.get("message") or "")[:500])
          PY
          exit $status
      - name: Report modern server state and stop container
        if: always()
        run: |
          docker inspect -f 'CHUNKS_MODERN_CONTAINER_FINAL status={{.State.Status}} exit={{.State.ExitCode}}' chunks-rtorrent || true
          docker top chunks-rtorrent || true
          docker exec chunks-rtorrent sh -c 'ps -ef || ps' || true
          docker logs chunks-rtorrent 2>&1 | tail -n 60 || true
          tail -n 60 "$RUNNER_TEMP/chunks-nginx.error" || true
          docker rm -f chunks-rtorrent || true

