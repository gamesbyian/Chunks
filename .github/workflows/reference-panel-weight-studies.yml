name: Build experimental Chunks Reference Panel weight studies
on:
  push:
    # Feature branches are validated by pull_request; only merged changes trigger push builds.
    branches: [main]
    paths:
      - 'tools/build_reference_panel_weight_studies.py'
      - 'tools/reference_weight_profiles.json'
      - 'tools/render_reference_panel_weights.py'
      - 'tools/render_reference_glyph_grid.py'
      - 'tests/test_reference_glyph_grid.py'
      - 'tools/requirements-reference-panel-weights.txt'
      - 'tests/test_reference_panel_weights.py'
      - 'assets/fonts/source/reference-alphabet/**'
      - 'assets/fonts/chunks/**'
      - 'assets/fonts/experimental/ChunksReferencePanel-ExtraBold-Optical.otf'
      - 'assets/fonts/experimental/weight-studies/**'
  pull_request:
    paths:
      - 'tools/build_reference_panel_weight_studies.py'
      - 'tools/reference_weight_profiles.json'
      - 'tools/render_reference_panel_weights.py'
      - 'tools/render_reference_glyph_grid.py'
      - 'tests/test_reference_glyph_grid.py'
      - 'tools/requirements-reference-panel-weights.txt'
      - 'tests/test_reference_panel_weights.py'
      - 'assets/fonts/source/reference-alphabet/**'
      - 'assets/fonts/chunks/**'
      - 'assets/fonts/experimental/weight-studies/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chunks-panel-weight-studies-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-weight-studies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-reference-panel-weights.txt
      - name: Build four distinct topology-safe CFF weight studies and recompute optical kerning
        run: python tools/build_reference_panel_weight_studies.py
      - name: Verify format, all glyphs, accents, shaping, line metrics and deterministic CFF sources
        run: python -m unittest discover -s tests -p test_reference_panel_weights.py -v
      - name: Render five-weight actual-OTF comparison atlas
        run: python tools/render_reference_panel_weights.py
      - name: Generate 62-glyph by five-weight grids at 14, 24, 48 and 82px
        run: |
          python tools/render_reference_glyph_grid.py
          python -m unittest discover -s tests -p test_reference_glyph_grid.py -v
      - name: Publish only nonshipping study assets
        uses: actions/upload-artifact@v4
        with:
          name: chunks-reference-panel-five-weight-studies
          path: |
            assets/fonts/experimental/weight-studies/*
            assets/fonts/experimental/ChunksReferencePanel-ExtraBold-Optical.otf
            reference-panel-five-weights.png
            reference-panel-glyph-grid-*.png
            reference-panel-glyph-grid-metrics.json
            assets/fonts/source/OFL.txt
          retention-days: 30