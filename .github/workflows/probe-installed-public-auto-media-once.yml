name: One-shot installed full-inventory authorization and artwork acceptance
# Source-specific rerun after strict verified-complete media inventory witness; real public TVmaze.
on:
  push:
    branches:
      - "probe/installed-media-complete-inventory-20261110"
    paths:
      - ".github/workflows/probe-installed-public-auto-media-once.yml"
permissions:
  contents: read
concurrency:
  group: chunks-one-shot-installed-complete-inventory-20261110
  cancel-in-progress: true
jobs:
  installed-public-art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Exact source and scope preflight
        run: |
          test "$GITHUB_REF_NAME" = "probe/installed-public-automatic-media-20261110"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          python3 -m unittest discover -s tests -p test_installed_real_media.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build source-pinned production app and installed test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare disposable Android emulator KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Real TVmaze and image-CDN automatic row plus offline restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/probe_installed_public_auto_media.sh
      - name: Upload bounded real-public acceptance receipts and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-one-shot-installed-complete-inventory-media
          path: |
            ${{ runner.temp }}/chunks-installed-auto-media/*.xml
            ${{ runner.temp }}/chunks-installed-auto-media/*.png
            ${{ runner.temp }}/chunks-installed-auto-media/WITNESS.txt
            ${{ runner.temp }}/chunks-installed-auto-media/installed-apk-receipt.txt
          retention-days: 14
          if-no-files-found: warn
