name: Phone preview APK (isolated)
on:
  push:
    branches: [ci/phone-preview-20261101]
    paths: ['.github/workflows/phone-preview-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHUNKS_SIDE_BY_SIDE: '1'
      CHUNKS_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build standalone Chunks Preview APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify generated APK and digest
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk)" = 'io.github.gamesbyian.chunks.preview'
          mkdir -p preview-package
          cp app/build/outputs/apk/debug/app-debug.apk preview-package/Chunks-Preview-2026-11-01.apk
          (cd preview-package && sha256sum *.apk | tee SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          printf 'source_sha=%s\nvariant=debug\napplication_id=io.github.gamesbyian.chunks.preview\n' "$GITHUB_SHA" > preview-package/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Chunks-Preview-2026-11-01-${{ github.sha }}
          path: preview-package/
          if-no-files-found: error
          retention-days: 30
