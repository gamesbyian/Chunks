name: Audit accent contextual spacing in Chunks reference fonts
on:
  push:
    # Validate changes to feature branches via pull_request; build merged changes on main only.
    branches: [main]
    paths:
      - 'tools/audit_accent_context.py'
      - 'tests/test_accent_context_audit.py'
      - 'assets/fonts/experimental/accent-studies/**'
      - '.github/workflows/chunks-accent-context-audit.yml'
  pull_request:
    paths:
      - 'tools/audit_accent_context.py'
      - 'tests/test_accent_context_audit.py'
      - 'assets/fonts/experimental/accent-studies/**'
      - '.github/workflows/chunks-accent-context-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-contextual-advances:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Audit all accent prototypes in eight shaped contexts
        run: python tools/audit_accent_context.py --out accent-context-audit.json
      - name: Validate diagnostic metrics
        run: python -m unittest discover -s tests -p test_accent_context_audit.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-accent-context-audit
          path: accent-context-audit.json
          retention-days: 30
