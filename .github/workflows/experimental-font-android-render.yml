name: Experimental Chunks font native Android text-size acceptance
on:
  pull_request:
    paths:
      - 'app/src/androidTest/java/io/github/gamesbyian/chunks/ExperimentalTypefaceNativeInstrumentedTest.kt'
      - 'assets/fonts/experimental/stacked-studies/**'
      - 'tools/export_native_font_screenshots.sh'
      - 'tools/assert_debug_stacked_font_assets.sh'
      - '.github/workflows/experimental-font-android-render.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chunks-font-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-font-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install compile Android SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Stage experimental OTFs only into debug app assets for native test
        run: |
          test ! -d app/src/main/assets/referenceFonts
          mkdir -p app/src/debug/assets/referenceFonts
          for style in Regular Medium Semibold Bold ExtraBold; do
            face="assets/fonts/experimental/stacked-studies/ChunksReferencePanel-${style}-Stacked.otf"
            test -s "$face"
            cp "$face" app/src/debug/assets/referenceFonts/
            sha256sum "$face"
          done
          test "$(find app/src/debug/assets/referenceFonts -type f -name '*.otf' | wc -l)" -eq 5
      - name: Prepare API 35 x86_64 emulator hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run installed Android TextView CFF rendering tests at 100% and 200%
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            bash tools/assert_debug_stacked_font_assets.sh
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.gamesbyian.chunks.ExperimentalTypefaceNativeInstrumentedTest
            bash tools/export_native_font_screenshots.sh
      - name: Retain exact Android raster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-experimental-stacked-native-android-text-renders
          path: |
            ${{ runner.temp }}/chunks-stacked-android-font/
            app/build/outputs/androidTest-results/connected/
          retention-days: 30
          if-no-files-found: warn
