name: Build five Chunks reference-dotless accented OTF variants
on:
  push:
    paths:
      - 'tools/build_reference_dotless_accents.py'
      - 'tools/build_reference_accent_kerned.py'
      - 'tools/build_reference_accent_studies.py'
      - 'tools/render_reference_dotless.py'
      - 'tests/test_reference_dotless_accents.py'
      - 'assets/fonts/experimental/accent-studies/**'
      - 'assets/fonts/experimental/dotless-kerned/**'
      - 'assets/fonts/chunks/**'
      - '.github/workflows/reference-panel-dotless-kerned.yml'
  pull_request:
    paths:
      - 'tools/build_reference_dotless_accents.py'
      - 'tools/build_reference_accent_kerned.py'
      - 'tools/build_reference_accent_studies.py'
      - 'tools/render_reference_dotless.py'
      - 'tests/test_reference_dotless_accents.py'
      - 'assets/fonts/experimental/accent-studies/**'
      - 'assets/fonts/experimental/dotless-kerned/**'
      - 'assets/fonts/chunks/**'
      - '.github/workflows/reference-panel-dotless-kerned.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chunks-dotless-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build-five-dotless-faces:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned font and shaping libraries
        run: python -m pip install -r tools/requirements-chunks-font.txt
      - name: Compile and optically kern the five experimental dotless i/j faces
        run: |
          for weight in 400 500 600 700 800; do
            python tools/build_reference_dotless_accents.py --weights "$weight"
          done
      - name: Prove all five CFFs, 856 codepoints, source fidelity and ink clearance
        run: python -m unittest discover -s tests -p test_reference_dotless_accents.py -v
      - name: Render comparison from actual compiled CFF/OTF fonts
        run: python tools/render_reference_dotless.py
      - name: Upload new nonshipping typeface alternatives and source license
        uses: actions/upload-artifact@v4
        with:
          name: chunks-five-reference-dotless-kerned-otfs
          path: |
            assets/fonts/experimental/dotless-kerned/*
            reference-dotless-five-weights.png
            assets/fonts/source/OFL.txt
          retention-days: 30
      - name: Commit deterministic OTF binaries only to this feature branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/experimental/dotless-kerned
          if ! git diff --cached --quiet; then
            git commit -m 'build(fonts): check in five reference dotless CFF candidates'
            branch="${GITHUB_REF#refs/heads/}"
            for attempt in 1 2 3; do
              git fetch origin "$branch"
              git rebase "origin/$branch"
              if git push origin "HEAD:$branch"; then exit 0; fi
            done
            echo 'Concurrent changes prevented safe artifact commit' >&2
            exit 1
          fi
