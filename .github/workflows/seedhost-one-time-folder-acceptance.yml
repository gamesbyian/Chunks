name: One-time Seedhost empty-folder acceptance

# An owner-authorized one-shot acceptance experiment. The first main push
# that introduces this workflow may create exactly one empty test directory.
# Reruns and later pushes can never repeat the mutation.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seedhost-one-time-folder-acceptance.yml

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-one-time-folder-acceptance
  cancel-in-progress: false

jobs:
  verify-one-empty-directory:
    if: ${{ github.repository == 'gamesbyian/Chunks' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: One authorized empty folder and independent verification
        env:
          CHUNKS_LIVE_RUTORRENT_URL: https://ianseeds.wood.seedhost.eu/rutorrent/
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          CHUNKS_HOST_FOLDER_READONLY: authorized
          CHUNKS_HOST_FOLDER_CREATE: authorized
          CHUNKS_HOST_FOLDER_RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$CHUNKS_LIVE_RUTORRENT_USER" && test -n "$CHUNKS_LIVE_RTORRENT_PASS" || {
            echo '::error::Authenticated test credentials unavailable; nothing submitted'
            exit 1
          }
          private_log=$(mktemp)
          trap 'rm -f "$private_log"' EXIT
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostDirectoryAcceptanceTest > "$private_log" 2>&1
          test_exit=$?
          set -e
          python3 - "$test_exit" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostDirectoryAcceptanceTest.xml')
          if not path.exists():
              print('CHUNKS_CREATE_ONCE: missing private test receipt; no replay')
              raise SystemExit(1)
          root = ET.parse(path).getroot()
          output = (root.findtext('system-out') or '').splitlines()
          safe_prefixes = (
              'CHUNKS_SEEDHOST_FOLDER: browse-verified',
              'CHUNKS_SEEDHOST_FOLDER: filemanager-root-verified',
              'CHUNKS_SEEDHOST_FOLDER: filemanager-reason',
              'CHUNKS_SEEDHOST_FOLDER: create-outcome',
              'CHUNKS_SEEDHOST_FOLDER: created-single-child-and-independently-relisted')
          for line in output:
              if line.startswith(safe_prefixes):
                  print(line[:180])
          success = (sys.argv[1] == '0' and int(root.get('tests', '0')) == 1
              and all(int(root.get(k, '0')) == 0 for k in ('failures','errors','skipped'))
              and any(l.startswith('CHUNKS_SEEDHOST_FOLDER: created-single-child-and-independently-relisted')
                      for l in output))
          print('CHUNKS_CREATE_ONCE: result=' + ('verified' if success else 'unverified; do not retry'))
          raise SystemExit(0 if success else 1)
          PY
