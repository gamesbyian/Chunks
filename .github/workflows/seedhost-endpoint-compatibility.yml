name: Seedhost endpoint compatibility (manual plus one trusted-main read-only browse acceptance)

# One main-only push when this workflow changes proves the real directory
# provider read-only, without involving untrusted pull requests or a write.
# Subsequent optional create testing is workflow_dispatch only and is never
# executed on push or rerun.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seedhost-endpoint-compatibility.yml
      - app/src/main/java/io/github/gamesbyian/chunks/rpc/RuTorrentFileManager.kt
      - app/src/test/java/io/github/gamesbyian/chunks/rpc/SeedhostDirectoryAcceptanceTest.kt
  workflow_dispatch:
    inputs:
      profile:
        description: 'Exact Seedhost endpoint profile (SCGI HTTPS is an UNVERIFIED candidate)'
        required: true
        type: choice
        default: primary-rutorrent-https
        options:
          - primary-rutorrent-https
          - second-rutorrent-https
          - third-rutorrent-https
          - primary-scgi-https-candidate
      probe_folders:
        description: 'Probe real authenticated ruTorrent _getdir and File Manager roots (read-only)'
        type: boolean
        default: false
      create_test_folder:
        description: 'Authorize exactly one empty child folder on primary Seedhost; no automatic cleanup'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chunks-seedhost-endpoint-compatibility
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        run: |
          printf "y\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run one non-mutating authenticated version and main-view probe
        env:
          # Every option is a fixed, credential-free HTTPS endpoint. Do not
          # synthesize guessed RPC2/RPC3 mounts from the Transdrone screenshot.
          CHUNKS_LIVE_RUTORRENT_URL: ${{ inputs.profile == 'second-rutorrent-https' && 'https://ianseeds.wood.seedhost.eu/rutorrent2/' || inputs.profile == 'third-rutorrent-https' && 'https://ianseeds.wood.seedhost.eu/rutorrent3/' || inputs.profile == 'primary-scgi-https-candidate' && 'https://wood.seedhost.eu/ianseeds/RPC1' || 'https://ianseeds.wood.seedhost.eu/rutorrent/' }}
          CHUNKS_LIVE_RTORRENT_USER: ${{ (inputs.profile == 'second-rutorrent-https' || inputs.profile == 'third-rutorrent-https') && 'ianseeds' || secrets.rtorrent_user }}
          # Select the secret NAME before resolving it. A missing secondary
          # password must never fall back to the primary password.
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets[inputs.profile == 'second-rutorrent-https' && 'rTorrent_pass2' || inputs.profile == 'third-rutorrent-https' && 'rtorrent_pass3' || 'rtorrent_pass'] }}
        run: |
          test -n "$CHUNKS_LIVE_RUTORRENT_URL"
          test -n "$CHUNKS_LIVE_RTORRENT_USER"
          test -n "$CHUNKS_LIVE_RTORRENT_PASS" || { echo '::error::Selected profile password secret is absent'; exit 1; }
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostAdapterSmokeTest
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostAdapterSmokeTest.xml')
          root = ET.parse(report).getroot()
          output = root.findtext('system-out') or ''
          success = ('CHUNKS_KOTLIN_SEEDHOST_READONLY: authenticated version and main-view list passed;' in output
                     and all(int(root.get(name, '0')) == 0 for name in ('failures', 'errors', 'skipped')))
          if not success:
              raise SystemExit('Read-only adapter proof was absent; no success claim')
          print('CHUNKS_SEEDHOST_ENDPOINT: selected profile verified by Kotlin version and main-view reads')
          PY

      - name: Reject invalid folder-acceptance scope before any test-folder mutation
        if: ${{ inputs.probe_folders && inputs.profile != 'primary-rutorrent-https' || inputs.create_test_folder && (!inputs.probe_folders || inputs.profile != 'primary-rutorrent-https') }}
        run: |
          echo '::error::Folder acceptance is authorized only for the selected primary ruTorrent profile'
          exit 1
      - name: Verify real primary folder browse and optionally one explicitly authorized new folder
        if: ${{ (github.event_name == 'push' || inputs.probe_folders && inputs.profile == 'primary-rutorrent-https') && github.run_attempt == 1 }}
        env:
          CHUNKS_LIVE_RUTORRENT_URL: "https://ianseeds.wood.seedhost.eu/rutorrent/"
          CHUNKS_LIVE_RTORRENT_USER: ${{ secrets.rtorrent_user }}
          CHUNKS_LIVE_RTORRENT_PASS: ${{ secrets.rtorrent_pass }}
          CHUNKS_HOST_FOLDER_READONLY: authorized
          CHUNKS_HOST_FOLDER_CREATE: ${{ inputs.create_test_folder && 'authorized' || '' }}
          CHUNKS_HOST_FOLDER_RUN_ID: ${{ github.run_id }}
        run: |
          private_log=$(mktemp)
          trap 'rm -f "$private_log"' EXIT
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest \
            --tests io.github.gamesbyian.chunks.rpc.SeedhostDirectoryAcceptanceTest > "$private_log" 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-io.github.gamesbyian.chunks.rpc.SeedhostDirectoryAcceptanceTest.xml')
          if not path.exists():
              print('CHUNKS_SEEDHOST_FOLDER: test-receipt-missing; private output withheld')
              raise SystemExit(1)
          root = ET.parse(path).getroot()
          lines = (root.findtext('system-out') or '').splitlines()
          for line in lines:
              if line.startswith('CHUNKS_SEEDHOST_FOLDER: '):
                  print(line[:180])
          ok = (int(root.get('tests', '0')) == 1
                and all(root.get(field) == '0' for field in ('failures', 'errors', 'skipped'))
                and sys.argv[1] == '0'
                and any(l.startswith('CHUNKS_SEEDHOST_FOLDER: browse-verified') for l in lines))
          print('CHUNKS_SEEDHOST_FOLDER: real-host-acceptance=' + ('passed' if ok else 'failed'))
          raise SystemExit(0 if ok else 1)
          PY
