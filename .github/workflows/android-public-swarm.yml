name: Android public peer swarm

# Real Internet peer evidence for the app's native engine on an API35
# emulator: collect the official Debian netinst torrent (web seeds stripped,
# only bttracker.debian.org kept), then download a bounded hash-verified byte
# budget from ordinary BitTorrent peers. No secrets, no rTorrent. Emulator
# behind the runner's NAT; not a physical handset or mobile network.
on:
  workflow_dispatch:
    inputs:
      budget_mib:
        description: "Hash-verified MiB to download before stopping (1-256)"
        type: number
        default: 16
        required: true
      seconds:
        description: "Time limit for peers to deliver the budget (30-1800)"
        type: number
        default: 600
        required: true
      interrupt:
        description: "Kill the app mid-download after the budget, then verify restore and continuation"
        type: boolean
        default: false
      doze:
        description: "Force deep Doze during a foreground-service download and record whether bytes keep arriving"
        type: boolean
        default: false
      controlled_doze:
        description: "Use one disposable verified host peer for Doze, without Internet swarm discovery"
        type: boolean
        default: false
      netflap:
        description: "Turn Wi-Fi and mobile data off for 30 s mid-download, then require verified growth to resume"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chunks-android-swarm-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  android-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select exactly one acceptance experiment (offline, fail closed)
        id: mode
        env:
          CHUNKS_INTERRUPT: ${{ inputs.interrupt }}
          CHUNKS_DOZE: ${{ inputs.doze }}
          CHUNKS_NETFLAP: ${{ inputs.netflap }}
          CHUNKS_CONTROLLED_DOZE: ${{ inputs.controlled_doze }}
        run: |
          set -euo pipefail
          if [[ "$CHUNKS_CONTROLLED_DOZE" == true && "$CHUNKS_DOZE" != true ]]; then
            echo "::error::Controlled peer is available only for the Doze experiment"
            exit 1
          fi
          script="$(bash tools/select_android_public_swarm_mode.sh "$CHUNKS_INTERRUPT" "$CHUNKS_DOZE" "$CHUNKS_NETFLAP")"
          printf 'script=%s\n' "$script" >> "$GITHUB_OUTPUT"
          printf 'CHUNKS_SWARM_MODE selected=%s\n' "$script"
      - name: Stage a controlled independent peer and synthetic pieces
        if: inputs.controlled_doze
        env:
          SECONDS_LIMIT: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          [[ "$SECONDS_LIMIT" =~ ^[0-9]{2,4}$ && "$SECONDS_LIMIT" -ge 30 && "$SECONDS_LIMIT" -le 1800 ]]
          bash tools/apt_install_retry.sh python3-libtorrent
          peer="$RUNNER_TEMP/chunks-doze-peer"
          mkdir -p "$peer"
          /usr/bin/python3 tools/seed_doze_fixture.py "$peer" > "$peer/peer.log" 2>&1 &
          echo "$!" > "$peer/pid"
          for _ in $(seq 1 120); do
            if [[ -f "$peer/ready" ]]; then break; fi
            kill -0 "$(cat "$peer/pid")"
            sleep 0.5
          done
          test -f "$peer/ready"
          {
            echo "CHUNKS_PUBLIC_SWARM_TORRENT=$peer/fixture.torrent"
            echo "CHUNKS_PUBLIC_SWARM_SECONDS=$SECONDS_LIMIT"
            echo "CHUNKS_DOZE_CONTROLLED_PEER=1"
          } >> "$GITHUB_ENV"
      - name: Collect the Debian netinst torrent (no web seeds, Debian tracker only)
        if: '!inputs.controlled_doze'
        env:
          BUDGET_MIB: ${{ inputs.budget_mib }}
          SECONDS_LIMIT: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          [[ "$BUDGET_MIB" =~ ^[0-9]{1,3}$ && "$BUDGET_MIB" -ge 1 && "$BUDGET_MIB" -le 256 ]] || { echo "::error::Invalid budget"; exit 1; }
          [[ "$SECONDS_LIMIT" =~ ^[0-9]{2,4}$ && "$SECONDS_LIMIT" -ge 30 && "$SECONDS_LIMIT" -le 1800 ]] || { echo "::error::Invalid time limit"; exit 1; }
          python3 -I tools/public_fixture_collector.py --debian-netinst \
            --max-total-mib 4096 --output-dir "$RUNNER_TEMP/public"
          python3 -I -c 'import json,os;t=json.load(open(os.environ["RUNNER_TEMP"]+"/public/manifest.json"))["torrent"];assert t["infohash_v1"] and t["tracker_retained"];print("CHUNKS_ANDROID_SWARM_SOURCE:",t["name"],t["infohash_v1"],t["total_bytes"])'
          {
            echo "CHUNKS_PUBLIC_SWARM_TORRENT=$RUNNER_TEMP/public/source-sanitized.torrent"
            echo "CHUNKS_PUBLIC_SWARM_BUDGET_BYTES=$(( BUDGET_MIB * 1048576 ))"
            echo "CHUNKS_PUBLIC_SWARM_SECONDS=$SECONDS_LIMIT"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install pinned Android compile toolchain
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and instrumented tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: API35 native engine downloads a verified budget from ordinary peers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/${{ steps.mode.outputs.script }}
      - name: Read back independent seeder bytes and stop the controlled peer
        if: always() && inputs.controlled_doze
        env:
          ANDROID_OBSERVATION: ${{ job.status }}
        run: |
          peer="$RUNNER_TEMP/chunks-doze-peer"
          if [[ -f "$peer/pid" ]]; then
            kill -TERM "$(cat "$peer/pid")" || true
            for _ in $(seq 1 20); do
              grep -q 'CHUNKS_DOZE_PEER: payload_uploaded_bytes=' "$peer/peer.log" && break
              sleep 0.25
            done
            cat "$peer/peer.log"
          fi
          if [[ "$ANDROID_OBSERVATION" == success ]]; then
            grep -Fxq 'CHUNKS_DOZE_PEER: seed_verified_bytes=67108864' "$peer/peer.log"
            uploaded="$(sed -n 's/^CHUNKS_DOZE_PEER: payload_uploaded_bytes=\([0-9]\+\)$/\1/p' "$peer/peer.log")"
            [[ "$uploaded" =~ ^[0-9]{1,9}$ ]] && (( uploaded >= 4194304 ))
          fi
